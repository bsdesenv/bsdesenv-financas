<style>
:root {

.logo { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px; background: var(--acento);
  display: inline-flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 9px; }
.logo i { width: 5px; border-radius: 2px; background: color-mix(in srgb, var(--acento-tinta) 60%, var(--acento)); }
.logo i:nth-child(1) { height: 10px; } .logo i:nth-child(2) { height: 18px; background: var(--acento-tinta); } .logo i:nth-child(3) { height: 7px; }
.selo { font-size: .8rem; color: var(--tinta-2); text-align: right; }

.progresso { margin-bottom: 14px; }

.barra { height: 6px; margin-top: 8px; border-radius: 6px; background: var(--linha); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--acento); }

.trilha-det { margin: -2px 0 14px; }

.passos li + li::before { content: ''; position: absolute; left: 13px; top: -14px; height: 14px; border-left: 2px solid var(--linha); }
.passos .bolinha { flex: 0 0 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--linha); background: var(--cartao); font-size: .8rem; font-weight: 700; }

.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

label { display: block; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; min-height: 48px; padding: 0 12px; border-radius: var(--raio-m); border: 1px solid var(--linha); background: var(--fundo);

.aviso { background: var(--aviso-fundo); color: var(--aviso-tinta); border-radius: var(--raio-m); padding: 12px 14px; margin-top: 12px; font-size: .92rem; }
.erro-msg { background: var(--erro-fundo); color: var(--erro); border-radius: var(--raio-m); padding: 12px 14px; margin-top: 12px; }
.erro-bloco { border-color: var(--erro); }
.erro-bloco h2 { color: var(--erro); }
.erro-bloco .desfeito { background: var(--ok-fundo); color: var(--ok); border-radius: var(--raio-m); padding: 10px 14px; font-size: .92rem; }
.erro-bloco details { margin-top: 12px; }
.erro-bloco summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--tinta-2); font-size: .92rem; }
.erro-bloco pre { margin: 0 0 10px; padding: 10px 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--fundo); border: 1px solid var(--linha); border-radius: var(--raio-p); font: .8rem/1.45 ui-monospace, Menlo, Consolas, monospace; }
.status { min-height: 1.4em; margin: 0 0 8px; font-size: .85rem; color: var(--tinta-3); }
.girando { display: inline-block; width: 1em; height: 1em; margin-right: 8px; vertical-align: -2px; border-radius: 50%;
  border: 2px solid var(--linha); border-top-color: var(--acento); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .girando { animation-duration: 2.4s; } }
@media (prefers-reduced-motion: no-preference) { .botao { transition: opacity .15s; } .barra i { transition: width .3s; } }
ul.novidades { margin: 8px 0 0; padding-left: 20px; }

.acao-barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: var(--cartao); border-top: 1px solid var(--linha); }
.acao-barra:empty { display: none; }
.acao-barra .botao { flex: 1; min-height: 52px; }
footer { padding: 8px 16px 16px; font-size: .8rem; color: var(--tinta-3); text-align: center; }

body.sem-trilha .progresso, body.sem-trilha .trilha-det, body.sem-trilha .trilha-pc { display: none; }
body.sem-trilha .corpo { max-width: 620px; margin: 0 auto; grid-template-columns: minmax(0, 1fr); }

@media (min-width: 900px) {
  body { padding-bottom: 0; }
  main { padding: 28px 24px 8px; }
  .progresso, .trilha-det { display: none; }
  .olho { display: block; }
  .corpo { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
  .trilha-pc { display: block; position: sticky; top: 24px; padding: 8px 4px; }
  .trilha-pc h3 { color: var(--tinta-3); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .passo { max-width: 620px; }
  .acao-barra { position: static; padding: 0; background: none; border: 0; margin: 0 0 14px; }
  .acao-barra .botao { flex: 0 1 auto; min-height: 48px; }
  footer { padding-bottom: 24px; }
  h2 { font-size: 1.5rem; }
}
</style>

<script>
(function () {
  var SCRIPT = document.body.getAttribute('data-script') || '';
  var IMPL = document.body.getAttribute('data-implantacao') || '';
  var URL_CONFIG = 'https:\/\/script.google.com/home/usersettings';
  var URL_MAO = 'https:\/\/github.com/bsdesenv/bsdesenv-financas/blob/main/docs/INSTALAR.md#instalar-à-mão';
  var PASSOS = ['Autorizar', 'Ligar a API', 'Escolher o nome', 'Instalar'];
  var raiz = document.getElementById('conteudo');
  var barraAcao = document.getElementById('acao');
  /* passo: 1 a 4 na trilha; 0 fora dela (atualizar, erros sem passo). */
  var passo = 0;
  /* ultimo: o último estado() recebido. */
  var ultimo = null;
  var nomePlanilha = 'Finanças';
  /* seq: só a resposta da chamada mais nova vale. emVoo: trava para a conferência sozinha não se sobrepor. */
  var seq = 0;
  var emVoo = false;

  /* Todo texto vindo do servidor ou do GitHub passa por aqui antes de entrar no HTML. */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* Só aceita links do Google em https para botões (o servidor já os monta, mas a página confere).
     Sem barra dupla fora de comentário (por isso [/] e https:\/\/): ver testes/htmlservice.test.mjs. */
  function link(url) {
    return /^https:\/\/(script|docs|drive)\.google\.com[/]/.test(url || '') ? esc(url) : '#';
  }
  function maior(a, b) {
    var x = a.split('.').map(Number), y = b.split('.').map(Number);
    for (var i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i];
    return false;
  }
  /* O Apps Script entrega o erro do servidor como "Error: texto"; a pessoa só precisa do texto. */
  function msg(e) {
    return String((e && e.message) || e || 'Algo deu errado. Tente de novo.').replace(/^(Error|Exception|Erro):\s*/, '');
  }
  function status(texto) { document.getElementById('status').textContent = texto || ''; }

  /* ---------- moldura: trilha, progresso e barra de ação ---------- */
  function trilhaHtml(n) {
    return PASSOS.map(function (nome, i) {
      var k = i + 1, cls = k < n ? 'feito' : (k === n ? 'atual' : 'futuro');
      return '<li class="' + cls + '"' + (k === n ? ' aria-current="step"' : '') + '><span class="bolinha" aria-hidden="true">' + (k < n ? '\u2713' : k) + '</span>' +
        '<span>' + nome + '<span class="so-leitor">' + (k < n ? ' (feito)' : (k === n ? ' (passo atual)' : '')) + '</span></span></li>';
    }).join('');
  }
  function moldura(n) {
    var t = n > 0;
    document.body.classList.toggle('sem-trilha', !t);
    ['progresso', 'trilha-det', 'trilha-pc'].forEach(function (id) { document.getElementById(id).hidden = !t; });
    if (!t) return;
    document.getElementById('prog-txt').textContent = 'Passo ' + n + ' de ' + PASSOS.length;
    document.getElementById('prog-nome').textContent = PASSOS[n - 1];
    document.getElementById('prog-preenchido').style.width = (n * 100 / PASSOS.length) + '%';
    document.getElementById('prog-barra').setAttribute('aria-valuenow', String(n));
    document.getElementById('trilha-m').innerHTML = trilhaHtml(n);
    document.getElementById('trilha-d').innerHTML = trilhaHtml(n);
  }
  /* html: conteúdo do passo; acao: botão principal (fica fixo embaixo no celular); n: passo da trilha (0 = fora dela). */
  function mostrar(html, acao, n) {
    passo = n || 0;
    moldura(passo);
    raiz.innerHTML = (passo ? '<p class="olho">Passo ' + passo + ' de ' + PASSOS.length + '</p>' : '') + html;
    barraAcao.innerHTML = acao || '';
    var h = raiz.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus(); }
  }
  function ligar(id, fn) { var b = document.getElementById(id); if (b) b.onclick = fn; }

  /* ---------- erro que diz o que fazer ---------- */
  /* o: { etapa, texto, desfeito (opcional), detalhe (opcional), repetir (função) } */
  function erroHtml(o) {
    return '<section class="cartao erro-bloco" role="alert"><h2>Parou em: ' + esc(o.etapa) + '</h2>' +
      '<p>' + esc(o.texto) + '</p>' +
      (o.desfeito ? '<p class="desfeito"><strong>O que foi desfeito:</strong> ' + esc(o.desfeito) + '</p>' : '') +
      '<div class="acoes"><button class="botao" id="erro-repetir" type="button">Tentar de novo</button>' +
      '<a class="botao sec" id="erro-mao" href="' + URL_MAO + '" target="_blank" rel="noopener">Instalar à mão</a></div>' +
      '<details><summary>Detalhe técnico</summary><pre id="erro-detalhe">' + esc(o.detalhe || o.texto) + '</pre>' +
      '<button class="botao sec" id="erro-copiar" type="button">Copiar</button></details></section>';
  }
  function ligarErro(o) {
    ligar('erro-repetir', o.repetir);
    ligar('erro-copiar', function () { copiar(document.getElementById('erro-detalhe').textContent, this); });
  }
  function copiar(texto, botao) {
    function feito(ok) { botao.textContent = ok ? 'Copiado' : 'Selecione e copie à mão'; setTimeout(function () { botao.textContent = 'Copiar'; }, 2500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(texto).then(function () { feito(true); }, function () { feito(false); });
    }
    var t = document.createElement('textarea');
    t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (x) { ok = false; }
    t.remove(); feito(ok);
  }
  function mostrarErro(o, n) {
    mostrar(erroHtml(o), '', n);
    ligarErro(o);
  }

  /* ---------- estado e conferência ---------- */
  /* Passo da trilha que o estado pede; 0 quando o instalador está atualizando um projeto. */
  function passoDe(e) {
    if (e.autorizar) return 1;
    if (!e.apiLigada) return 2;
    return SCRIPT ? 0 : 3;
  }
  /* silencioso: conferência ao voltar à aba. Não repinta se o passo não mudou e ignora falha. */
  function consultar(silencioso) {
    if (silencioso && emVoo) return;
    var meu = ++seq;
    emVoo = true;
    if (silencioso) status('Conferindo\u2026');
    else mostrar('<section class="cartao"><p><span class="girando" aria-hidden="true"></span>Verificando\u2026</p></section>');
    google.script.run.withSuccessHandler(function (e) {
      if (meu !== seq) return;
      emVoo = false; status('');
      ultimo = e;
      if (silencioso && passoDe(e) === passo) return;
      desenhar(e);
    }).withFailureHandler(function (err) {
      if (meu !== seq) return;
      emVoo = false; status('');
      if (silencioso) return;
      var o = { etapa: 'Conferir o instalador', texto: msg(err), desfeito: 'Nada foi criado nem alterado no seu Drive.', repetir: carregar };
      mostrarErro(o, 0);
    }).estado(SCRIPT, IMPL);
  }
  function carregar() { consultar(false); }
  /* AC-026: ao voltar à aba, quem espera a autorização ou a chave da API não precisa clicar. */
  function conferir() {
    if (passo === 1 || passo === 2) consultar(true);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') conferir(); });
  window.addEventListener('focus', conferir);

  /* Mostra só o que falta: autorizar, ligar a API ou, com tudo pronto, instalar/atualizar. */
  function desenhar(e) {
    if (e.autorizar) return desenharAutorizar(e.autorizar);
    if (!e.apiLigada) return desenharApi();
    if (SCRIPT) return desenharAtualizar(e);
    if (!e.versao) return mostrarErro({ etapa: 'Consultar a versão publicada', texto: e.versaoErro || 'Não consegui consultar a versão publicada.', desfeito: 'Nada foi criado nem alterado no seu Drive.', repetir: carregar }, 3);
    desenharNome();
  }

  function desenharAutorizar(url) {
    mostrar('<section class="cartao"><h2>Autorize o instalador</h2>' +
      '<p>Na tela do Google, marque <strong>todas</strong> as permissões (ou \u201cSelecionar tudo\u201d) e continue. Sem elas o instalador não consegue criar nem atualizar o Finanças.</p>' +
      '<div class="acoes"><button class="botao sec" id="de-novo" type="button">Já autorizei</button></div>' +
      '<p class="sub">Esperando você voltar\u2026 (confere sozinho quando a aba voltar)</p></section>',
      '<a class="botao" href="' + link(url) + '" target="_blank" rel="noopener">Autorizar</a>', 1);
    ligar('de-novo', carregar);
  }

  function desenharApi() {
    mostrar('<section class="cartao"><h2>Ligue a API do Apps Script</h2>' +
      '<p>Uma vez só: nas configurações do Apps Script, ligue a chave <strong>API Google Apps Script</strong>. É ela que deixa o instalador criar e atualizar o app no seu Drive.</p>' +
      '<div class="acoes"><button class="botao sec" id="de-novo" type="button">Já liguei</button></div>' +
      '<p class="sub">Esperando você voltar\u2026 (confere sozinho quando a aba voltar)</p></section>',
      '<a class="botao" href="' + URL_CONFIG + '" target="_blank" rel="noopener">Abrir as configurações \u2197</a>', 2);
    ligar('de-novo', carregar);
  }

  /* ---------- nome e o que será criado ---------- */
  /* AC-027: mostra antes de instalar o que vai mudar no Drive. */
  function painelCriar() {
    return '<section class="cartao criar" aria-labelledby="criar-t"><h3 id="criar-t">O que será criado</h3><ul class="lista-criar">' +
      '<li><span class="ico" aria-hidden="true">1</span><b>Uma planilha no seu Drive</b><span id="criar-nome">\u201c' + esc(nomePlanilha) + '\u201d</span></li>' +
      '<li><span class="ico" aria-hidden="true">2</span><b>Um projeto Apps Script vinculado</b><span>o código do app, dentro dessa planilha</span></li>' +
      '<li><span class="ico" aria-hidden="true">3</span><b>Um app da Web só seu</b><span>só você abre o endereço</span></li></ul>' +
      '<p class="sub">Nada sai da sua conta Google. O instalador não lê seus dados nem outras planilhas.</p></section>';
  }
  function desenharNome() {
    mostrar('<section class="cartao"><h2>Escolha o nome da planilha</h2>' +
      '<p>É o nome que aparece no seu Drive. Seus dados ficam só nela.</p>' +
      '<label for="nome">Nome da planilha</label><input id="nome" maxlength="80" value="' + esc(nomePlanilha) + '" autocomplete="off"></section>' + painelCriar(),
      '<button class="botao" id="continuar" type="button">Continuar</button>', 3);
    var campo = document.getElementById('nome');
    campo.oninput = function () {
      nomePlanilha = campo.value;
      document.getElementById('criar-nome').textContent = '\u201c' + (campo.value.trim() || 'Finanças') + '\u201d';
    };
    ligar('continuar', function () { nomePlanilha = campo.value.trim() || 'Finanças'; desenharInstalar(); });
  }

  function desenharInstalar() {
    var v = ultimo && ultimo.versao;
    mostrar('<section class="cartao"><h2>Instale o Finanças ' + esc(v.versao) + '</h2>' +
      '<p>Confira o que vai acontecer e toque em Instalar. Leva uns 20 segundos.</p>' +
      '<div class="acoes"><button class="botao sec" id="voltar" type="button">Voltar ao nome</button></div></section>' + painelCriar() + '<div id="area"></div>',
      '<button class="botao" id="instalar" type="button">Instalar o Finanças ' + esc(v.versao) + '</button>', 4);
    ligar('voltar', desenharNome);
    ligar('instalar', instalar);
  }

  function trabalhando(titulo) {
    document.getElementById('area').innerHTML = '<section class="cartao"><h2>' + esc(titulo) + '</h2>' +
      '<p class="sub"><span class="girando" aria-hidden="true"></span>Leva uns 20 segundos. Não feche esta página.</p></section>';
  }

  function instalar() {
    var botao = document.getElementById('instalar');
    botao.disabled = true;
    trabalhando('Instalando\u2026');
    google.script.run.withSuccessHandler(function (r) {
      mostrar('<section class="cartao"><h2>Pronto!</h2><p>O Finanças ' + esc(r.versao) + ' está instalado no seu Drive.</p>' +
        '<div class="acoes"><a class="botao" href="' + link(r.appUrl) + '" target="_blank" rel="noopener">Abrir o Finanças</a>' +
        '<a class="botao sec" href="' + link(r.planilhaUrl) + '" target="_blank" rel="noopener">Abrir a planilha</a></div>' +
        '<div class="aviso">Na primeira vez o Google pede para você autorizar o app (só a planilha dele). Ele aparece como \u201cnão verificado\u201d porque foi criado agora, na sua conta: o desenvolvedor é você.</div>' +
        '<p class="sub">Guarde o endereço do app nos favoritos ou adicione à tela inicial do celular. As próximas versões aparecem no próprio app, em Ajustes.</p></section>', '', 4);
    }).withFailureHandler(function (e) {
      var texto = msg(e);
      /* o servidor já diz se a planilha foi para a lixeira; a página só repete o que ele afirmou */
      var desfeito = /Nada ficou no seu Drive/.test(texto) ? 'A planilha criada foi para a lixeira. Nada ficou no seu Drive.' : '';
      mostrarErro({ etapa: 'Instalar o Finanças', texto: texto, desfeito: desfeito, repetir: desenharInstalar }, 4);
    }).instalar({ nome: nomePlanilha });
  }

  /* ---------- atualizar ---------- */
  function desenharAtualizar(e) {
    var a = e.alvo, v = e.versao;
    if (!a || e.alvoErro) return mostrar('<section class="cartao"><h2>Não deu para abrir o projeto</h2><p>' + esc(e.alvoErro || 'Não encontrei o projeto (ou você não tem acesso a ele).') + '</p></section>');
    if (!a.ehFinancas) return mostrar('<section class="cartao"><h2>Este projeto não é o Finanças</h2><p>Nada foi alterado.</p></section>');
    if (!v) {
      mostrar('<section class="cartao"><h2>Versão indisponível</h2><p>' + esc(e.versaoErro || 'Não consegui consultar a versão publicada.') + '</p>' +
        '<div class="acoes"><button class="botao" id="de-novo" type="button">Tentar de novo</button></div></section>');
      return ligar('de-novo', carregar);
    }
    var impl = a.implantacoes.filter(function (d) { return d.id === IMPL; })[0] || a.implantacoes[0];
    var voltar = impl ? '<a class="botao sec" href="' + link(impl.url) + '" target="_blank" rel="noopener">Voltar ao Finanças</a>' : '';
    if (!maior(v.versao, a.versaoAtual)) {
      return mostrar('<section class="cartao"><h2>Você já está na versão mais recente</h2><p>Versão instalada: ' + esc(a.versaoAtual) + '.</p><div class="acoes">' + voltar + '</div></section>');
    }
    mostrar('<section class="cartao"><h2>Nova versão disponível</h2><p>' + esc(a.versaoAtual) + ' \u2192 <strong>' + esc(v.versao) + '</strong>' + (v.data ? ' \u00b7 ' + esc(v.data) : '') + '</p>' +
      (v.novidades && v.novidades.length ? '<ul class="novidades">' + v.novidades.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<p class="sub">Só o código muda; os dados da planilha e o endereço do app continuam os mesmos.</p>' +
      '<div class="acoes"><button class="botao" id="atualizar" type="button">Atualizar para ' + esc(v.versao) + '</button></div></section><div id="area"></div>');
    var botao = document.getElementById('atualizar');
    botao.onclick = function () {
      botao.disabled = true;
      trabalhando('Atualizando\u2026');
      google.script.run.withSuccessHandler(function (r) {
        if (r.jaAtual) return mostrar('<section class="cartao"><h2>Você já está na versão mais recente</h2><div class="acoes">' + voltar + '</div></section>');
        var url = r.implantacoes && r.implantacoes[0];
        mostrar('<section class="cartao"><h2>Atualizado para ' + esc(r.versaoNova) + '!</h2>' +
          '<p>Recarregue o Finanças para usar a versão nova.</p>' +
          (r.extrasMantidos && r.extrasMantidos.length ? '<p class="sub">Arquivos seus mantidos: ' + esc(r.extrasMantidos.join(', ')) + '.</p>' : '') +
          '<div class="acoes">' + (url ? '<a class="botao" href="' + link(url) + '" target="_blank" rel="noopener">Abrir o Finanças</a>' : '') + '</div>' +
          '<p class="sub">Para voltar atrás: no editor do Apps Script, Implantar \u203a Gerenciar implantações, escolha a versão ' + esc(r.copiaSeguranca) + '.</p></section>');
      }).withFailureHandler(function (err) {
        document.getElementById('area').innerHTML = '';
        botao.disabled = false;
        var antigo = raiz.querySelector('.erro-msg'); if (antigo) antigo.remove();
        var d = document.createElement('div');
        d.className = 'erro-msg'; d.setAttribute('role', 'alert'); d.textContent = msg(err);
        raiz.appendChild(d);
      }).atualizar(SCRIPT, IMPL, v.versao);
    };
  }

  carregar();
})();
</script>
</body>
</html>
