/* ---------- Faixa de versão nova, atualização em curso e "O que mudou" ----------
   Guardado no navegador, por implantação (LS): 'versao-fechada' (a maior versão cuja faixa a
   pessoa fechou) e 'versao-vista' (a última versão que este navegador abriu). A atualização em
   curso fica só na memória da aba: se a aba for descartada, o recarregamento já traz a versão nova. */
const versaoGuardada = (k) => { const v = LS.ler(k); return VERSAO_OK.test(String(v)) ? String(v) : ''; };
const TEMPO_CONFERIR = 10000;
function faixaVersaoHtml() {
  const nova = atualizacaoNova();

  return `<div class="faixa-versao" role="region" aria-label="Versão nova disponível"><p>Versão ${esc(nova.versao)} disponível · `
    + '<button type="button" class="link" data-acao="tela" data-tela="ajustes" data-secao="atualizacoes" data-foco="faixa-versao-ver">Ver novidades</button></p>'
    + `<button type="button" class="icone" data-acao="faixa-versao-fechar" data-foco="faixa-versao-fechar" aria-label="Fechar o aviso da versão ${esc(nova.versao)}">${ic('fechar', 16)}</button></div>`;
}
function fecharFaixaVersao() {
  const nova = atualizacaoNova();

/** A pessoa clicou em "Atualizar para X": daqui em diante, ao voltar para a aba, o app confere o servidor. */
function marcarAtualizacaoEmCurso() {

}
function recarregarApp() {
  const url = String((S.dados && S.dados.urlApp) || '');

}
/** Ao voltar para a aba com atualização em curso: se o servidor já tem versão maior, avisa e espera a pessoa recarregar. */
async function conferirAtualizacaoEmCurso() {
  const c = S.atuEmCurso;
  if (!c || c.consultando || !S.dados || S.exemplo || Date.now() - c.ultima < TEMPO_CONFERIR) return;
  c.consultando = true; c.ultima = Date.now();

    const v = String(await chamar('versaoServidor'));
    if (S.atuEmCurso === c && VERSAO_OK.test(v) && compararVersoes(v, S.dados.versaoApp || '0.0.0') > 0) {
      S.atuEmCurso = null;

/** Novidades da versão aberta, se o versao.json guardado for dela; senão, lista vazia. */

/* ---------- Folha "Atualizar para X" ---------- */
function copiarTexto(texto) {
  const alternativa = () => {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto).then(() => true, () => alternativa());
  return Promise.resolve(alternativa());
}
const dicaArquivo = (a) => (a.nome === 'appsscript' ? 'Só se ele aparecer no editor (Configurações do projeto › Mostrar arquivo de manifesto).' : '');
function abrirAtualizar() {

          + `<button type="button" class="botao${feito ? '' : ' primario'} pequeno-toque" data-f="copiar" data-i="${i}" data-foco="atu-cp-${i}"${st.copiando === i ? ' disabled' : ''} aria-label="${feito ? 'Copiado' : 'Copiar'} ${esc(a.editor)}">${st.copiando === i ? 'Baixando…' : feito ? 'Copiado ✓' : 'Copiar'}</button>`

            + `<span class="atu-contador">${contagem()}</span>`
            + `<div class="atu-arquivos">${st.m.arquivos.map(linha).join('')}</div></li>`,

/* ---------- Avisos rápidos (com Desfazer) ---------- */
/* Pilha de Desfazer da sessão: um aviso novo não apaga o Desfazer do anterior; Ctrl+Z desfaz o mais recente. */
const desfazeres = [];
let avisoFixo = null;
function aviso(msg, { acao, fn, tipo = 'info', tempo, fixo = false } = {}) {
  const box = $('#avisos');
  const el = document.createElement('div');
  el.className = 'aviso ' + tipo;
  el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  el.innerHTML = `<span class="aviso-txt">${esc(msg)}</span>${acao ? `<button type="button" class="aviso-acao">${esc(acao)}</button>` : ''}`
    + `<button type="button" class="aviso-fechar" aria-label="Fechar aviso">${ic('fechar', 16)}</button>`;
  const duracao = tempo || (acao ? 10000 : 6500);
  let fechado = false; let timer = 0;
  // Aviso fixo (fixo: true) só some quando a pessoa age; outro aviso o cobre e ele volta quando o outro sai.
  const fechar = () => {
    if (fechado) return; fechado = true; clearTimeout(timer); el.classList.add('saindo'); setTimeout(() => el.remove(), 200);
    if (fixo) avisoFixo = null;
    else if (avisoFixo && el.isConnected) { const a = avisoFixo; aviso(a.msg, a.opc); }
  };
  const armar = () => { clearTimeout(timer); if (!fixo) timer = setTimeout(fechar, duracao); };
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('mouseleave', armar);
  el.addEventListener('focusin', () => clearTimeout(timer));
  el.addEventListener('focusout', (e) => { if (!el.contains(e.relatedTarget)) armar(); });
  el.querySelector('.aviso-fechar').addEventListener('click', fechar);
  const item = acao === 'Desfazer' && fn ? { msg, fn, feito: false } : null;
  if (item) { desfazeres.push(item); if (desfazeres.length > 10) desfazeres.shift(); }
  if (acao) {
    el.querySelector('.aviso-acao').addEventListener('click', () => {
      if (item) { if (item.feito) return; item.feito = true; }
      fechar(); if (fn) fn();
    });
  }
  if (fixo) avisoFixo = { msg, opc: { acao, fn, tipo, tempo, fixo } };
  // Um aviso visível por vez; os Desfazer anteriores continuam na pilha (Ctrl+Z).
  box.replaceChildren(el);
  armar();
}
/** Desfaz a ação mais recente que ainda não foi desfeita (Ctrl+Z no computador). */
function desfazerUltimo() {
  for (let i = desfazeres.length - 1; i >= 0; i--) {
    const it = desfazeres[i];
    desfazeres.splice(i, 1);
    if (it.feito) continue;
    it.feito = true;
    it.fn();
    aviso('Desfeito: ' + it.msg);
    return true;
  }
  aviso('Nada para desfazer.');
  return false;
}

/** Texto CSV (separador ponto e vírgula, BOM, texto que parece fórmula protegido) a partir de uma lista de linhas. */
function textoCSV(linhas) {
  return '\ufeff' + linhas.map((l) => l.map((x) => {
    let s = String(x);
    if (/^[=+\-@]/.test(s) && !/^-?\d/.test(s)) s = "'" + s;
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

function linhasTabelaAno(ano) {
  const meses = Array.from({ length: 12 }, (_, i) => i + 1);
  const linhas = [['Grupo', 'Categoria', ...meses.map(Mes), 'Total']];

      linhas.push([GRUPOS[g], c.nome, ...reais.map((r) => (r.qtd ? reaisCSV(r.soma) : '')), reaisCSV(reais.reduce((a, r) => a + r.soma, 0))]);

  linhas.push(rodape('Total de saídas', (r) => r.jaSaiu), rodape('Renda', (r) => r.recebida - r.transporte), rodape('Sobra', (r) => r.resultado));

let tBusca = 0;

// Campo de valor seleciona tudo ao receber foco: digitar substitui em vez de emendar.
document.addEventListener('focusin', (e) => { const el = e.target; if (el.matches && el.matches('input.valor')) setTimeout(() => { try { el.select(); } catch (err) { /* sem seleção */ } }, 0); });

function prenderFoco(e) {
  const f = pilha[pilha.length - 1]; if (!f) return;
  const foc = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', f.el).filter((x) => !x.disabled && x.offsetParent !== null);
  if (!foc.length) return;
  const i = foc.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); foc[foc.length - 1].focus(); }
  else if (!e.shiftKey && (i === foc.length - 1 || i === -1)) { e.preventDefault(); foc[0].focus(); }
}
function navegarPlanilha(e, td) {
  const r = Number(td.dataset.r); const c = Number(td.dataset.c);
  const mov = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (mov) {
    const alvo = $(`td.cel[data-r="${r + mov[0]}"][data-c="${c + mov[1]}"]`);
    if (alvo) { e.preventDefault(); td.tabIndex = -1; alvo.tabIndex = 0; alvo.focus(); }

document.addEventListener('keydown', (e) => {
  const alvo = e.target;

  if (e.key === 'Escape' && pilha.length) { e.preventDefault(); fecharFolha(); return; }
  if (e.key === 'Tab' && pilha.length) { prenderFoco(e); return; }
  if (!S.montado || pilha.length) return;

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z' && !digitando) { e.preventDefault(); desfazerUltimo(); return; }
  if (digitando || e.ctrlKey || e.metaKey || e.altKey) return;

    e.preventDefault();

    if (q && q.offsetParent !== null) q.focus(); else abrirNovo();
  }

function aplicarTema(t) {
  if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t;
  else delete document.documentElement.dataset.tema;
}
function montarApp() {

function mostrarErroCarga(e) {

  box.hidden = false;
  box.innerHTML = `<span class="logo logo-grande" aria-hidden="true"><i></i><i></i><i></i></span><h1 style="font-size:20px">Não consegui abrir a planilha</h1>`
    + `<p class="sub" style="max-width:420px">${esc(e.message)}</p><button type="button" class="botao primario" data-acao="recarregar">Tentar de novo</button>`;
}
let tRecarga = 0;
let tentativasCarga = 0;
async function carregarDoServidor({ inicial = false, filaSalva = null, filaAntiga = null } = {}) {
  if (S.exemplo) return;
  try {
    const d = JSON.parse(await chamar('carregar'));
    let antigasRecuperadas = 0;
    if (filaAntiga && filaAntiga.planilha === d.planilha.id && Array.isArray(filaAntiga.ops)) {
      const vistos = new Set(S.fila.map((op) => JSON.stringify(op)));
      const antigas = filaAntiga.ops.filter((op) => !vistos.has(JSON.stringify(op)));
      if (antigas.length) S.fila = S.fila.concat(antigas);
      antigasRecuperadas = antigas.length;
      LS.apagarAntigo('fila');
    }
    const pend = S.fila.length ? S.fila : (filaSalva && filaSalva.planilha === d.planilha.id && Array.isArray(filaSalva.ops) ? filaSalva.ops : []);
    for (const op of pend) { try { aplicarOp(d, op); } catch (err) { /* operação velha que não se aplica */ } }
    const recuperadas = inicial && !S.fila.length ? pend.length : (inicial ? antigasRecuperadas : 0);
    S.fila = pend.slice();
    S.dados = d; S.versao++;
    S.offline = false; S.falhas = 0; S.atualizando = false; S.ultimaSync = Date.now(); tentativasCarga = 0;
    aplicarTema(d.tema); LS.gravar('tema', d.tema);
    salvarCache(); persistirFila();
    if (!d.categorias.length) { mostrarBoasVindas(); return; }
    if (!S.montado) montarApp(); else render();
    fixarGuardar();
    if (recuperadas) aviso(`${recuperadas === 1 ? 'Uma alteração feita' : recuperadas + ' alterações feitas'} sem conexão ${recuperadas === 1 ? 'foi recuperada' : 'foram recuperadas'} e já está${recuperadas === 1 ? '' : 'ão'} sendo gravada${recuperadas === 1 ? '' : 's'}.`);
    if (S.fila.length) enviar();
  } catch (e) {
    S.atualizando = false; S.offline = true;
    if (S.montado) {
      renderSinc();
      if (!tentativasCarga) aviso('Sem conexão com a planilha. Mostrando a última cópia deste aparelho.', { tipo: 'erro' });
      tentativasCarga++;
      clearTimeout(tRecarga);
      tRecarga = setTimeout(() => carregarDoServidor({ inicial, filaSalva, filaAntiga }), [3, 6, 15, 30, 60][Math.min(tentativasCarga - 1, 4)] * 1000);
    } else {
      mostrarErroCarga(e);
    }
  }
}
/* Guardada antes de o histórico reescrever o endereço. */
const BUSCA_INICIAL = (() => { try { return location.search; } catch (e) { return ''; } })();
function lerAtalhosDaUrl() {
  const aplicar = (p) => {
    if (!p || !S.montado) return;
    const antes = { ano: S.ano, mes: S.mes };
    const ano = Number(p.ano); const mes = Number(p.mes);
    if (Number.isInteger(ano) && ano >= 1900 && ano <= 2200) S.ano = ano;
    if (Number.isInteger(mes) && mes >= 1 && mes <= 12) S.mes = mes;
    const mudouMes = S.ano !== antes.ano || S.mes !== antes.mes;
    if (p.tela && TELAS[p.tela] && p.tela !== S.tela) irPara(p.tela, { historico: false });
    else if (mudouMes) render();
    if (mudouMes) hist.replace(estadoHist(pilha.length));
    if (p.novo !== undefined) abrirNovo({ cat: p.novo && catPorId(p.novo) ? p.novo : null, hoje: true });
  };
  try {
    const g = typeof google !== 'undefined' && google.script && google.script.url;
    if (g) g.getLocation((loc) => aplicar(loc && loc.parameter));
    else aplicar(Object.fromEntries(new URLSearchParams(BUSCA_INICIAL)));
  } catch (e) { /* sem atalhos */ }
}
async function iniciar() {
  aplicarTema(LS.ler('tema') || 'auto');

      S.fila = filaSalva.ops.slice();
