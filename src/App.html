<script>
'use strict';
/* bsdesenv-financas — app que roda no navegador, servido pelo Apps Script. */

/* <dominio> A seção 1 vai até o marcador de fim e não toca no DOM nem no estado:
   testes/dominio.test.mjs roda este trecho no Node. */
/* =====================================================================
   1. Utilidades e regras de cálculo
   ===================================================================== */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MESES_C = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const Mes = (m) => cap(MESES[m - 1]);
const MesC = (m) => cap(MESES_C[m - 1]);
const GRUPOS = { fixo: 'Fixos', variavel: 'Variáveis', renda: 'Rendas' };
const ORDEM_GRUPOS = ['fixo', 'variavel', 'renda'];
/* Endereços aqui usam https:\/\/ (para o JavaScript, é a mesma barra dupla). O Google tira os
   comentários deste script antes de servir a página e às vezes confunde a barra dupla de um
   endereço com começo de comentário, cortando a linha: foi o que travou a 2.7.0.
   A regra completa está em testes/htmlservice.test.mjs. */
const URL_PROJETO = 'https:\/\/github.com/bsdesenv/bsdesenv-financas';
const _moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const _num = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const arred = (v) => Math.round((Number(v) || 0) * 100) / 100;
const moeda = (v) => _moeda.format(arred(v)).replace('-', '−');
const num = (v) => _num.format(arred(v)).replace('-', '−');
const _moedaInt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0 });
const moedaRedonda = (v) => { const r = Math.round(Number(v) || 0); return _moedaInt.format(r === 0 ? 0 : r).replace('-', '−'); };
const pct1 = (v) => (Number(v) || 0).toFixed(1).replace('.', ',');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const normal = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const novoId = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const novoGrupoParcela = () => 'p' + (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2) + '0000000000').slice(0, 10);
const diasNoMes = (a, m) => new Date(a, m, 0).getDate();
const chaveMes = (a, m) => a * 12 + (m - 1);
const deChave = (k) => ({ ano: Math.floor(k / 12), mes: (k % 12) + 1 });
const dois = (n) => String(n).padStart(2, '0');
const isoData = (a, m, d) => `${a}-${dois(m)}-${dois(d || 1)}`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function hoje() { const d = new Date(); return { ano: d.getFullYear(), mes: d.getMonth() + 1, dia: d.getDate() }; }
function faseDe(ano, mes, h) {
  const a = chaveMes(ano, mes); const b = chaveMes(h.ano, h.mes);
  return a < b ? 'passado' : a > b ? 'futuro' : 'atual';
}
function fase(ano, mes) { return faseDe(ano, mes, hoje()); }
function hora(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function corDe(id) { let h = 7; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 10; }

/**
 * "1.234,56" | "1.500" | "1200" | "12.5" | "R$ 89,90" | "−50" → número. Texto inválido → null.
 * Aceita o sinal "−" (U+2212), que é o que o app mostra nos valores negativos.
 */
function paraNumero(txt) {
  let t = String(txt ?? '').replace(/−/g, '-').replace(/\s/g, '').replace(/^([-+]?)r\$/i, '$1');
  if (!t || !/^[-+]?[\d.,]+$/.test(t)) return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^[-+]?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const v = Number(t);
  return Number.isFinite(v) ? arred(v) : null;
}
/**
 * Vários valores: "217,93 176,15+64,86" → três; "36*4" → quatro de 36. Pedaço inválido → null.
 * Só o asterisco multiplica: "1200x10" lembra parcelamento e não vira dez lançamentos.
 */
function paraNumeros(txt) {
  // "+" entre números separa valores (sem lookbehind: quebraria o Safari antigo)
  const partes = String(txt ?? '').replace(/([\d,.])\+(?=\d)/g, '$1 ').trim().split(/[\s;]+/).filter(Boolean);
  const out = [];
  for (const p of partes) {
    const m = p.match(/^(.+?)\*(\d{1,3})$/);
    const v = paraNumero(m ? m[1] : p);
    if (v === null) return null;
    for (let i = 0, n = m ? Math.min(Number(m[2]), 120) : 1; i < n; i++) out.push(v);
  }
  return out;
}
/** "1200x10", "36x4", "50×3": jeito de escrever parcelas ou repetição que o app não multiplica. */
const pareceVezes = (txt) => /^[-+−]?\d[\d.,]*[x×]\d{1,3}$/i.test(String(txt ?? '').trim().split(/\s+/)[0] || '');

/* Contas do mês em centavos inteiros: somar reais em ponto flutuante deixa resíduos
   (1389,4899999999998) que viram "−R$ 0,00" e falsos "acima do plano". */
const centavos = (v) => Math.round((Number(v) || 0) * 100);
const VAZIA = { cent: 0, soma: 0, qtd: 0, itens: [] };

/** Índice de um ano: por "categoria|mês", a soma (em centavos e em reais), a quantidade e os lançamentos. */
function indexarAno(bloco) {
  const lanc = (bloco && bloco.lancamentos) || [];
  const cel = new Map();
  for (const l of lanc) {
    const k = l.categoriaId + '|' + l.mes;
    let c = cel.get(k);
    if (!c) cel.set(k, (c = { cent: 0, soma: 0, qtd: 0, itens: [] }));
    c.cent += centavos(l.valor); c.qtd++; c.itens.push(l);
  }
  for (const c of cel.values()) c.soma = c.cent / 100;
  return { cel, orc: (bloco && bloco.orcamento) || {}, lanc };
}

/**
 * Contas de um mês (regra da 2.8.0; detalhes em docs/ARQUITETURA.md).
 * O lançado conta sempre, no valor exato. Cada plano reserva o que ainda falta dele até o fim
 * do mês, ou até a categoria ser encerrada no mês ("Quitar", "Encerrar", "Não vem mais"):
 *   renda       = recebida + a receber (o que falta das rendas previstas)
 *   disponível  = renda − já saiu − contas a pagar (fixos) − falta guardar − ainda nos planos (variáveis)
 * Assim gastar dentro do plano não mexe no disponível, gastar fora dele reduz na mesma medida,
 * e receber parte de uma renda prevista não derruba o número.
 *   p = { cats, idx, ano, mes, hoje, gid, encerrada(cid), recorrentes (Map de recorrenciasDoMes), sid }
 * Plano do mês: o gravado vale; sem gravado, o das recorrências do mês (quando houver).
 */
function contasDoMes(p) {
  const { cats, idx, ano, mes, gid } = p;
  const recMap = p.recorrentes || new Map(); const sid = p.sid;
  const h = p.hoje; const enc = p.encerrada || (() => false);
  const f = faseDe(ano, mes, h);
  const t = {
    recebida: 0, aReceber: 0, rendaPlano: 0, jaSaiu: 0, contasAPagar: 0, faltaGuardar: 0, nosPlanos: 0,
    guardadoPlano: 0, guardadoReal: 0, gastoConsumoReal: 0, planoGastos: 0, gastoComPlano: 0, semPlano: 0,
    legRenda: 0, legSaidas: 0,
  };
  let qtd = 0; let qtdGastos = 0; let qtdConsumo = 0; let semPlanoQtd = 0;
  const porCat = []; const pend = [];
  for (const c of cats) {
    const cel = idx.cel.get(c.id + '|' + mes) || VAZIA;
    const o = idx.orc[c.id];
    const gravado = Boolean(o) && o[mes] !== undefined && o[mes] !== null && o[mes] !== '';
    const rec = gravado ? undefined : recMap.get(c.id);
    const planoC = gravado ? Math.max(0, centavos(o[mes])) : rec ? Math.max(0, rec.cent) : 0;
    const realC = cel.cent;
    const encerrada = Boolean(planoC && enc(c.id));
    let faltaC = planoC > 0 && !encerrada ? Math.max(0, planoC - realC) : 0;
    qtd += cel.qtd;
    if (c.grupo === 'renda') {
      t.recebida += realC; t.aReceber += faltaC; t.rendaPlano += planoC;
      t.legRenda += cel.qtd ? realC : planoC;
      if (faltaC > 0) pend.push({ c, cent: faltaC, renda: true });
    } else {
      t.jaSaiu += realC; qtdGastos += cel.qtd;
      t.legSaidas += cel.qtd ? realC : planoC;
      if (c.id === gid) {
        // Resgate (guardado negativo) não aumenta o que falta guardar.
        faltaC = planoC > 0 && !encerrada ? Math.max(0, planoC - Math.max(0, realC)) : 0;
        t.guardadoPlano += planoC; t.guardadoReal += realC; t.faltaGuardar += faltaC;
        if (faltaC > 0) pend.push({ c, cent: faltaC });
      } else {
        t.gastoConsumoReal += realC; qtdConsumo += cel.qtd; t.planoGastos += planoC;
        if (planoC) t.gastoComPlano += realC;
        else if (realC) { t.semPlano += realC; semPlanoQtd++; }
        if (c.grupo === 'fixo') {
          t.contasAPagar += faltaC;
          if (faltaC > 0) pend.push({ c, cent: faltaC });
        } else {
          t.nosPlanos += faltaC;
          if (planoC > 0 && !cel.qtd && !encerrada) pend.push({ c, cent: planoC });
        }
      }
    }
    porCat.push({
      c,
      v: {
        valor: (cel.qtd ? realC : planoC) / 100, real: realC / 100, qtd: cel.qtd, plano: planoC / 100,
        tipo: cel.qtd ? 'real' : planoC ? 'previsto' : 'vazio', fase: f, falta: faltaC / 100, encerrada,
        ...(rec ? { recorrente: true } : {}),
      },
    });
  }
  const R = (cent) => cent / 100;
  const reservado = t.contasAPagar + t.faltaGuardar + t.nosPlanos;
  const disponivel = t.recebida + t.aReceber - t.jaSaiu - reservado;
  const transporteC = sid ? (idx.cel.get(sid + '|' + mes) || VAZIA).cent : 0;
  const dias = diasNoMes(ano, mes);
  const restantes = f === 'atual' ? dias - h.dia + 1 : 0;
  const pendSaidas = pend.filter((x) => !x.renda).reduce((a, x) => a + x.cent, 0);
  const pendRenda = pend.filter((x) => x.renda).reduce((a, x) => a + x.cent, 0);
  return {
    fase: f, dias, restantes, qtd, qtdGastos, qtdConsumo, semPlanoQtd, porCat,
    ritmo: f === 'atual' ? h.dia / dias : f === 'passado' ? 1 : 0,
    renda: R(t.recebida + t.aReceber), recebida: R(t.recebida), aReceber: R(t.aReceber), rendaPlano: R(t.rendaPlano),
    jaSaiu: R(t.jaSaiu), contasAPagar: R(t.contasAPagar), faltaGuardar: R(t.faltaGuardar), nosPlanos: R(t.nosPlanos),
    reservado: R(reservado), saidasPrevistas: R(t.jaSaiu + reservado),
    disponivel: R(disponivel), sobraRealizada: R(t.recebida - t.jaSaiu),
    porDia: restantes ? Math.floor(disponivel / restantes / 100) : 0,
    guardadoPlano: R(t.guardadoPlano), guardadoReal: R(t.guardadoReal), gastoConsumoReal: R(t.gastoConsumoReal),
    planoGastos: R(t.planoGastos), gastoComPlano: R(t.gastoComPlano), semPlano: R(t.semPlano),
    pendencias: { qtd: pend.length, saidas: R(pendSaidas), renda: R(pendRenda), itens: pend.map((x) => ({ c: x.c, valor: R(x.cent), renda: Boolean(x.renda) })) },
    // Regra até a 2.7: o lançado substitui o plano no primeiro lançamento. Só para o aviso "O que mudou".
    legado: { disponivel: R(t.legRenda - t.legSaidas) },
    rendaReal: R(t.recebida), gastoReal: R(t.jaSaiu), sobraReal: R(t.recebida - t.jaSaiu),
    transporte: R(transporteC), resultado: R(t.recebida - t.jaSaiu - transporteC),
  };
}

/**
 * Média do lançado nos 3 meses anteriores ao planejado, sem o mês corrente (que ainda está pela
 * metade) e sem planos: mês sem lançamento conta zero, a partir do primeiro mês com dados.
 *   p = { somaDe(ano, mes) → reais, alvo: chaveMes, atual: chaveMes, inicio: chaveMes }
 */
function mediaRealizada(p) {
  const fim = Math.min(p.alvo, p.atual) - 1;
  const ini = Math.max(fim - 2, p.inicio);
  let cent = 0; let n = 0;
  for (let k = fim; k >= ini; k--) { const d = deChave(k); cent += centavos(p.somaDe(d.ano, d.mes)); n++; }
  return n ? Math.round(cent / n) / 100 : 0;
}

/* ---------------------------------------------------------------------
   3.1.0: recorrências, parcelas, situação das contas e leitura de extrato.
   Só cálculo: não toca no DOM nem no estado.
   --------------------------------------------------------------------- */
const ausente = (v) => v === null || v === undefined || v === '';
/** Ordem das contas: dia crescente (sem dia por último) e, depois, descrição. */
function ordemItem(a, b) {
  const da = ausente(a.dia) ? Infinity : a.dia;
  const db = ausente(b.dia) ? Infinity : b.dia;
  if (da !== db) return da < db ? -1 : 1;
  return String(a.r.descricao ?? '').localeCompare(String(b.r.descricao ?? ''), 'pt-BR');
}
/**
 * Recorrências do mês: Map categoriaId → { cent, itens }. Entra a recorrência ativa, que já começou
 * (inicio aaaamm) e não terminou (fim vazio ou aaaamm <= fim). Item pulado (pulada(id)) aparece com
 * pulada: true e não entra no cent. O dia é limitado ao último dia do mês.
 */
function recorrenciasDoMes(recs, ano, mes, pulada) {
  const aaaamm = ano * 100 + mes;
  const ultimo = diasNoMes(ano, mes);
  const out = new Map();
  for (const r of recs || []) {
    if (!r || !r.ativa) continue;
    if (!(Number(r.inicio) <= aaaamm)) continue;
    if (!ausente(r.fim) && aaaamm > Number(r.fim)) continue;
    const pul = typeof pulada === 'function' ? Boolean(pulada(r.id)) : false;
    const cent = centavos(r.valor);
    const d = Number(r.dia);
    const dia = ausente(r.dia) || !(d >= 1) ? null : Math.min(d, ultimo);
    let g = out.get(r.categoriaId);
    if (!g) out.set(r.categoriaId, (g = { cent: 0, itens: [] }));
    if (!pul) g.cent += cent;
    g.itens.push({ r, cent, dia, pulada: pul });
  }
  for (const g of out.values()) g.itens.sort(ordemItem);
  return out;
}

/**
 * Situação das contas de uma categoria: o lançado (realCent, nunca negativo) é distribuído em ordem
 * de dia, guloso. Itens pulados ficam de fora. atrasada: venceu antes de hoje, falta pagar e não é
 * automática (débito automático não vira atraso: vira "debitada, confirme").
 */
function situacaoContas(itens, realCent, hojeDia) {
  let resta = Math.max(0, Number(realCent) || 0);
  const ativos = (itens || []).filter((i) => !i.pulada).slice().sort(ordemItem);
  const hoje = !ausente(hojeDia);
  return ativos.map((it) => {
    const pagoCent = Math.max(0, Math.min(resta, it.cent));
    resta -= pagoCent;
    const restante = it.cent - pagoCent;
    return {
      r: it.r, cent: it.cent, dia: it.dia, pagoCent, restante, pago: restante <= 0,
      atrasada: hoje && !ausente(it.dia) && it.dia < hojeDia && restante > 0 && !it.r.automatico,
      venceHoje: hoje && it.dia === hojeDia && restante > 0,
    };
  });
}

/** Divide um total em centavos em n parcelas inteiras; a sobra do arredondamento vai para a primeira. */
function dividirParcelas(totalCent, n) {
  const k = Number(n);
  if (!Number.isInteger(k) || k < 2 || k > 48) throw new RangeError('o número de parcelas deve estar entre 2 e 48');
  const total = Math.round(Number(totalCent) || 0);
  const base = Math.trunc(total / k);
  const sobra = total - base * k;
  return Array.from({ length: k }, (_, i) => (i === 0 ? base + sobra : base));
}

/** Data real (mês de 1 a 12, dia dentro do mês). */
function dataValida(ano, mes, dia) {
  return Number.isInteger(ano) && mes >= 1 && mes <= 12 && dia >= 1 && dia <= diasNoMes(ano, mes);
}

/** Texto de data brasileiro ou ISO → { ano, mes, dia }; qualquer outra coisa ou data inexistente é null. */
function lerDataBr(txt) {
  const t = String(txt ?? '').trim();
  const ok = (ano, mes, dia) => (dataValida(ano, mes, dia) ? { ano, mes, dia } : null);
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})$/);
  if (m) return ok(m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]), Number(m[2]), Number(m[1]));
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return ok(Number(m[1]), Number(m[2]), Number(m[3]));
  m = t.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/) || t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (m) return ok(Number(m[3]), Number(m[2]), Number(m[1]));
  return null;
}

/**
 * Valor em formato brasileiro ou americano → número; texto inválido é null. Aceita "R$", o sinal
 * Unicode de menos, parênteses (negativo), sufixo " D" (negativo) e " C" (positivo).
 */
function lerValorBr(txt) {
  let s = String(txt ?? '').replace(/−/g, '-').trim();
  if (!s) return null;
  let neg = false;
  const par = s.match(/^\((.*)\)$/);
  if (par) { neg = true; s = par[1]; }
  const suf = s.match(/\s*([DC])$/i);
  if (suf) { neg = suf[1].toUpperCase() === 'D'; s = s.slice(0, suf.index); }
  s = s.replace(/r\$/i, '').replace(/\s/g, '');
  const sinal = s.match(/^([-+]?)(.*)$/);
  if (sinal[1] === '-' && !suf) neg = true;
  const corpo = sinal[2];
  if (!/^\d+([.,]\d+)*$/.test(corpo)) return null;
  const temC = corpo.includes(','); const temP = corpo.includes('.');
  let num = corpo;
  if (temC && temP) {
    const dec = corpo.lastIndexOf(',') > corpo.lastIndexOf('.') ? ',' : '.';
    num = corpo.split(dec === ',' ? '.' : ',').join('').replace(dec, '.');
  } else if (temC) {
    num = corpo.split(',').length > 2 ? corpo.split(',').join('') : corpo.replace(',', '.');
  } else if (temP && /^\d{1,3}(\.\d{3})+$/.test(corpo)) {
    num = corpo.split('.').join('');
  }
  const v = Number(num);
  if (!Number.isFinite(v)) return null;
  return neg ? -v : v;
}

/** cyrb53 com semente: inteiro de 53 bits em base 36. */
function hash53(str, seed) {
  const s = String(str);
  let h1 = 0xdeadbeef ^ seed; let h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
/** Id estável de um lançamento importado: cabe no formato de id aceito pelo servidor. */
function idImportado(conta, chave) {
  const k = String(conta ?? '') + '|' + String(chave);
  return 'x' + hash53(k, 0) + hash53(k, 1);
}

/** Descrição para comparar: minúscula, sem acento, espaços colapsados e sem pontuação nas pontas. */
function normDesc(s) {
  return normal(s).replace(/\s+/g, ' ').trim().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
}

/**
 * Classifica cada linha do extrato contra os lançamentos já existentes. Status, nesta ordem:
 * invalida, duplicada-arquivo, ja-importada, possivel-duplicada, nova.
 * linhas = [{ fitid, data, valor, descricao }]; existentes = [{ id, ano, mes, dia, valor, descricao }].
 */
function classificarExtrato(linhas, existentes, conta) {
  const cta = conta ?? '';
  const ex = existentes || [];
  const ja = new Set(ex.map((e) => e.id));
  const emExistentes = new Map();
  for (const e of ex) {
    const k = isoData(e.ano, e.mes, e.dia) + '|' + Math.abs(centavos(e.valor)) + '|' + normDesc(e.descricao);
    emExistentes.set(k, (emExistentes.get(k) || 0) + 1);
  }
  const porChave = new Map(); const porAbs = new Map(); const fitids = new Set();
  return (linhas || []).map((l) => {
    const base = { fitid: l.fitid || null, data: l.data || null, valor: Number.isFinite(l.valor) ? l.valor : null, descricao: l.descricao ?? '' };
    if (!l.data) return { ...base, ocorrencia: null, chave: null, id: null, status: 'invalida', motivo: 'sem data' };
    if (!Number.isFinite(l.valor)) return { ...base, ocorrencia: null, chave: null, id: null, status: 'invalida', motivo: 'sem valor' };
    const dk = isoData(l.data.ano, l.data.mes, l.data.dia);
    const desc = normDesc(l.descricao);

  const s = String(txt || '').trim();
  if (!s) return false;
  const partes = s.split(/\s+/); const lv = lerVezes(partes[0]);
  if (lv && lv.valor > 0) { abrirNovo({ texto: `${String(lv.valor).replace('.', ',')} ${partes.slice(1).join(' ')}`.trim(), vezes: lv.vezes }); return false; }
  const r = interpretarLinha(s, false);
  if (!r.valores.length) {
    aviso(pareceVezes(s) ? 'Use de 2 a 48 parcelas, por exemplo 1200x10 geladeira. Para repetir um valor, use *, por exemplo 36*4.' : 'Não entendi o valor. Use, por exemplo, 32,90 mercado padaria.', { tipo: 'erro' });
    return false;
  }
  if (mesFechado(S.ano, S.mes)) { abrirNovo({ texto: s }); return false; }
  const c = r.categoriaId ? catPorId(r.categoriaId) : null;
  if (!c) { abrirNovo({ texto: s }); return false; }
  const total = r.valores.reduce((a, b) => a + b, 0);
  if (foraDoNormal(c.id, total)) { abrirNovo({ texto: s }); return false; }
  // Grava no mês que está na tela: hoje, se for o mês atual; senão, sem dia definido.
  const h = hoje(); const noMes = S.ano === h.ano && S.mes === h.mes;
  const ano = S.ano; const mes = S.mes; const dia = noMes ? h.dia : null;
  const ids = r.valores.map((v) => { const id = novoId(); registrar({ t: 'lanc', l: { id, ano, mes, dia, categoriaId: c.id, descricao: r.descricao, valor: v } }); return id; });
  const onde = noMes ? '' : ` (${MESES[mes - 1]} de ${ano}, sem dia)`;
  aviso(`Lançado em ${c.nome}${onde}: ${moeda(total)}${ids.length > 1 ? ` (${ids.length} lançamentos)` : ''}`, { acao: 'Desfazer', fn: () => ids.forEach((id) => registrar({ t: 'lanc-', id })) });
  return true;
}
/** Valor muito acima do habitual: mais de 10× a média de 3 meses da categoria (e acima de R$ 5.000) ou, sem histórico, acima de R$ 100.000. */
function foraDoNormal(cid, total) {
  const v = Math.abs(Number(total) || 0);
  const med = cid ? media3(cid, S.ano, S.mes) : 0;
  return med > 0 ? v > Math.max(med * 10, 5000) : v > 100000;
}

function notaCategoria(c, v, est, ano = S.ano, mes = S.mes) {
  if (v.recorrente && v.fase !== 'futuro' && v.qtd && v.falta <= 0 && est !== 'acima' && !v.encerrada && !ehGuardar(c)) {
    const itens = [...situacaoRecs(c.id, ano, mes).values()];
    const ult = itens.length && itens.every((x) => x.s.pago) ? Math.max(...itens.map((x) => x.quitado || 0)) : 0;
    if (ult) return `${c.grupo === 'renda' ? 'Recebida' : 'Paga'} dia ${ult}`;
  }
  if (ehGuardar(c)) {
    if (v.plano > 0 && v.real >= v.plano) return 'Guardado';
    if (!v.real && v.plano) return `Previsto ${moeda(v.plano)} · nada guardado`;
    if (v.plano > 0) return `Faltam ${moeda(v.plano - v.real)}`;
    return v.real ? 'Guardado' : 'Nada guardado';
  }
  if (v.encerrada) return c.grupo === 'renda' ? `Não vem mais · recebido ${moeda(v.real)}` : `Liberado · fechou em ${moeda(v.real)} (plano ${moeda(v.plano)})`;
  if (v.fase === 'futuro') return v.plano ? (c.grupo === 'renda' ? 'Renda prevista' : 'Planejado') : 'Sem plano';
  if (v.fase === 'passado') {
    if (v.tipo === 'previsto') return `Sem lançamento · plano de ${moeda(v.plano)} fora da sobra`;
    return v.qtd ? `${v.qtd} lançamento${v.qtd > 1 ? 's' : ''}` : 'Nada lançado';
  }
  if (c.grupo === 'renda') {
    if (v.real > 0 && v.real >= v.plano) return 'Recebido';
    if (v.real > 0) return `Recebido ${moeda(v.real)} · a receber ${moeda(v.falta)}`;
    return v.plano ? `A receber ${moeda(v.plano)}` : 'Nada recebido';
  }
  if (!v.plano) return v.real ? 'Sem plano' : 'Nada lançado';
  if (est === 'acima') return `${moeda(v.real - v.plano)} acima do plano`;
  if (c.grupo === 'fixo') {
    if (v.real >= v.plano) return 'Pago';
    if (!v.real) return `A pagar · ${moeda(v.plano)}`;
    return `Faltam ${moeda(v.plano - v.real)}`;

  if (!v.real) return `Previsto ${moeda(v.plano)} · nada lançado ainda`;

}

function cartaoHeroi(r) {
  const m = MESES[S.mes - 1];

    return '<section class="cartao g-heroi heroi" aria-labelledby="h-livre"><h2 id="h-livre" class="rotulo">Seu mês começa aqui</h2>'
      + `<p style="font-size:1.375rem;font-weight:650;line-height:1.25;margin:6px 0">Sem plano em ${m}</p><p class="sub">Diga quanto vai entrar e o que quer guardar: o app calcula quanto dá para gastar por dia. Ou lance o primeiro gasto agora.</p>`
      + `<div class="acoes"><button type="button" class="botao primario" data-acao="planejar">${ic('mes', 18)}Planejar ${m}</button><button type="button" class="botao" data-acao="novo">${ic('mais', 18)}Lançar agora</button></div></section>`;
  }
  if (r.fase === 'atual') {
    const sub = r.disponivel > 0
      ? r.restantes === 1
        ? `Cerca de ${moedaRedonda(r.porDia)} neste último dia do mês, além dos planos.`
        : `Cerca de ${moedaRedonda(r.porDia)} por dia nos próximos ${r.restantes} dias, além dos planos.`
      : r.disponivel < 0

        : 'Toda a renda do mês já tem destino.';
    const pctOf = (v) => (r.renda > 0 ? Math.max(0, Math.min(100, (v / r.renda) * 100)) : 0);
    const pctSaiu = pctOf(r.jaSaiu); const pctRes = pctOf(r.reservado); const pctDisp = pctOf(Math.max(0, r.disponivel));

function cartaoAno() {

/* ---------- Planilha ---------- */
function telaPlanilha() {
  const ano = S.ano; const h = hoje();
  const meses = Array.from({ length: 12 }, (_, i) => i + 1);
  let corpo = ''; let r = 0;
  const colInicial = ano === h.ano ? h.mes - 1 : 0;
  for (const g of ORDEM_GRUPOS) {
    const lista = catsDoGrupo(g);
    if (!lista.length) continue;
    // O rótulo fica na primeira coluna (fixa): continua visível quando a tabela rola para o lado.
    corpo += `<tr class="grupo"><th class="cat" scope="rowgroup">${GRUPOS[g]}</th><td colspan="13"></td></tr>`;
    for (const c of lista) {
      const vals = meses.map((m) => celula(c.id, ano, m));
      const reais = vals.filter((v) => v.fase === 'passado' && v.qtd > 0).map((v) => v.real);
      const media = reais.length >= 3 ? reais.reduce((a, b) => a + b, 0) / reais.length : 0;
      let total = 0;
      let linha = `<tr><th scope="row" class="cat" title="${esc(c.nome)}">${esc(c.nome)}</th>`;
      vals.forEach((v, i) => {
        const m = i + 1;
        total += v.fase === 'passado' ? v.real : v.real + v.falta;
        const cls = ['cel'];
        if (v.fase === 'atual') cls.push('atual');
        if (v.tipo === 'previsto') cls.push('prev');
        const mostrado = v.fase === 'atual' && v.qtd ? v.real : v.valor;
        if (!mostrado) cls.push('zero');
        let estilo = ''; let marca = '';
        if (S.calor && media && v.fase === 'passado' && v.qtd > 0) {
          const q = v.real / media;
          marca = q >= 1.15 ? '▲' : q <= 0.85 ? '▼' : '';
          if (q >= 1.15) estilo = `background-color:color-mix(in srgb, var(--calor-acima) ${Math.min(32, (q - 1) * 45).toFixed(1)}%, var(--cartao))`;
          else if (q <= 0.85) estilo = `background-color:color-mix(in srgb, var(--calor-abaixo) ${Math.min(22, (1 - q) * 40).toFixed(1)}%, var(--cartao))`;
        }
        const mini = v.fase === 'atual' && v.qtd && v.plano > 0 && g !== 'renda'
          ? `<span class="mini"><i class="${v.real > v.plano ? 'acima' : ''}" style="width:${Math.min(100, (v.real / v.plano) * 100).toFixed(0)}%"></i></span>` : '';
        const dica = `${c.nome} · ${Mes(m)}: ${moeda(mostrado)}${v.tipo === 'previsto' ? (v.fase === 'passado' ? ' (plano sem lançamento; não entra nos totais)' : ' (previsto, não lançado)') : ''}${v.encerrada ? ' (encerrada no mês)' : ''}${v.fase === 'atual' && v.plano ? ` de ${moeda(v.plano)} planejados` : ''}${media && v.fase === 'passado' && v.qtd ? ` · média ${moeda(media)}` : ''}${marca === '▲' ? ' · acima da média' : marca === '▼' ? ' · abaixo da média' : ''}`;
        linha += `<td class="${cls.join(' ')}" data-acao="categoria" data-cat="${esc(c.id)}" data-ano="${ano}" data-mes="${m}" data-r="${r}" data-c="${i}" tabindex="${r === 0 && i === colInicial ? 0 : -1}" title="${esc(dica)}"${estilo ? ` style="${estilo}"` : ''}>${mostrado ? num(mostrado) : '–'}${marca ? `<span class="calor-marca" aria-hidden="true">${marca}</span>` : ''}${mini}</td>`;
      });
      corpo += linha + `<td class="total">${num(total)}</td></tr>`;
      r++;
    }
  }
  // Rodapé com a mesma regra do Início: meses fechados contam só o lançado; o atual e os próximos, o que falta dos planos.
  const res = meses.map((m) => resumo(ano, m));
  const passado = (i) => res[i].fase === 'passado';
  const totG = res.map((rr, i) => (passado(i) ? rr.jaSaiu : rr.saidasPrevistas));
  const totR = res.map((rr, i) => arred((passado(i) ? rr.recebida : rr.renda) - rr.transporte));
  const sobra = res.map((rr, i) => (passado(i) ? rr.resultado : arred(rr.disponivel - rr.transporte)));
  const rodape = (nome, serie, sinal) => {
    const tot = serie.reduce((a, b) => a + b, 0);
    const cor = (v) => (sinal ? (v < 0 ? ' txt-acima' : ' txt-ok') : '');
    return `<tr><th scope="row">${nome}</th>${serie.map((v, i) => {
      const f = res[i].fase;
      return `<td class="${f !== 'passado' ? 'proj' : ''}${cor(v)}" title="${esc(nome + ' · ' + Mes(i + 1) + (f === 'atual' ? ' (lançado + o que falta dos planos)' : f === 'futuro' ? ' (previsto)' : ' (só o lançado)'))}">${num(v)}</td>`;
    }).join('')}<td class="total${cor(tot)}">${num(tot)}</td></tr>`;
  };
  const cab = meses.map((m) => { const f = fase(ano, m); return `<th scope="col" class="${f === 'atual' ? 'atual' : ''}">${MesC(m)}${f === 'atual' ? '<small>hoje</small>' : ''}</th>`; }).join('');
  const seg = (on, txt) => `<button type="button" data-acao="calor" data-calor="${on ? 1 : 0}" data-foco="calor-${on ? 1 : 0}" aria-pressed="${S.calor === on}">${txt}</button>`;
  if (!cats().length) return vazio('Crie categorias em Ajustes para ver a planilha.', false);
  return `<div class="planilha-ano">${cartaoAno()}</div>`
    + '<div class="planilha-ferramentas">'
    + `<div class="segmentado" role="group" aria-label="Visualização">${seg(false, 'Valores')}${seg(true, 'Mapa de calor')}</div>`
    + '<div class="legenda"><span><i style="background:color-mix(in srgb,var(--calor-acima) 32%,var(--cartao))"></i>acima da média da categoria</span><span><i style="background:color-mix(in srgb,var(--calor-abaixo) 22%,var(--cartao))"></i>abaixo da média</span><span><i style="box-shadow:inset 0 0 0 1px var(--tinta-3)"></i>previsto (plano sem lançamento)</span></div>'
    + `<button type="button" class="botao pequeno" data-acao="exportar-csv" data-foco="exp-csv" style="margin-left:auto">${ic('baixar', 16)}Exportar lançamentos (CSV)</button></div>`
    + `<p class="planilha-dica so-celular" id="planilha-dica">${ic('dir', 16)}Deslize para consultar os meses; as categorias ficam fixas.</p>`
    + `<div class="planilha-caixa" role="region" tabindex="0" aria-label="Planilha anual de ${ano}, rolável na horizontal" aria-describedby="planilha-dica"><table class="planilha"><caption class="sr">Planilha de ${ano}: categorias por mês. Use as setas para navegar e Enter para abrir.</caption>`
    + `<thead><tr><th scope="col" class="cat">Categoria</th>${cab}<th scope="col" class="total">Ano</th></tr></thead><tbody>${corpo}</tbody>`
    + `<tfoot>${rodape('Total de saídas', totG, false)}${rodape('Renda', totR, false)}${rodape('Sobra', sobra, true)}</tfoot></table></div>`
    + `<p class="sub" style="margin-top:10px">Clique numa célula para ver e lançar. Cada célula mostra o lançado; sem lançamento, o plano aparece tracejado. Nos meses fechados, os totais contam só o lançado; no mês atual e nos próximos, contam também o que falta de cada plano.${S.dados.categoriaSobra ? ' A sobra levada de um mês para o outro não entra nos totais do ano.' : ''}</p>`;
}

/** Números e datas do Diagnósticos: a folha e o texto copiado leem daqui (R-005: nunca nome, valor ou descrição). */
function dadosDiagnostico() {
  const d = S.dados;
  const s = sinaisDaPlanilha(d, hoje(), (a, m) => resumo(a, m).pendencias.qtd);

  return {

    revisao: d.revisao ?? '—',

}

}

function proximasParcelas(id) {
  if (!ehIdParcela(id)) return [];
  const pre = id.slice(0, id.lastIndexOf('-') + 1); const k = Number(id.slice(-2)); const out = [];
  for (const [ano, b] of Object.entries(S.dados.anos)) {

/** Folha de uma recorrência: nova (rec vazio) ou edição. pre preenche os campos; aoSalvar roda depois de salvar. */
function abrirRecorrencia(o) {

        const ultimo = Math.max(60, fimGravado - k, alvo ? chaveDe(Number(alvo)) - k : 0);

        if (alvo && chaveDe(Number(alvo)) < k) h2 += `<option value="${alvo}" selected>${rotuloAaaamm(Number(alvo))}</option>`;
        for (let i = 0; i <= ultimo; i++) { const n = aaaammDe(k + i); h2 += `<option value="${n}"${String(n) === alvo ? ' selected' : ''}>${rotuloAaaamm(n)}</option>`; }
        $('#rc-fim', el).innerHTML = h2;
      };
      montarFim(ausente(base.fim) ? '' : base.fim);
      const erro = (t) => { const e = $('#rc-erro', el); e.textContent = t; e.className = t ? 'entendi erro' : 'entendi'; };
      const conferirFim = () => {

      const ler = () => {

        if (fim !== null && fim < inicio) { erro('O fim não pode ser antes do começo.'); return null; }

        terminar();
      };
      const mostrarEscolha = (n) => {

        $('#rc-escolha', el).innerHTML = `<div class="escolha-inline" role="group" aria-label="Onde vale a mudança"><p class="sub">O valor mudou de ${moeda(rec.valor)} para ${moeda(n.valor)}. Onde vale?</p><div class="acoes">`

        terminar();

        registrar({ t: 'rec', r: { ...antes, fim: fimAntigo } });
        if (criarNova) registrar({ t: 'rec', r: { id, ...n, inicio: novoInicio, fim: n.fim } });
        const txt = criarNova ? `${c.nome}: ${moeda(n.valor)} de ${Mes(refMes % 100)} em diante.` : `${c.nome}: já termina antes de ${Mes(refMes % 100)}; o valor novo não entra.`;
        aviso(txt, { acao: 'Desfazer', fn: () => { if (criarNova) registrar({ t: 'rec-', id }); registrar({ t: 'rec', r: antes }); } });
        terminar();
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]'); if (!b) return;
        const f = b.dataset.f;
        if (f === 'fechar') fecharFolha();

      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); salvar(); }

    },
  });
}
/** Encerrar: termina no mês anterior ao de referência; se ainda nem começou, apaga junto com as marcas. */

  if (r.inicio >= refMes) {
    registrar({ t: 'rec-', id: r.id });
    aviso(`${nome}: recorrência apagada.`, { acao: 'Desfazer', fn: () => { registrar({ t: 'rec', r: antes }); marcas.forEach((k) => registrar({ t: 'cfg', k, v: '1' })); } });
    return;
  }

}
function pularRec(r, ano, mes, pular) {

/** Primeira conta em aberto da categoria no mês (recorrências por ordem de dia), ou null. */
function primeiraAberta(cid, ano, mes) {
  for (const x of situacaoRecs(cid, ano, mes).values()) if (!x.s.pago) return x;
  return null;
}
/** Todas as contas em aberto da categoria são de débito automático (e vêm só das recorrências)? */
function soAutomaticas(cid, ano, mes) {
  if (temGravado(cid, ano, mes)) return false;
  const abertas = [...situacaoRecs(cid, ano, mes).values()].filter((x) => !x.s.pago);
  return abertas.length > 0 && abertas.every((x) => x.s.r.automatico);
}
/**
 * Lança o que falta do plano da categoria no mês. Plano das recorrências: um lançamento por conta em
 * aberto, no dia dela. Plano gravado: um só, com o que falta. Devolve { ids, total } ou null.
 */
function lancarPrevisto(cid, ano, mes) {
  const c = catPorId(cid);
  if (!c) return null;
  const v = celula(cid, ano, mes);
  if (!v.plano) return null;
  const diaHoje = fase(ano, mes) === 'atual' ? hoje().dia : null;
  const lancs = [];
  if (!temGravado(cid, ano, mes) && recorrentesDoMes(ano, mes).get(cid)) {
    for (const x of situacaoRecs(cid, ano, mes).values()) {
      if (!x.s.pago) lancs.push({ dia: ausente(x.s.dia) ? diaHoje : x.s.dia, descricao: x.s.r.descricao || '', valor: x.s.restante / 100 });
    }
  } else {
    const valor = v.qtd ? v.falta : v.plano;
    const x = primeiraAberta(cid, ano, mes);
    if (valor > 0) lancs.push({ dia: x && !ausente(x.s.dia) ? x.s.dia : diaHoje, descricao: '', valor });
  }
  if (!lancs.length) return null;
  const ids = lancs.map((l) => { const id = novoId(); registrar({ t: 'lanc', l: { id, ano, mes, dia: l.dia, categoriaId: cid, descricao: l.descricao, valor: l.valor } }); return id; });
  return { ids, total: lancs.reduce((a, l) => a + centavos(l.valor), 0) / 100 };
}
function confirmarPrevisto(cid, ano, mes) {
  const c = catPorId(cid);
  const r = c ? lancarPrevisto(cid, ano, mes) : null;
  if (!r) return;
  const qtd = r.ids.length > 1 ? ` (${r.ids.length} contas)` : '';
  aviso(ehGuardar(c) ? `${moeda(r.total)} guardado.` : `${c.nome}: ${moeda(r.total)} lançado${qtd}.`, { acao: 'Desfazer', fn: () => r.ids.forEach((id) => registrar({ t: 'lanc-', id })) });
}
/** Id fixo do lançamento que leva a sobra de um mês para o seguinte: "s", o ano e o mês de origem. */
const idSobra = (ano, mes) => `s${ano}${dois(mes)}`;
/** O que mudaria no mês seguinte ao fechar com esta sobra: null quando nada muda (sem sobra e sem lançamento antigo, ou igual). */
function planoSobra(ano, mes, sobra) {
  const prox = deChave(chaveMes(ano, mes) + 1);
  const id = idSobra(ano, mes);
  const achado = acharLanc(id);
  const antes = achado ? { ...achado.l, ano: achado.ano } : null;
  const valor = sobra > 0 ? arred(sobra) : 0;
  if (!valor && !antes) return null;
  if (antes && valor && centavos(antes.valor) === centavos(valor) && antes.ano === prox.ano && antes.mes === prox.mes) return null;
  return { prox, id, antes, valor };
}
/** Grava (ou atualiza, ou tira) a sobra transportada no mês seguinte. Devolve { valor, prox, desfazer } ou null. */
function levarSobra(ano, mes, sobra) {
  const ps = planoSobra(ano, mes, sobra);
  if (!ps) return null;
  const { prox, id, antes, valor } = ps;
  let cid = S.dados.categoriaSobra;
  const existe = Boolean(cid && catPorId(cid) && catPorId(cid).grupo === 'renda');
  const ops = []; const volta = [];
  if (valor) {
    if (!existe) {
      cid = idUnico('Sobra do mês anterior');
      const ordem = Math.max(0, ...S.dados.categorias.map((c) => c.ordem)) + 1;
      ops.push({ t: 'cat', c: { id: cid, nome: 'Sobra do mês anterior', grupo: 'renda', ordem } }, { t: 'cfg', k: 'categoriaSobra', v: cid });
    }
    ops.push({ t: 'lanc', l: { id, ano: prox.ano, mes: prox.mes, dia: 1, categoriaId: cid, descricao: `Sobra de ${MESES[mes - 1]}`, valor } });
    volta.push(antes ? { t: 'lanc', l: antes } : { t: 'lanc-', id });
    if (!existe) volta.push({ t: 'cfg', k: 'categoriaSobra', v: '' }, { t: 'cat-', id: cid });
  } else {
    ops.push({ t: 'lanc-', id });
    volta.push({ t: 'lanc', l: antes });
  }
  registrarLote(ops);

  return { valor, prox, desfazer: () => { registrarLote(volta); atualizarFechamento(prox.ano, prox.mes); } };
}

      const atualizar = () => {

        const visiveis = itens.filter((it) => !adiadas.has(it.c.id));
        const qAdiadas = itens.length - visiveis.length;
        const aviso0 = qAdiadas ? `<p class="sub">${qAdiadas === 1 ? 'Uma pendência ficou para depois' : qAdiadas + ' pendências ficaram para depois'}. <button type="button" class="link" data-f="mostrar">Mostrar de novo</button></p>` : '';
        const autos = visiveis.filter((it) => !it.renda && soAutomaticas(it.c.id, ano, mes));
        const btnAutos = autos.length > 1 ? `<button type="button" class="botao pequeno" data-f="todas-auto">${ic('check', 16)}Confirmar todas as automáticas (${autos.length})</button>` : '';
        const demais = visiveis.filter((it) => it.renda || !soAutomaticas(it.c.id, ano, mes));
        const btnNao = demais.length > 1 ? `<button type="button" class="botao pequeno fantasma" data-f="nao-todas">Não aconteceu ${autos.length ? 'nas demais' : 'em todas'} (${demais.length})</button>` : '';
        const lote = btnAutos || btnNao ? `<div class="acoes">${btnAutos}${btnNao}</div>` : '';
        $('#fech-lista', el).innerHTML = lote + (visiveis.length ? visiveis.map((it) => {
          const dados = `data-cat="${esc(it.c.id)}"`;
          return `<div class="fech-item">${mono(it.c, true)}<div class="fech-txt"><strong>${esc(it.c.nome)}</strong><span>${it.renda ? 'a receber' : 'previsto'} ${esc(moeda(it.valor))}${soAutomaticas(it.c.id, ano, mes) ? ' · débito automático' : ''}</span></div>`
            + `<div class="fech-botoes"><button type="button" class="botao pequeno" data-f="feito" ${dados}>${it.renda ? 'Foi recebido' : 'Foi pago'}</button>`
            + `<button type="button" class="botao pequeno fantasma" data-f="nao" ${dados}>Não aconteceu</button>`
            + `<button type="button" class="botao pequeno fantasma" data-f="depois" ${dados}>Depois</button></div></div>`;
        }).join('') : itens.length ? '' : '<p class="sub">Nenhuma pendência. Dá para fechar o mês.</p>') + aviso0;
        $('#fech-sobra', el).textContent = `Sobra realizada: ${moeda(r.sobraRealizada)}`;
        $('#fech-ok', el).disabled = itens.length > 0;
        const ps = planoSobra(ano, mes, r.sobraRealizada);
        $('#fech-levar', el).hidden = !ps;
        if (ps) {
          const pm = Mes(ps.prox.mes);
          $('#fech-levar-t', el).textContent = !ps.valor ? `Tirar de ${pm} a sobra levada (${moeda(ps.antes.valor)})`
            : ps.antes ? `Atualizar a sobra levada para ${pm}: ${moeda(ps.valor)}` : `Levar ${moeda(ps.valor)} para ${pm}`;
        }
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const f = b.dataset.f; const cid = b.dataset.cat;
        if (f === 'fechar') fecharFolha();
        else if (f === 'feito') {
          const it = resumo(ano, mes).pendencias.itens.find((x) => x.c.id === cid);
          if (!it) return;
          const lr = lancarPrevisto(cid, ano, mes);
          if (!lr) return;
          aviso(`${it.c.nome}: ${moeda(lr.total)} lançado em ${nm}.`, { acao: 'Desfazer', fn: () => { lr.ids.forEach((id) => registrar({ t: 'lanc-', id })); if (el.isConnected) atualizar(); } });
          atualizar();
        } else if (f === 'todas-auto') {
          const alvo = resumo(ano, mes).pendencias.itens.filter((x) => !x.renda && soAutomaticas(x.c.id, ano, mes));
          const ids = []; let total = 0;
          for (const x of alvo) { const lr = lancarPrevisto(x.c.id, ano, mes); if (lr) { ids.push(...lr.ids); total += lr.total; } }
          if (!ids.length) return;
          aviso(`${alvo.length} conta${alvo.length > 1 ? 's' : ''} automática${alvo.length > 1 ? 's' : ''} confirmada${alvo.length > 1 ? 's' : ''}: ${moeda(total)} lançado em ${nm}.`, { acao: 'Desfazer', fn: () => { ids.forEach((id) => registrar({ t: 'lanc-', id })); if (el.isConnected) atualizar(); } });
          atualizar();
        } else if (f === 'nao-todas') {
          const alvo = resumo(ano, mes).pendencias.itens.filter((x) => !adiadas.has(x.c.id) && (x.renda || !soAutomaticas(x.c.id, ano, mes)));
          if (!alvo.length) return;
          const chaves = alvo.map((x) => chaveEncerrada(ano, mes, x.c.id));
          registrarLote(chaves.map((k) => ({ t: 'cfg', k, v: '1' })));
          aviso(`${alvo.length} pendência${alvo.length > 1 ? 's' : ''} marcada${alvo.length > 1 ? 's' : ''} como “Não aconteceu” em ${nm}.`, { acao: 'Desfazer', fn: () => { registrarLote(chaves.map((k) => ({ t: 'cfg', k, v: '' }))); if (el.isConnected) atualizar(); } });
          atualizar();
        } else if (f === 'nao') { encerrarCategoria(cid, ano, mes, true); atualizar(); }
        else if (f === 'depois') { adiadas.add(cid); atualizar(); }
        else if (f === 'mostrar') { adiadas.clear(); atualizar(); }
        else if (f === 'fechar-mes') {
          if (resumo(ano, mes).pendencias.qtd) return;
          const k = 'fechado:' + chaveFechado(ano, mes);
          const antes = fechamentoDe(ano, mes);
          const sobra = resumo(ano, mes).sobraRealizada;
          registrar({ t: 'cfg', k, v: sobra.toFixed(2) });
          const caixa = $('#fech-levar', el);
          const lv = !caixa.hidden && $('#fech-levar-cb', el).checked ? levarSobra(ano, mes, sobra) : null;
          fecharFolha();
          const dito = !lv ? '' : lv.valor ? ` e ${moeda(lv.valor)} levados para ${Mes(lv.prox.mes)}` : ` e a sobra levada saiu de ${Mes(lv.prox.mes)}`;
          aviso(`${Mes(mes)} fechado: sobra realizada ${moeda(sobra)}${dito}.`, { acao: 'Desfazer', fn: () => { registrar({ t: 'cfg', k, v: antes === null ? '' : antes.toFixed(2) }); if (lv) lv.desfazer(); } });
        }
      });
      atualizar();
    },
  });
}
/** Encerra (ou reabre) uma categoria no mês: o que falta do plano deixa de ser reservado. O plano fica gravado. */
function encerrarCategoria(cid, ano, mes, fechar = true) {
  const c = catPorId(cid);
  if (!c) return;
  const v = celula(cid, ano, mes);
  const k = chaveEncerrada(ano, mes, cid);
  registrar({ t: 'cfg', k, v: fechar ? '1' : '' });
  const nomeMes = MESES[mes - 1];
  const msg = !fechar ? `${c.nome}: o plano de ${nomeMes} volta a reservar o que falta.`
    : c.grupo === 'renda' ? `${c.nome}: ${moeda(v.falta)} a receber saíram das contas de ${nomeMes}.`
      : `${c.nome}: ${moeda(v.falta)} liberados em ${nomeMes}. O plano fechou em ${moeda(v.real)}.`;
  aviso(msg, { acao: 'Desfazer', fn: () => registrar({ t: 'cfg', k, v: fechar ? '' : '1' }) });
}

/* ---------- De onde vem o disponível ---------- */
function abrirDetalheReserva(foco = '') {
  const ano = S.ano; const mes = S.mes;
  abrirFolha({
    tipo: 'reserva',
    montar(el) {
      const pintar = () => {
        const r = resumo(ano, mes);
        const ordem = (a, b) => b.v.falta - a.v.falta;
        const daCat = (fn) => r.porCat.filter(({ c, v }) => fn(c, v));
        const aReceber = daCat((c, v) => c.grupo === 'renda' && v.falta > 0).sort(ordem);
        const contas = daCat((c, v) => c.grupo === 'fixo' && !ehGuardar(c) && v.falta > 0).sort(ordem);
        const guardar = daCat((c, v) => ehGuardar(c) && v.falta > 0);
        const planos = daCat((c, v) => c.grupo === 'variavel' && !ehGuardar(c) && v.falta > 0).sort(ordem);
        const acima = daCat((c, v) => c.grupo !== 'renda' && !ehGuardar(c) && v.plano > 0 && v.real > v.plano + 0.004)
          .sort((a, b) => (b.v.real - b.v.plano) - (a.v.real - a.v.plano));
        const encerradas = daCat((c, v) => v.encerrada);
        const totalAcima = acima.reduce((a, { v }) => a + (v.real - v.plano), 0);
        const linha = (c, detalhe, valor, classe = '', liberar = false) => `<div class="reserva-linha"><button type="button" class="reserva-abrir" data-f="abrir" data-cat="${esc(c.id)}">${mono(c)}<span class="reserva-txt"><strong>${esc(c.nome)}</strong><span>${esc(detalhe)}</span></span><strong class="reserva-valor${classe ? ' ' + classe : ''}">${valor}</strong></button>${liberar ? `<button type="button" class="botao pequeno fantasma reserva-liberar" data-f="liberar" data-cat="${esc(c.id)}">Liberar</button>` : ''}</div>`;

          `<div><span>Renda do mês${r.aReceber > 0 ? ` (recebida ${moeda(r.recebida)} · a receber ${moeda(r.aReceber)})` : ''}</span><strong>${moeda(r.renda)}</strong></div>`,
          `<div><span>− ${r.fase === 'futuro' ? 'Já lançado' : 'Já saiu'}</span><strong>${moeda(r.jaSaiu)}</strong></div>`,
          r.contasAPagar > 0 ? `<div><span>− Contas a pagar</span><strong>${moeda(r.contasAPagar)}</strong></div>` : '',
          r.faltaGuardar > 0 ? `<div><span>− Falta guardar</span><strong>${moeda(r.faltaGuardar)}</strong></div>` : '',
          r.nosPlanos > 0 ? `<div><span>− Ainda nos planos</span><strong>${moeda(r.nosPlanos)}</strong></div>` : '',
          `<div class="total"><span>= Disponível</span><strong>${moeda(r.disponivel)}</strong></div>`,
        ].join('');
        const bloco = (titulo, total, texto, itens, fmt, extra = '', id = '') => !itens.length ? ''
          : `<section${id ? ` id="${id}"` : ''}><h3 class="grupo-titulo"><span>${titulo}</span><span>${moeda(total)}</span></h3><p class="sub">${texto}</p>${extra}<div class="lista">${itens.map(fmt).join('')}</div></section>`;
        el.innerHTML = topoFolha('Como o disponível é calculado', `${Mes(mes)} de ${ano}`)
          + '<div class="folha-corpo">'
          + '<p class="sub">O disponível é a renda do mês menos o que já saiu e menos o que ainda está reservado: as contas a pagar, o que falta guardar e o que ainda resta nos planos. Gastar dentro de um plano não muda o disponível; gastar fora dele, ou além dele, reduz na mesma medida. Não é o saldo do banco.</p>'
          + `<div class="conta-heroi" style="margin-top:0">${linhas}</div>`
          + bloco('A receber', r.aReceber, 'Rendas previstas que ainda não entraram por completo. Se alguma não vier, toque nela e use "Não vem mais".', aReceber,
            ({ c, v }) => linha(c, `previsto ${moeda(v.plano)} · recebido ${moeda(v.real)}`, moeda(v.falta)))
          + bloco('Contas a pagar', r.contasAPagar, 'O que falta das contas fixas do mês. Se uma conta veio mais barata, use "Liberar": o que faltava volta ao disponível.', contas,
            ({ c, v }) => linha(c, v.real ? `plano ${moeda(v.plano)} · pago ${moeda(v.real)}` : `plano ${moeda(v.plano)}`, moeda(v.falta), '', true))
          + bloco('Falta guardar', r.faltaGuardar, 'O que falta para a meta de economia do mês.', guardar,
            ({ c, v }) => linha(c, `meta ${moeda(v.plano)} · guardado ${moeda(v.real)}`, moeda(v.falta)))
          + bloco('Ainda nos planos', r.nosPlanos, 'O que resta dos planos das categorias variáveis. Se você não vai gastar mais numa delas neste mês, use "Liberar": o plano fecha no que você gastou.', planos,
            ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · gasto ${moeda(v.real)}`, moeda(v.falta), '', true),
            planos.length > 1 ? `<div class="acoes" style="margin-bottom:8px"><button type="button" class="botao pequeno" data-f="liberar-todos">Liberar todos (${moeda(r.nosPlanos)})</button></div>` : '',
            'reserva-planos')
          + bloco('Acima do plano', totalAcima, 'Categorias em que você gastou mais do que o plano. O excesso já está em "já saiu".', acima,
            ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · gasto ${moeda(v.real)}`, moeda(v.real - v.plano), 'acima'))
          + bloco('Liberadas no mês', 0, 'O que faltava delas voltou ao disponível. O plano continua gravado.', encerradas,
            ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · lançado ${moeda(v.real)}`, c.grupo === 'renda' ? 'não vem' : 'liberada'))
          + '<div class="acoes"><button type="button" class="botao" data-f="ajustar">Ajustar planos</button></div>'
          + '</div>';
      };
      pintar();
      this.atualizar = pintar;
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        if (b.dataset.f === 'fechar') fecharFolha();
        else if (b.dataset.f === 'abrir') { const cid = b.dataset.cat; fecharFolha(); abrirCategoria(cid, ano, mes); }
        else if (b.dataset.f === 'liberar') { encerrarCategoria(b.dataset.cat, ano, mes, true); render(); }
        else if (b.dataset.f === 'liberar-todos') {
          const r = resumo(ano, mes);
          const alvo = r.porCat.filter(({ c, v }) => c.grupo === 'variavel' && !ehGuardar(c) && v.falta > 0);
          const total = alvo.reduce((s, { v }) => s + v.falta, 0);
          const chaves = alvo.map(({ c }) => chaveEncerrada(ano, mes, c.id));
          chaves.forEach((k) => registrar({ t: 'cfg', k, v: '1' }));
          aviso(`${alvo.length} planos liberados: ${moeda(total)} voltaram ao disponível.`, { acao: 'Desfazer', fn: () => chaves.forEach((k) => registrar({ t: 'cfg', k, v: '' })) });
          render();
        }
        else if (b.dataset.f === 'ajustar') {
          fecharFolha();
          S.modoMes = 'planejar';
          if (S.tela !== 'mes') irPara('mes'); else render();
        }
      });
      if (foco === 'planos') requestAnimationFrame(() => { const s = el.querySelector('#reserva-planos'); if (s) s.scrollIntoView({ block: 'start' }); });
    },
  });
}

/* ---------- Importar backup ---------- */
/** O que a importação vai aceitar e ignorar, pelas mesmas regras do servidor, para mostrar antes de importar. */
function previaImportacao(d, modo) {
  const RE = /^[A-Za-z0-9][A-Za-z0-9_-]{0,59}$/;
  const motivos = [];
  const anotar = (t) => { if (motivos.length < 5) motivos.push(t); };
  const ids = new Set(modo === 'mesclar' && S.dados ? S.dados.categorias.map((c) => c.id) : []);
  let catOk = 0; let catNao = 0;
  for (const c of d.categorias) {
    const nome = String((c && c.nome) ?? '').trim();
    if (c && RE.test(String(c.id)) && nome && ORDEM_GRUPOS.includes(String(c.grupo))) { catOk++; ids.add(String(c.id)); }
    else { catNao++; anotar(`categoria ${String((c && (c.nome || c.id)) ?? '?')}: sem nome, identificador ou grupo válido`); }
  }
  let lOk = 0; let lNao = 0;
  for (const [a, b] of Object.entries(d.anos || {})) {
    for (const l of (b && b.lancamentos) || []) {
      const ano = Number(a); const mes = Number(l && l.mes);
      const dia = !l || l.dia === null || l.dia === undefined || l.dia === '' ? null : Number(l.dia);
      const v = Number(l && l.valor);
      const motivo = !(Number.isInteger(ano) && ano >= 1900 && ano <= 2200) ? 'ano inválido'
        : !(Number.isInteger(mes) && mes >= 1 && mes <= 12) ? 'mês inválido'
          : dia !== null && !(Number.isInteger(dia) && dia >= 1 && dia <= diasNoMes(ano, mes)) ? `dia inválido para o mês: ${dia}`
            : !ids.has(String(l && l.categoriaId)) ? `categoria inexistente: ${l && l.categoriaId}`
              : !Number.isFinite(v) || v === 0 || Math.abs(v) >= 1e9 ? 'valor inválido' : '';
      if (motivo) { lNao++; anotar(`lançamento ${(l && l.id) || ''} (${a}): ${motivo}`); } else lOk++;
    }
  }
  const aaaamm = (x) => Number.isInteger(x) && x >= 190001 && x <= 220012 && x % 100 >= 1 && x % 100 <= 12;
  let rOk = 0; let rNao = 0;
  for (const r of Array.isArray(d.recorrencias) ? d.recorrencias : []) {
    const v = Number(r && r.valor); const ini = Number(r && r.inicio);
    const fim = !r || r.fim === null || r.fim === undefined || r.fim === '' ? null : Number(r.fim);
    const dia = !r || r.dia === null || r.dia === undefined || r.dia === '' ? null : Number(r.dia);
    const motivo = !r || !RE.test(String(r.id)) ? 'identificador inválido'
      : !ids.has(String(r.categoriaId)) ? `categoria inexistente: ${r.categoriaId}`
        : !Number.isFinite(v) || v <= 0 || v >= 1e9 ? 'valor inválido'
          : !aaaamm(ini) || (fim !== null && (!aaaamm(fim) || fim < ini)) ? 'período inválido'
            : dia !== null && !(Number.isInteger(dia) && dia >= 1 && dia <= 31) ? 'dia inválido' : '';
    if (motivo) { rNao++; anotar(`recorrência ${(r && r.id) || ''}: ${motivo}`); } else rOk++;
  }
  let cOk = 0; let cNao = 0;
  for (const c of Array.isArray(d.cartoes) ? d.cartoes : []) {
    const f = Number(c && c.fechamento); const v = Number(c && c.vencimento);
    const lim = !c || c.limite === null || c.limite === undefined || c.limite === '' ? null : Number(c.limite);
    const motivo = !c || !/^k[a-z0-9]{10}$/.test(String(c.id)) ? 'identificador inválido'
      : !String(c.nome ?? '').trim() ? 'sem nome'
        : !(Number.isInteger(f) && f >= 1 && f <= 31) || !(Number.isInteger(v) && v >= 1 && v <= 31) ? 'dia de fechamento ou de vencimento inválido'
          : lim !== null && !(Number.isFinite(lim) && lim > 0 && lim < 1e10) ? 'limite inválido' : '';
    if (motivo) { cNao++; anotar(`cartão ${(c && (c.nome || c.id)) || ''}: ${motivo}`); } else cOk++;
  }
  return { catOk, catNao, lOk, lNao, rOk, rNao, cOk, cNao, motivos };
}
function abrirImportar() {
  abrirFolha({
    tipo: 'importar',
    montar(el) {
      el.innerHTML = topoFolha('Importar backup')
        + '<div class="folha-corpo"><p class="sub">Arquivo JSON baixado em Ajustes › Baixar backup (formatos 1, 2 e 3).</p>'
        + '<label class="campo">Arquivo<input type="file" id="im-arquivo" accept=".json,application/json" data-autofoco></label><div id="im-previa"></div></div>'
        + '<footer class="folha-rodape"><button type="button" class="botao primario grande" data-f="importar" id="im-botao" disabled>Importar</button></footer>';
      let dados = null;
      const modo = () => ($('input[name="im-modo"]:checked', el) || {}).value || 'mesclar';
      // Mostra o que entra e o que fica de fora; "Substituir" só libera depois de digitar a palavra.
      const atualizarPrevia = () => {
        if (!dados) return;
        const pv = previaImportacao(dados, modo());
        const ignorados = pv.catNao + pv.lNao + pv.rNao + pv.cNao;
        const subst = modo() === 'substituir';
        const partes = [`${pv.lOk} lançamento${pv.lOk === 1 ? '' : 's'}`];
        if (Array.isArray(dados.recorrencias)) partes.push(`${pv.rOk} recorrência${pv.rOk === 1 ? '' : 's'}`);
        if (Array.isArray(dados.cartoes)) partes.push(`${pv.cOk} cartão${pv.cOk === 1 ? '' : 'es'}`);
        $('#im-aceitos', el).innerHTML = `Vão entrar ${pv.catOk} categoria${pv.catOk === 1 ? '' : 's'}${partes.length > 1 ? ',' : ' e'} ${partes.slice(0, -1).join(', ')}${partes.length > 1 ? ' e ' : ''}${partes[partes.length - 1]}.`
          + (ignorados ? ` <strong>${ignorados} ite${ignorados === 1 ? 'm fica' : 'ns ficam'} de fora:</strong> ${esc(pv.motivos.join('; '))}${ignorados > pv.motivos.length ? '…' : ''}` : '')
          + (subst ? ' <strong>Substituir:</strong> as recorrências, as marcas "Não vem em" e os cartões de crédito atuais são trocados pelos do arquivo.' : '');
        $('#im-substituir', el).hidden = !subst;
        const ok = !subst || normal($('#im-confirma', el).value).trim() === 'substituir';
        $('#im-botao', el).disabled = !ok || !(pv.catOk > 0);
        $('#im-botao', el).textContent = subst ? 'Substituir tudo' : 'Importar';
      };
      $('#im-arquivo', el).addEventListener('change', async (e) => {

        if (!arq) { prev.innerHTML = ''; return; }
        try {
          const d = JSON.parse(await arq.text());
          if (!d || !Array.isArray(d.categorias) || !d.anos) throw new Error('não parece um backup deste app');
          let n = 0; for (const b of Object.values(d.anos)) n += (b.lancamentos || []).length;
          dados = d;
          prev.innerHTML = `<div class="previa"><div><span class="sub">Categorias</span><strong>${d.categorias.length}</strong></div><div><span class="sub">Lançamentos</span><strong>${n}</strong></div>${Array.isArray(d.recorrencias) ? `<div><span class="sub">Recorrências</span><strong>${d.recorrencias.length}</strong></div>` : ''}${Array.isArray(d.cartoes) ? `<div><span class="sub">Cartões</span><strong>${d.cartoes.length}</strong></div>` : ''}<div><span class="sub">Anos</span><strong>${esc(Object.keys(d.anos).join(', ') || '—')}</strong></div></div>`
            + '<p class="sub" id="im-aceitos" aria-live="polite" style="margin-top:10px"></p>'
            + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'
            + '<label class="opcao"><input type="radio" name="im-modo" value="mesclar" checked><span><strong>Juntar com o que já existe</strong>Itens com o mesmo identificador são atualizados; o resto é acrescentado.</span></label>'
            + '<label class="opcao"><input type="radio" name="im-modo" value="substituir"><span><strong>Substituir tudo</strong>Apaga o que está na planilha e coloca o conteúdo do arquivo. O Google guarda versões antigas em Arquivo › Histórico de versões.</span></label></div>'
            + '<div id="im-substituir" hidden style="margin-top:12px">'
            + `<div class="acoes"><button type="button" class="botao" data-f="backup">${ic('baixar', 18)}Baixar backup agora</button></div>`
            + '<label class="campo" style="margin-top:10px">Para substituir tudo, digite SUBSTITUIR<input class="entrada" id="im-confirma" autocomplete="off" spellcheck="false"></label></div>';
          $$('input[name="im-modo"]', el).forEach((r) => r.addEventListener('change', atualizarPrevia));
          $('#im-confirma', el).addEventListener('input', atualizarPrevia);
          atualizarPrevia();
        } catch (err) {
          prev.innerHTML = `<p class="entendi erro">Não consegui ler esse arquivo: ${esc(err.message)}.</p>`;
        }
      });
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        if (b.dataset.f === 'fechar') { fecharFolha(); return; }
        if (b.dataset.f === 'backup') { if (S.dados) exportarJSON(); return; }
        if (b.dataset.f !== 'importar' || !dados || b.disabled) return;
        if (S.exemplo) { aviso('No modo exemplo nada é gravado. Toque em Começar do zero para importar de verdade.', { tipo: 'erro' }); return; }
        const m = modo();
        b.disabled = true; b.textContent = 'Importando…';
        try {
          await esvaziarFila();
          const r = JSON.parse(await chamar('sincronizar', S.dados.revisao, JSON.stringify([{ t: 'importar', dados, modo: m, confirmado: true }])));
          if (r.rejeitadas && r.rejeitadas.length) throw new Error(r.rejeitadas[0].motivo);
          S.dados = JSON.parse(r.dados); S.versao++;
          salvarCache(); persistirFila();
          let n = 0; for (const x of Object.values(S.dados.anos)) n += x.lancamentos.length;
          fecharFolha();
          if (!S.montado) montarApp(); else render();
          const im = r.importacao;
          const ign = im ? (im.categorias.ignoradas || 0) + (im.lancamentos.ignorados || 0) + (im.planos.ignorados || 0) + ((im.recorrencias && im.recorrencias.ignoradas) || 0) + ((im.cartoes && im.cartoes.ignoradas) || 0) : 0;
          aviso(`Importação concluída. A planilha tem agora ${n} lançamento${n === 1 ? '' : 's'}.`
            + (ign ? ` ${ign} ite${ign === 1 ? 'm ficou' : 'ns ficaram'} de fora: ${(im.motivos || []).slice(0, 2).join('; ')}.` : ''), { tipo: ign ? 'erro' : 'info', tempo: ign ? 15000 : undefined });
        } catch (err) {
          aviso('Não deu para importar: ' + err.message, { tipo: 'erro' });
          b.disabled = false; b.textContent = m === 'substituir' ? 'Substituir tudo' : 'Importar';
        }
      });
    },
  });
}

/* ---------- Importar extrato (CSV e OFX) ---------- */
const LIMITE_EXTRATO = 2 * 1024 * 1024;
const MAX_LINHAS_EXTRATO = 2000;
const SITUACOES_EXTRATO = { 'ja-importada': 'Já importada antes', 'duplicada-arquivo': 'Repetida no arquivo' };
/** Folha para trazer lançamentos de um extrato do banco: arquivo, colunas (CSV), prévia editável e confirmação. */
function abrirImportarExtrato() {
  abrirFolha({
    tipo: 'importar-extrato',

        + '<div class="acoes"><button type="button" class="botao pequeno fantasma" data-f="marcar-todas">Marcar todas</button><button type="button" class="botao pequeno fantasma" data-f="desmarcar-todas">Desmarcar todas</button></div>'
        + '<div class="ie-lista" id="ie-lista"></div></div></div>'

        + `<button type="button" class="botao fantasma" data-f="backup">${ic('baixar', 18)}Baixar backup antes</button></footer>`;
      const st = { tipo: '', ofx: null, csv: null, mapa: null, linhas: [], truncado: 0 };
      const estadoFechado = {};
      const hist = [];
      const existentes = [];
      for (const [a, b] of Object.entries(S.dados.anos)) {
        for (const l of b.lancamentos) {
          hist.push({ descricao: l.descricao, categoriaId: l.categoriaId });
          existentes.push({ id: l.id, ano: Number(a), mes: l.mes, dia: l.dia, valor: l.valor, descricao: l.descricao });
        }
      }
      const opcao = (c) => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`;
      const opcoesGrupos = ORDEM_GRUPOS.map((g) => (catsDoGrupo(g).length ? `<optgroup label="${esc(GRUPOS[g])}">${catsDoGrupo(g).map(opcao).join('')}</optgroup>` : '')).join('');
      const marcavel = (l) => l.status === 'nova' || l.status === 'possivel-duplicada';
      const selecionada = (l) => marcavel(l) && l.marcado && Boolean(l.cat);
      const msg = (t) => { $('#ie-msg', el).textContent = t; };
      const padrao = (renda) => {
        const lista = categoriasPorUso(renda).filter((c) => !ehGuardar(c) && !ehSobra(c));
        return lista.length ? lista[0].id : '';
      };
      const preencherPadroes = () => {
        $('#ie-cat-gasto', el).innerHTML = categoriasPorUso(false).map(opcao).join('');
        $('#ie-cat-renda', el).innerHTML = categoriasPorUso(true).map(opcao).join('');
        $('#ie-cat-gasto', el).value = padrao(false);
        $('#ie-cat-renda', el).value = padrao(true);
      };
      const aplicarPadrao = () => {
        const pg = $('#ie-cat-gasto', el).value; const pr = $('#ie-cat-renda', el).value;
        for (const l of st.linhas) if (!l.manual) l.cat = l.sug || (l.valor > 0 ? pr : pg) || null;
      };
      const linhaHtml = (l, i) => {
        const ativa = marcavel(l);
        const data = l.data ? `${dois(l.data.dia)}/${dois(l.data.mes)}/${l.data.ano}` : 'sem data';
        const sit = l.status === 'invalida' ? `Inválida: ${l.motivo}` : l.status === 'possivel-duplicada' ? 'Parece repetida: já há um lançamento igual neste dia' : SITUACOES_EXTRATO[l.status] || '';
        const opts = (l.cat ? '' : '<option value="" selected>Escolher…</option>') + (l.cat ? opcoesGrupos.replace(`value="${l.cat}"`, `value="${l.cat}" selected`) : opcoesGrupos);
        return `<div class="ie-linha ${l.status}">`
          + (ativa ? `<label class="ie-sel"><input type="checkbox" data-ie="marcar" data-i="${i}"${l.marcado ? ' checked' : ''}><span class="sr">Importar esta linha</span></label>` : '<span class="ie-sel"></span>')
          + `<div class="ie-desc"><span class="ie-data">${esc(data)}</span><strong>${esc(l.descricao || 'Sem descrição')}</strong></div>`
          + `<strong class="ie-valor${l.valor > 0 ? ' txt-ok' : ''}">${l.valor === null ? '—' : esc(moeda(l.valor))}</strong>`
          + (ativa ? `<select class="entrada ie-cat" data-ie="cat" data-i="${i}" aria-label="Categoria de ${esc(l.descricao || 'esta linha')}">${opts}</select>` : '')
          + (sit ? `<span class="ie-sit${ativa ? ' atencao' : ''}">${esc(sit)}</span>` : '') + '</div>';
      };
      const desenharLista = () => {
        const corpo = $('.folha-corpo', el); const topo = corpo.scrollTop;
        $('#ie-lista', el).innerHTML = st.linhas.map(linhaHtml).join('');
        corpo.scrollTop = topo;
      };
      const atualizarResumo = () => {
        const L = st.linhas; const sel = L.filter(selecionada);
        const n = (fn) => L.filter(fn).length;
        const partes = [
          [n((l) => l.status === 'ja-importada'), 'já importadas antes'], [n((l) => l.status === 'duplicada-arquivo'), 'repetidas no arquivo'],
          [n((l) => l.status === 'invalida'), 'inválidas (sem data ou valor)'], [n((l) => marcavel(l) && !l.marcado), 'desmarcadas'],
          [n((l) => marcavel(l) && l.marcado && !l.cat), 'sem categoria'],
        ].filter((x) => x[0]).map((x) => `${x[0]} ${x[1]}`);
        let saidas = 0; let rendas = 0;
        for (const l of sel) { const c = catPorId(l.cat); const v = valorDoExtrato(l.valor, c.grupo === 'renda'); if (c.grupo === 'renda') rendas += v; else saidas += v; }
        const ign = L.length - sel.length;
        $('#ie-resumo', el).innerHTML = `<strong>${sel.length} para importar · ${ign} ignorada${ign === 1 ? '' : 's'}</strong>`
          + (partes.length ? `<span class="sub"> (${esc(partes.join('; '))})</span>` : '')
          + (sel.length ? `<span class="sub"> Saídas ${esc(moeda(saidas))} · rendas ${esc(moeda(rendas))}.</span>` : '')
          + (st.truncado ? `<span class="sub"> O arquivo tem mais de ${MAX_LINHAS_EXTRATO.toLocaleString('pt-BR')} linhas: só as primeiras foram lidas.</span>` : '');
        const b = $('#ie-botao', el);
        b.disabled = !sel.length;
        b.textContent = sel.length ? `Importar ${sel.length} lançamento${sel.length === 1 ? '' : 's'}` : 'Importar';
        $('#ie-fechado', el).hidden = true;
      };
      const montarLinhas = () => {
        let base = st.tipo === 'ofx' ? st.ofx.itens.map((i) => ({ ...i, valor: i.valor === 0 ? null : i.valor })) : extratoDeCSV(st.csv.linhas, st.mapa);
        if ($('#ie-fatura', el).checked) base = inverterSinal(base);
        st.truncado = base.length > MAX_LINHAS_EXTRATO ? base.length - MAX_LINHAS_EXTRATO : 0;
        const conta = st.tipo === 'ofx' ? st.ofx.conta : normDesc($('#ie-conta', el).value);
        const memo = new Map();
        st.linhas = classificarExtrato(base.slice(0, MAX_LINHAS_EXTRATO), existentes, conta).map((l) => {
          const k = normDesc(l.descricao);
          if (!memo.has(k)) { const sg = sugerirCategoria(l.descricao, hist); memo.set(k, sg && catPorId(sg) ? sg : null); }
          return { ...l, sug: memo.get(k), cat: null, manual: false, marcado: l.status === 'nova' };
        });
        aplicarPadrao(); desenharLista(); atualizarResumo();
        $('#ie-previa', el).hidden = false;
      };
      const preencherColunas = () => {
        const nomes = st.mapa.cabecalho ? st.csv.linhas[0] : [];
        const n = Math.max(...st.csv.linhas.map((l) => l.length));
        const cols = Array.from({ length: n }, (_, j) => `<option value="${j}">Coluna ${j + 1}${nomes[j] ? ' · ' + esc(String(nomes[j]).slice(0, 24)) : ''}</option>`).join('');
        $('#ie-col-data', el).innerHTML = cols;
        $('#ie-col-valor', el).innerHTML = cols;
        $('#ie-col-desc', el).innerHTML = '<option value="-1">Nenhuma</option>' + cols;
        $('#ie-col-data', el).value = String(st.mapa.data);
        $('#ie-col-desc', el).value = String(st.mapa.descricao);
        $('#ie-col-valor', el).value = String(st.mapa.valor);
        $('#ie-cab', el).checked = st.mapa.cabecalho;
        $('#ie-amostra', el).innerHTML = st.csv.linhas.slice(0, 5).map((l, i) => `<div class="ie-amostra-l${st.mapa.cabecalho && i === 0 ? ' cab' : ''}">${esc(l.join(' · '))}</div>`).join('');
      };
      const ler = async (arq) => {
        msg('');
        st.linhas = []; st.tipo = '';
        for (const id of ['#ie-csv', '#ie-config', '#ie-previa']) $(id, el).hidden = true;
        $('#ie-botao', el).disabled = true;
        if (!arq) return;
        if (arq.size > LIMITE_EXTRATO) { msg('Esse arquivo passa de 2 MB. Exporte um período menor no banco.'); return; }
        let texto;
        try { texto = decodificarTexto(await arq.arrayBuffer()); } catch (e) { msg('Não consegui ler esse arquivo.'); return; }
        const ehOfx = /<STMTTRN>/i.test(texto) || /^\s*OFXHEADER/i.test(texto) || /\.(ofx|qfx)$/i.test(arq.name);
        if (ehOfx) {
          st.ofx = lerOFX(texto);
          if (!st.ofx.itens.length) { msg('Não encontrei lançamentos nesse arquivo OFX.'); return; }
          st.tipo = 'ofx';
        } else {
          st.csv = lerCSV(texto);
          if (!st.csv.linhas.length || Math.max(...st.csv.linhas.map((l) => l.length)) < 2) { msg('Não consegui separar as colunas desse arquivo. Ele é um CSV com data, descrição e valor?'); return; }
          st.tipo = 'csv';
          st.mapa = adivinharColunasCSV(st.csv.linhas);
          preencherColunas();
          $('#ie-csv', el).hidden = false;
        }
        preencherPadroes();
        $('#ie-config', el).hidden = false;
        montarLinhas();
      };
      $('#ie-arquivo', el).addEventListener('change', (e) => ler(e.target.files[0]));
      const recomecar = () => { if (st.tipo) montarLinhas(); };
      $('#ie-cab', el).addEventListener('change', (e) => { st.mapa.cabecalho = e.target.checked; preencherColunas(); recomecar(); });
      for (const [id, chave] of [['#ie-col-data', 'data'], ['#ie-col-desc', 'descricao'], ['#ie-col-valor', 'valor']]) {
        $(id, el).addEventListener('change', (e) => { st.mapa[chave] = Number(e.target.value); recomecar(); });
      }
      $('#ie-conta', el).addEventListener('change', recomecar);
      $('#ie-fatura', el).addEventListener('change', recomecar);
      for (const id of ['#ie-cat-gasto', '#ie-cat-renda']) $(id, el).addEventListener('change', () => { aplicarPadrao(); desenharLista(); atualizarResumo(); });
      $('#ie-lista', el).addEventListener('change', (e) => {
        const alvo = e.target.closest('[data-ie]');
        if (!alvo) return;
        const l = st.linhas[Number(alvo.dataset.i)];
        if (!l) return;
        if (alvo.dataset.ie === 'marcar') l.marcado = alvo.checked;
        else { l.cat = alvo.value || null; l.manual = true; }
        atualizarResumo();
      });
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const f = b.dataset.f;
        if (f === 'fechar') fecharFolha();
        else if (f === 'backup') { if (S.dados) exportarJSON(); }
        else if (f === 'marcar-todas' || f === 'desmarcar-todas') {
          for (const l of st.linhas) if (marcavel(l)) l.marcado = f === 'marcar-todas';
          desenharLista(); atualizarResumo();
        } else if (f === 'importar') {
          const sel = st.linhas.filter(selecionada);
          if (!sel.length) return;
          const meses = sel.map((l) => ({ ano: l.data.ano, mes: l.data.mes }));
          const pedido = pedirConfirmacaoFechado(meses, estadoFechado);
          if (pedido) { const av = $('#ie-fechado', el); av.textContent = pedido; av.hidden = false; return; }
          const ops = sel.map((l) => ({
            t: 'lanc',
            l: { id: l.id, ano: l.data.ano, mes: l.data.mes, dia: l.data.dia, categoriaId: l.cat, descricao: String(l.descricao || '').slice(0, 300), valor: valorDoExtrato(l.valor, catPorId(l.cat).grupo === 'renda') },
          }));
          const reajustar = () => meses.forEach((x, i, a) => { if (a.findIndex((y) => y.ano === x.ano && y.mes === x.mes) === i) atualizarFechamento(x.ano, x.mes); });
          registrarLote(ops);
          reajustar();
          fecharFolha();
          aviso(`${ops.length} lançamento${ops.length === 1 ? '' : 's'} importado${ops.length === 1 ? '' : 's'}.`, { acao: 'Desfazer', fn: () => { registrarLote(ops.map((o) => ({ t: 'lanc-', id: o.l.id }))); reajustar(); } });
        }
      });
    },
  });
}

/* =====================================================================
   Atualização a partir do GitHub (etapa 1: aviso + passos guiados)
   A verificação roda só no navegador (fetch). Nada é enviado: são leituras
   de arquivos públicos. Qualquer falha vira o estado "erro", sem exceção.
   ===================================================================== */
const REPO = 'bsdesenv/bsdesenv-financas';
const URL_CHANGELOG = URL_PROJETO + '/blob/main/CHANGELOG.md';
/* Instalador da bsdesenv (pasta instalador/ do repositório): atualiza este projeto com um
   clique. O link leva só os IDs do projeto e da implantação; nenhum dado da planilha. */
const URL_INSTALADOR = 'https:\/\/script.google.com/macros/s/AKfycbwjAGEw8zZ_ju1NImYSjU539npZRQPM48cl-tgJLugXVe0gxE0lkx_gKmEi3DIL6wFzZA/exec';
const ID_GOOGLE = /^[A-Za-z0-9_-]{20,120}$/;
function urlInstalador() {
  const d = S.dados || {};
  if (!ID_GOOGLE.test(d.scriptId || '')) return '';
  const impl = (/\/macros\/(?:u\/\d+\/)?s\/([A-Za-z0-9_-]{20,120})\/exec/.exec(d.urlApp || '') || [])[1];
  return `${URL_INSTALADOR}?script=${encodeURIComponent(d.scriptId)}${impl ? '&implantacao=' + encodeURIComponent(impl) : ''}`;
}
const urlRaw = (ref, caminho) => `https:\/\/raw.githubusercontent.com/${REPO}/${ref}/${caminho}`;
const urlJsDelivr = (ref, caminho) => `https:\/\/cdn.jsdelivr.net/gh/${REPO}@${ref}/${caminho}`;
const TEMPO_BUSCA = 8000;
const VALIDADE_OK = 24 * 3600 * 1000;
const VALIDADE_ERRO = 10 * 60 * 1000;
const VERSAO_OK = /^\d+\.\d+\.\d+$/;
const REF_OK = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
const CAMINHO_OK = /^src\/[A-Za-z0-9][A-Za-z0-9._-]{0,60}$/;

function compararVersoes(a, b) {
  const pa = String(a).split('.').map(Number); const pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    const x = pa[i] || 0; const y = pb[i] || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}
const atualizacaoAuto = () => LS.ler('atualizacao-auto') !== false;
const atualizacaoNova = () => (S.atualizacao && S.atualizacao.estado === 'nova' ? S.atualizacao : null);
const refValida = (r) => typeof r === 'string' && REF_OK.test(r) && !r.includes('..');

async function buscarUrl(url) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TEMPO_BUSCA);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: c.signal });
    if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return await r.arrayBuffer();
  } finally { clearTimeout(t); }
}
/** Tenta o raw.githubusercontent.com e, se falhar, o jsDelivr. Devolve os bytes. */
async function buscarArquivo(ref, caminho) {
  if (!refValida(ref)) throw new Error('referência inválida');
  let primeiro = null;
  for (const url of [urlRaw, urlJsDelivr]) {
    try { return await buscarUrl(url(ref, caminho)); } catch (e) { primeiro = primeiro || e; }
  }
  throw primeiro;
}
async function sha256Hex(bytes) {
  const h = await crypto.subtle.digest('SHA-256', bytes);

/** Valida o versao.json e devolve só o que o app usa (ou lança erro). */
function lerManifesto(bytes) {
  const m = JSON.parse(new TextDecoder().decode(bytes));
  if (!m || m.app !== 'bsdesenv-financas' || !VERSAO_OK.test(String(m.versao)) || !refValida(m.ref)) throw new Error('versao.json inválido');
  const texto = (v, n) => String(v ?? '').slice(0, n);
  const arquivos = (Array.isArray(m.arquivos) ? m.arquivos : []).map((a) => ({
    nome: texto(a && a.nome, 60), editor: texto(a && a.editor, 60), caminho: texto(a && a.caminho, 80), sha256: texto(a && a.sha256, 64),
  }));
  if (arquivos.some((a) => !a.editor || !CAMINHO_OK.test(a.caminho) || a.caminho.includes('..') || !/^[0-9a-f]{64}$/.test(a.sha256))) throw new Error('lista de arquivos inválida');
  return {
    versao: m.versao, ref: m.ref, data: /^\d{4}-\d{2}-\d{2}$/.test(String(m.data)) ? m.data : '',
    novidades: (Array.isArray(m.novidades) ? m.novidades : []).filter((n) => typeof n === 'string' && n.trim()).slice(0, 5).map((n) => n.slice(0, 140)),
    arquivos: arquivos.slice(0, 20),
  };
}
function resultadoGuardado() {
  const g = LS.ler('atualizacao');
  if (!g || !VERSAO_OK.test(String(g.versao)) || !refValida(g.ref) || !(Date.now() - g.verificadoEm < VALIDADE_OK)) return null;
  return { ...g, novidades: Array.isArray(g.novidades) ? g.novidades.filter((n) => typeof n === 'string').slice(0, 5) : [] };

const estadoDaVersao = (versao) => (compararVersoes(versao, S.dados.versaoApp || '0.0.0') > 0 ? 'nova' : 'atual');

async function verificarAtualizacao({ forcar = false } = {}) {
  if ((!forcar && !atualizacaoAuto()) || !S.dados || S.exemplo) return;
  if (S.verificandoAtu) return S.verificandoAtu;
  if (!forcar) {
    const a = S.atualizacao;
    if (a && Date.now() - a.verificadoEm < (a.estado === 'erro' ? VALIDADE_ERRO : VALIDADE_OK)) return;
    const g = a ? null : resultadoGuardado();
    if (g) { S.atualizacao = { ...g, estado: estadoDaVersao(g.versao) }; pintarAtualizacao(Boolean(atualizacaoNova())); return; }
  }
  const eraNova = Boolean(atualizacaoNova());
  if (!S.atualizacao) S.atualizacao = { estado: 'verificando' };
  S.verificandoAtu = (async () => {
    try {
      const m = lerManifesto(await buscarArquivo('main', 'versao.json'));
      const base = { versao: m.versao, ref: m.ref, data: m.data, novidades: m.novidades, verificadoEm: Date.now() };
      LS.gravar('atualizacao', base);
      S.atualizacao = { ...base, estado: estadoDaVersao(m.versao) };
    } catch (e) {
      S.atualizacao = { estado: 'erro', verificadoEm: Date.now() };
    } finally {
      S.verificandoAtu = null;
      pintarAtualizacao(eraNova !== Boolean(atualizacaoNova()));
    }
  })();
  pintarAtualizacao(false);
  return S.verificandoAtu;
}

const horaLocal = (ms) => { const d = new Date(ms); return `${dois(d.getHours())}:${dois(d.getMinutes())}`; };
const dataBr = (iso) => (/^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.split('-').reverse().join('/') : '');
