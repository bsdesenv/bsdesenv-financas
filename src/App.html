function calcularAvisos(r) {

  for (const { c, v } of r.porCat) {

      lista.push({ tipo: 'acima', icone: 'setaSobe', catId: c.id, html: `<strong>${esc(c.nome)} passou ${moeda(v.real - v.plano)} do plano.</strong> <span>${moeda(v.real)} gastos para ${moeda(v.plano)} planejados.</span>` });
    }
  }
  if (r.ritmo >= 0.25) {
    let melhor = null;
    for (const { c, v } of r.porCat) {
      if (c.grupo !== 'variavel' || ehGuardar(c) || v.qtd < 2) continue;
      // Projeção pelo ritmo só faz sentido para gasto frequente (mercado, transporte...),
      // não para o esporádico (farmácia, compras).
      let freq = 0;
      for (let k = 1; k <= 3; k++) { const d = deChave(chaveMes(S.ano, S.mes) - k); freq += celReal(c.id, d.ano, d.mes).qtd; }
      if (freq / 3 < 4) continue;
      const med = media3(c.id, S.ano, S.mes);
      if (med < 50) continue;
      const proj = v.real / r.ritmo; const dif = proj / med - 1;
      if (Math.abs(dif) >= 0.2 && (!melhor || Math.abs(dif) > Math.abs(melhor.dif))) melhor = { c, proj, dif };
    }
    if (melhor) {
      lista.push({
        tipo: melhor.dif > 0 ? 'atencao' : 'info', icone: melhor.dif > 0 ? 'setaSobe' : 'setaDesce', catId: melhor.c.id,
        html: `<strong>Projeção de ${esc(melhor.c.nome)}: ${moeda(melhor.proj)}.</strong> <span>No ritmo atual, ${Math.round(Math.abs(melhor.dif) * 100)}% ${melhor.dif > 0 ? 'acima' : 'abaixo'} da média dos últimos 3 meses.</span>`,
      });
    }
  }
  return lista.slice(0, 4);
}

/** "Onde foi?": as maiores saídas do mês (sem Guardar), em barras horizontais com nome, valor e percentual. */

function cartaoUltimos() {

function cartaoAno() {
  const ini = inicioDados();
  const meses = Array.from({ length: 12 }, (_, i) => {
    const rr = resumo(S.ano, i + 1);
    const passado = rr.fase === 'passado';
    const semDados = passado && chaveMes(S.ano, i + 1) < ini;
    const sobra = semDados ? 0 : passado ? rr.sobraRealizada : rr.disponivel;
    return { mes: i + 1, sobra, fase: rr.fase, real: passado && !semDados, semDados };
  });
  const mp = Math.max(0, ...meses.map((m) => m.sobra)); const mn = Math.max(0, ...meses.map((m) => -m.sobra));
  const total = mp + mn || 1;
  let hp = mp / total; let hn = mn / total;
  if (mp && hp < 0.2) { hp = 0.2; hn = 0.8; }
  if (mn && hn < 0.2) { hn = 0.2; hp = 0.8; }
  if (!mp) { hp = 0; hn = 1; } else if (!mn) { hp = 1; hn = 0; }
  const reais = meses.filter((m) => m.real);
  const acumulado = reais.reduce((a, m) => a + m.sobra, 0);
  const previsto = meses.filter((m) => !m.real && !m.semDados).reduce((a, m) => a + m.sobra, 0);
  const barras = meses.map((m) => {
    const hPos = m.sobra > 0 && mp ? Math.max(2, (m.sobra / mp) * 100) : 0;
    const hNeg = m.sobra < 0 && mn ? Math.max(2, (-m.sobra / mn) * 100) : 0;
    const extra = m.semDados ? ' (sem lançamentos)' : m.real ? ' (realizada)' : m.fase === 'atual' ? ' (em andamento)' : ' (prevista)';
    return `<button type="button" class="ga-mes ${m.fase}${!m.real && m.fase === 'passado' ? ' futuro' : ''}${m.mes === S.mes ? ' sel' : ''}" data-acao="ir-mes" data-mes="${m.mes}" data-foco="ga-${m.mes}" title="${esc(Mes(m.mes) + ': ' + moeda(m.sobra) + extra)}" aria-label="${esc(MesC(m.mes) + ' — ' + Mes(m.mes) + ': ' + moeda(m.sobra) + extra)}">`
      + `<span class="ga-col"><span class="ga-pos"><i style="height:${hPos.toFixed(1)}%"></i></span><span class="ga-neg"><i style="height:${hNeg.toFixed(1)}%"></i></span></span><span class="ga-rot">${MesC(m.mes)}</span></button>`;
  }).join('');
  const melhor = reais.length ? reais.reduce((a, m) => (m.sobra > a.sobra ? m : a)) : null;
  const pior = reais.length > 1 ? reais.reduce((a, m) => (m.sobra < a.sobra ? m : a)) : null;
  const media = reais.length ? acumulado / reais.length : 0;
  return `<section class="cartao g-ano" aria-labelledby="h-ano"><div class="cartao-topo"><h2 id="h-ano">Sobra mês a mês · ${S.ano}</h2></div>`
    + '<div class="legenda"><span><i style="background:var(--acento)"></i>sobrou</span><span><i style="background:var(--acima)"></i>faltou</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--tinta-3)"></i>em andamento ou prevista (contorno)</span></div>'
    + `<figure class="grafico-ano"><div class="ga-barras" style="--hp:${hp.toFixed(4)};--hn:${hn.toFixed(4)}">${barras}</div>`
    + `<div class="ga-resumo"><div><span>Média dos meses fechados</span><strong>${reais.length ? moeda(media) : '—'}</strong></div><div><span>Melhor mês</span><strong>${melhor ? `${MesC(melhor.mes)} · ${moeda(melhor.sobra)}` : '—'}</strong></div><div><span>Pior mês</span><strong class="${pior && pior.sobra < 0 ? 'txt-acima' : ''}">${pior ? `${MesC(pior.mes)} · ${moeda(pior.sobra)}` : '—'}</strong></div></div>`
    + `<figcaption class="sub" style="margin-top:8px">Sobra realizada em ${S.ano}: <strong class="${acumulado < 0 ? 'txt-acima' : 'txt-ok'}">${moeda(acumulado)}</strong>${previsto ? `; com o mês atual e os previstos até dezembro, ${moeda(acumulado + previsto)}` : ''}.</figcaption></figure></section>`;
}

/* ---------- Extrato ---------- */
function filtrarExtrato() {
  const q = normal(S.busca.trim());
  const doAno = Boolean(q);
  const b = S.dados.anos[S.ano];
  const mapa = mapaCats();
  let itens = b ? b.lancamentos.filter((l) => doAno || l.mes === S.mes) : [];
  if (S.filtro !== 'tudo') itens = itens.filter((l) => ((mapa[l.categoriaId] || {}).grupo === 'renda') === (S.filtro === 'rendas'));
  if (S.filtroCat) itens = itens.filter((l) => l.categoriaId === S.filtroCat);
  if (q) {
    itens = itens.filter((l) => normal(l.descricao).includes(q) || normal((mapa[l.categoriaId] || {}).nome).includes(q) || num(Math.abs(l.valor)).includes(S.busca.trim()));
  }
  itens.sort((a, c) => c.mes - a.mes || (c.dia ?? 0) - (a.dia ?? 0) || (c.id > a.id ? 1 : -1));
  let gastos = 0; let rendas = 0;
  for (const l of itens) { if ((mapa[l.categoriaId] || {}).grupo === 'renda') rendas += l.valor; else gastos += l.valor; }
  return { itens, doAno, gastos: arred(gastos), rendas: arred(rendas), mapa };
}
function tituloDia(ano, mes, dia) {
  if (!dia) return `Sem dia definido · ${MESES[mes - 1]}`;
  const h = hoje(); const d = new Date(ano, mes - 1, dia);
  const sem = d.toLocaleDateString('pt-BR', { weekday: 'long' });
  const base = `${sem}, ${dia} ${MESES_C[mes - 1]}`;
  if (ano === h.ano && mes === h.mes && dia === h.dia) return 'Hoje · ' + base;
  const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
  if (ano === ontem.getFullYear() && mes === ontem.getMonth() + 1 && dia === ontem.getDate()) return 'Ontem · ' + base;
  return cap(base);
}

/* ---------- Mês (acompanhar e planejar) ---------- */
function telaMes() {
  const r = resumo(S.ano, S.mes);
  const seg = (id, txt) => `<button type="button" data-acao="modo-mes" data-modo="${id}" data-foco="modo-${id}" aria-pressed="${S.modoMes === id}">${txt}</button>`;
  return `<div class="mes"><div class="mes-cab"><div class="segmentado" role="group" aria-label="Modo">${seg('acompanhar', 'Acompanhar')}${seg('planejar', 'Planejar')}</div>`
    + kpisMes(r) + '</div>' + (S.modoMes === 'planejar' ? telaPlanejar() : telaAcompanhar(r)) + '</div>';
}
function kpisMes(r) {
  if (S.modoMes === 'planejar') {
    let renda = 0; let gastos = 0;
    for (const c of cats()) { const p = planoExp(c.id, S.ano, S.mes); if (c.grupo === 'renda') renda += p; else gastos += p; }
    const sobra = renda - gastos;
    return `<div class="kpis-mes"><div><span>Renda planejada</span><strong class="txt-ok">${num(renda)}</strong></div><div><span>Saídas planejadas</span><strong>${num(gastos)}</strong></div>`
      + `<div class="${sobra < 0 ? 'alerta' : ''}"><span>Sobra do plano</span><strong>${num(sobra)}</strong></div></div>`;
  }
  const f = r.fase;
  const renda = f === 'passado' ? r.recebida : r.renda;
  const saidas = f === 'passado' ? r.jaSaiu : r.saidasPrevistas;
  const sobra = f === 'passado' ? r.sobraRealizada : r.disponivel;
  const rotRenda = f === 'passado' ? 'Renda recebida' : f === 'futuro' ? 'Renda prevista' : 'Renda do mês';
  const rotSaidas = f === 'passado' ? 'Saídas' : 'Saídas previstas';
  const rotSobra = f === 'passado' ? 'Sobra realizada' : f === 'futuro' ? 'Sobra prevista' : 'Disponível';
  const dica = f === 'atual' ? ' title="Já saiu + contas a pagar + falta guardar + ainda nos planos"' : '';
  return `<div class="kpis-mes"><div><span>${rotRenda}</span><strong class="txt-ok">${num(renda)}</strong></div>`
    + `<div${dica}><span>${rotSaidas}</span><strong>${num(saidas)}</strong></div>`
    + `<div class="${sobra < 0 ? 'alerta' : ''}"><span>${rotSobra}</span><strong>${num(sobra)}</strong></div></div>`;
}
function telaAcompanhar(r) {
  const blocos = ORDEM_GRUPOS.map((g) => {
    const itens = r.porCat.filter((x) => x.c.grupo === g);
    if (!itens.length) return '';
    const feito = itens.reduce((a, x) => a + (r.fase === 'futuro' ? x.v.valor : x.v.real), 0);
    const previsto = itens.reduce((a, x) => a + (x.v.plano || 0), 0);
    return `<section><h2 class="grupo-titulo"><span>${GRUPOS[g]}</span><span>${num(feito)}${previsto ? ' de ' + num(previsto) : ''}</span></h2>`
      + `<div class="lista">${itens.map(({ c, v }) => linhaCat(c, v, r.ritmo, S.ano, S.mes)).join('')}</div></section>`;
  }).join('');
  const legenda = r.fase === 'atual' ? `<p class="dica-ritmo"><i aria-hidden="true"></i>A marca nas barras das categorias variáveis indica o dia de hoje (${Math.round(r.ritmo * 100)}% do mês decorrido).</p>` : '';
  return legenda + blocos + `<div class="acoes"><button type="button" class="botao fantasma" data-acao="tela" data-tela="planilha" data-foco="ver-planilha">${ic('planilha', 18)}Ver o ano inteiro na planilha</button></div>`;
}
function telaPlanejar() {

/* ---------- Planilha ---------- */
function telaPlanilha() {
  const ano = S.ano; const h = hoje();
  const meses = Array.from({ length: 12 }, (_, i) => i + 1);
  let corpo = ''; let r = 0;
  const colInicial = ano === h.ano ? h.mes - 1 : 0;
  for (const g of ORDEM_GRUPOS) {
    const lista = catsDoGrupo(g);
    if (!lista.length) continue;
    // O rótulo fica na primeira coluna (fixa): continua visível quando a tabela rola para o lado.
    corpo += `<tr class="grupo"><th class="cat" scope="rowgroup">${GRUPOS[g]}</th><td colspan="13"></td></tr>`;
    for (const c of lista) {
      const vals = meses.map((m) => celula(c.id, ano, m));
      const reais = vals.filter((v) => v.fase === 'passado' && v.qtd > 0).map((v) => v.real);
      const media = reais.length >= 3 ? reais.reduce((a, b) => a + b, 0) / reais.length : 0;
      let total = 0;
      let linha = `<tr><th scope="row" class="cat" title="${esc(c.nome)}">${esc(c.nome)}</th>`;
      vals.forEach((v, i) => {
        const m = i + 1;
        total += v.fase === 'passado' ? v.real : v.real + v.falta;
        const cls = ['cel'];
        if (v.fase === 'atual') cls.push('atual');
        if (v.tipo === 'previsto') cls.push('prev');
        const mostrado = v.fase === 'atual' && v.qtd ? v.real : v.valor;
        if (!mostrado) cls.push('zero');
        let estilo = ''; let marca = '';
        if (S.calor && media && v.fase === 'passado' && v.qtd > 0) {
          const q = v.real / media;
          marca = q >= 1.15 ? '▲' : q <= 0.85 ? '▼' : '';
          if (q >= 1.15) estilo = `background-color:color-mix(in srgb, var(--calor-acima) ${Math.min(32, (q - 1) * 45).toFixed(1)}%, var(--cartao))`;
          else if (q <= 0.85) estilo = `background-color:color-mix(in srgb, var(--calor-abaixo) ${Math.min(22, (1 - q) * 40).toFixed(1)}%, var(--cartao))`;
        }
        const mini = v.fase === 'atual' && v.qtd && v.plano > 0 && g !== 'renda'
          ? `<span class="mini"><i class="${v.real > v.plano ? 'acima' : ''}" style="width:${Math.min(100, (v.real / v.plano) * 100).toFixed(0)}%"></i></span>` : '';
        const dica = `${c.nome} · ${Mes(m)}: ${moeda(mostrado)}${v.tipo === 'previsto' ? (v.fase === 'passado' ? ' (plano sem lançamento; não entra nos totais)' : ' (previsto, não lançado)') : ''}${v.encerrada ? ' (encerrada no mês)' : ''}${v.fase === 'atual' && v.plano ? ` de ${moeda(v.plano)} planejados` : ''}${media && v.fase === 'passado' && v.qtd ? ` · média ${moeda(media)}` : ''}${marca === '▲' ? ' · acima da média' : marca === '▼' ? ' · abaixo da média' : ''}`;
        linha += `<td class="${cls.join(' ')}" data-acao="categoria" data-cat="${esc(c.id)}" data-ano="${ano}" data-mes="${m}" data-r="${r}" data-c="${i}" tabindex="${r === 0 && i === colInicial ? 0 : -1}" title="${esc(dica)}"${estilo ? ` style="${estilo}"` : ''}>${mostrado ? num(mostrado) : '–'}${marca ? `<span class="calor-marca" aria-hidden="true">${marca}</span>` : ''}${mini}</td>`;
      });
      corpo += linha + `<td class="total">${num(total)}</td></tr>`;
      r++;
    }
  }
  // Rodapé com a mesma regra do Início: meses fechados contam só o lançado; o atual e os próximos, o que falta dos planos.
  const res = meses.map((m) => resumo(ano, m));
  const passado = (i) => res[i].fase === 'passado';
  const totG = res.map((rr, i) => (passado(i) ? rr.jaSaiu : rr.saidasPrevistas));
  const totR = res.map((rr, i) => (passado(i) ? rr.recebida : rr.renda));
  const sobra = res.map((rr, i) => (passado(i) ? rr.sobraRealizada : rr.disponivel));
  const rodape = (nome, serie, sinal) => {
    const tot = serie.reduce((a, b) => a + b, 0);
    const cor = (v) => (sinal ? (v < 0 ? ' txt-acima' : ' txt-ok') : '');
    return `<tr><th scope="row">${nome}</th>${serie.map((v, i) => {
      const f = res[i].fase;
      return `<td class="${f !== 'passado' ? 'proj' : ''}${cor(v)}" title="${esc(nome + ' · ' + Mes(i + 1) + (f === 'atual' ? ' (lançado + o que falta dos planos)' : f === 'futuro' ? ' (previsto)' : ' (só o lançado)'))}">${num(v)}</td>`;
    }).join('')}<td class="total${cor(tot)}">${num(tot)}</td></tr>`;
  };
  const cab = meses.map((m) => { const f = fase(ano, m); return `<th scope="col" class="${f === 'atual' ? 'atual' : ''}">${MesC(m)}${f === 'atual' ? '<small>hoje</small>' : ''}</th>`; }).join('');
  const seg = (on, txt) => `<button type="button" data-acao="calor" data-calor="${on ? 1 : 0}" data-foco="calor-${on ? 1 : 0}" aria-pressed="${S.calor === on}">${txt}</button>`;
  if (!cats().length) return vazio('Crie categorias em Ajustes para ver a planilha.', false);
  return `<div class="planilha-ano">${cartaoAno()}</div>`
    + '<div class="planilha-ferramentas">'
    + `<div class="segmentado" role="group" aria-label="Visualização">${seg(false, 'Valores')}${seg(true, 'Mapa de calor')}</div>`
    + '<div class="legenda"><span><i style="background:color-mix(in srgb,var(--calor-acima) 32%,var(--cartao))"></i>acima da média da categoria</span><span><i style="background:color-mix(in srgb,var(--calor-abaixo) 22%,var(--cartao))"></i>abaixo da média</span><span><i style="box-shadow:inset 0 0 0 1px var(--tinta-3)"></i>previsto (plano sem lançamento)</span></div>'
    + `<button type="button" class="botao pequeno" data-acao="exportar-csv" data-foco="exp-csv" style="margin-left:auto">${ic('baixar', 16)}Exportar lançamentos (CSV)</button></div>`
    + `<p class="planilha-dica so-celular" id="planilha-dica">${ic('dir', 16)}Deslize para consultar os meses; as categorias ficam fixas.</p>`
    + `<div class="planilha-caixa" role="region" tabindex="0" aria-label="Planilha anual de ${ano}, rolável na horizontal" aria-describedby="planilha-dica"><table class="planilha"><caption class="sr">Planilha de ${ano}: categorias por mês. Use as setas para navegar e Enter para abrir.</caption>`
    + `<thead><tr><th scope="col" class="cat">Categoria</th>${cab}<th scope="col" class="total">Ano</th></tr></thead><tbody>${corpo}</tbody>`
    + `<tfoot>${rodape('Total de saídas', totG, false)}${rodape('Renda', totR, false)}${rodape('Sobra', sobra, true)}</tfoot></table></div>`
    + '<p class="sub" style="margin-top:10px">Clique numa célula para ver e lançar. Cada célula mostra o lançado; sem lançamento, o plano aparece tracejado. Nos meses fechados, os totais contam só o lançado; no mês atual e nos próximos, contam também o que falta de cada plano.</p>';
}
function posPlanilha() {
  if (!S.rolarPlanilha) return;
  S.rolarPlanilha = false;
  const caixa = $('.planilha-caixa');
  const th = caixa && caixa.querySelector('thead th.atual');

   9. Folhas: painel de baixo no celular, painel lateral no computador
   ===================================================================== */
const pilha = [];
function atualizarVeu() {
  let veu = $('#camada .veu');
  if (pilha.length && !veu) {
    veu = document.createElement('div'); veu.className = 'veu';
    veu.addEventListener('click', () => fecharFolha());
    $('#camada').prepend(veu);
    requestAnimationFrame(() => veu.classList.add('visivel'));
  } else if (!pilha.length && veu) {
    veu.classList.remove('visivel'); setTimeout(() => veu.remove(), 200);
  }
}
function abrirFolha(f) {
  const el = document.createElement('section');
  el.className = 'folha ' + (f.classe || '');
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.tabIndex = -1;
  f.el = el;
  f.origem = document.activeElement;
  pilha.push(f);
  document.documentElement.classList.add('com-folha');
  if ($('#app')) $('#app').inert = true;
  $('#camada').appendChild(el);
  f.montar(el);
  const t = el.querySelector('h2');
  if (t) { t.id = t.id || 'folha-titulo-' + pilha.length; el.setAttribute('aria-labelledby', t.id); }
  atualizarVeu();
  requestAnimationFrame(() => {
    el.classList.add('aberta');
    const alvo = el.querySelector('[data-autofoco]') || el;
    alvo.focus({ preventScroll: true });
  });
  hist.push({ tela: S.tela, n: pilha.length });
}
function fecharFolha(porHistorico = false) {
  const f = pilha.pop();
  if (!f) return;
  f.el.classList.remove('aberta');
  setTimeout(() => f.el.remove(), 260);
  atualizarVeu();
  if (!pilha.length) {
    document.documentElement.classList.remove('com-folha');
    if ($('#app')) $('#app').inert = false;
  }
  if (f.aoFechar) f.aoFechar();
  if (f.origem && document.contains(f.origem) && f.origem.focus) f.origem.focus({ preventScroll: true });
  if (!porHistorico) agendarRender();
}
function topoFolha(titulo, rotulo = '') {
  return `<header class="folha-topo"><div class="titulos">${rotulo ? `<div class="rotulo">${esc(rotulo)}</div>` : ''}<h2>${esc(titulo)}</h2></div>`
    + `<button type="button" class="icone" data-f="fechar" aria-label="Fechar">${ic('fechar')}</button></header>`;
}

/* ---------- Novo lançamento ---------- */
function abrirNovo(opc = {}) {
  if (!S.dados || !cats().length) return;
  const h = hoje();
  const teclado = window.matchMedia('(pointer: coarse)').matches;
  const pre = opc.texto ? interpretarLinha(opc.texto, false) : null;
  const catIni = (opc.cat && catPorId(opc.cat)) || (pre && pre.categoriaId ? catPorId(pre.categoriaId) : null);
  const st = {
    tipo: catIni && catIni.grupo === 'renda' ? 'renda' : 'gasto',
    cents: '', estorno: false, alto: null, texto: opc.texto || '', desc: pre ? pre.descricao : '', descManual: false, cat: catIni ? catIni.id : null,
    data: (S.ano === h.ano && S.mes === h.mes) || opc.hoje ? { modo: 'hoje' } : { modo: 'outra', iso: isoData(opc.ano || S.ano, opc.mes || S.mes, 1), semDia: true },
  };
  const garantirCat = () => {
    const lista = categoriasPorUso(st.tipo === 'renda');
    if (!st.cat || !lista.some((c) => c.id === st.cat)) st.cat = lista.length ? lista[0].id : null;
  };
  garantirCat();
  const valores = () => {
    if (teclado) { const v = Number(st.cents || '0') / 100; return v > 0 ? [st.estorno ? -v : v] : []; }
    const vs = interpretarLinha(st.texto, st.tipo === 'renda').valores;
    return st.estorno ? vs.map((v) => -Math.abs(v)) : vs;
  };
  const dataEscolhida = () => {
    if (st.data.modo === 'hoje') return { ano: h.ano, mes: h.mes, dia: h.dia };
    if (st.data.modo === 'ontem') { const d = new Date(); d.setDate(d.getDate() - 1); return { ano: d.getFullYear(), mes: d.getMonth() + 1, dia: d.getDate() }; }
    const p = String(st.data.iso || '').split('-').map(Number);
    if (!p[0] || !p[1]) return null;
    return { ano: p[0], mes: p[1], dia: st.data.semDia ? null : p[2] || null };
  };
  abrirFolha({
    tipo: 'novo', classe: teclado ? 'folha-novo nv-toque' : 'folha-novo',

      const segmento = '<div class="segmentado" role="group" aria-label="Tipo"><button type="button" data-f="tipo" data-v="gasto">Gasto</button><button type="button" data-f="tipo" data-v="estorno" title="Devolução de um gasto: entra com sinal negativo">Estorno</button><button type="button" data-f="tipo" data-v="renda">Renda</button></div>';
      const categorias = `<fieldset class="nv-cats-area"><legend class="rotulo">Categoria</legend><div class="${teclado ? 'chips-faixa' : 'chips'}" id="nv-cats"></div></fieldset>`;
      const descricao = `<div class="linha-desc"><label class="sr" for="nv-desc">Descrição (opcional)</label><input class="entrada" id="nv-desc" value="${esc(st.desc)}" placeholder="Descrição (opcional)" autocomplete="off" maxlength="300"><div class="sugestoes" id="nv-sug"></div></div>`;
      el.innerHTML = teclado
        // Celular: valor e categorias sempre à vista, teclado e Salvar sempre embaixo.
        // Só a descrição rola; quando falta altura, as teclas encolhem (ver .nv-toque no CSS).
        ? '<header class="folha-topo nv-topo"><div class="sr"><h2>Novo lançamento</h2></div>' + segmento
          + `<button type="button" class="icone" data-f="fechar" aria-label="Fechar">${ic('fechar')}</button></header>`
          + '<div class="nv-fixo"><div class="nv-valor"><span class="rotulo" id="nv-rot">Valor</span><output class="valor-grande" id="nv-valor" aria-labelledby="nv-rot" aria-live="polite">R$ 0,00</output>'
          + '</div><div class="datas" id="nv-datas"></div></div>'
          + categorias
          + `<div class="folha-corpo">${descricao}</div>`
          + '<div class="nv-teclado-area"><div class="teclado" id="nv-teclado"></div></div>'
          + '<footer class="folha-rodape"><button type="button" class="botao primario grande" data-f="salvar" id="nv-salvar">Salvar</button>'
          + '<button type="button" class="botao fantasma" data-f="salvar-outro">Salvar e novo</button></footer>'
        : topoFolha('Novo lançamento')
          + '<div class="nv-fixo">' + segmento
          + `<label class="campo">Valor (aceita “32,90 mercado padaria”, “36*4”, “10 20,50” e “-50” para estorno)<input class="entrada" id="nv-texto" data-autofoco autocomplete="off" value="${esc(st.texto)}" placeholder="0,00"></label><p class="entendi" id="nv-entendi" aria-live="polite"></p>`
          + '</div><div class="folha-corpo">' + categorias + '<div class="datas" id="nv-datas"></div>' + descricao + '</div>'
          + '<footer class="folha-rodape"><button type="button" class="botao primario grande" data-f="salvar" id="nv-salvar">Salvar</button>'
          + '<button type="button" class="botao fantasma" data-f="salvar-outro">Salvar e lançar outro</button></footer>';
      if (teclado) {
        $('#nv-teclado', el).innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0'].map((d) => `<button type="button" data-f="tecla" data-v="${d}" aria-label="${d}">${d}</button>`).join('')
          + `<button type="button" data-f="tecla" data-v="apagar" aria-label="Apagar dígito">${ic('apagarDigito', 24)}</button>`;
      }
      const desenhar = () => {
        const tipoVisto = st.tipo === 'renda' ? 'renda' : st.estorno ? 'estorno' : 'gasto';
        $$('[data-f="tipo"]', el).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === tipoVisto)));
        // Todas as categorias, mais usadas primeiro. A escolhida sempre aparece.
        // Escolher uma categoria de renda também muda o tipo para Renda; escolher
        // uma de gasto volta para Gasto. No computador, as 8 primeiras e "Todas".
        const todas = todasPorUso();
        let lista = teclado || st.todas ? todas : todas.slice(0, 8);
        if (!lista.some((c) => c.id === st.cat)) { const sel = todas.find((c) => c.id === st.cat); if (sel) lista = lista.concat(sel); }
        $('#nv-cats', el).innerHTML = todas.length
          ? lista.map((c) => `<button type="button" class="chip cor-${corCat(c.id)}" data-f="cat" data-v="${esc(c.id)}" aria-pressed="${c.id === st.cat}"><span class="ponto"></span>${esc(c.nome)}</button>`).join('')
            + (!teclado && todas.length > 8 ? `<button type="button" class="chip todas" data-f="todas" aria-expanded="${Boolean(st.todas)}">${st.todas ? 'Menos' : `Todas (${todas.length})`}</button>` : '')
          : '<p class="sub">Nenhuma categoria. Crie em Ajustes.</p>';
        const datas = [['hoje', 'Hoje'], ['ontem', 'Ontem'], ['outra', 'Outra data']];
        $('#nv-datas', el).innerHTML = datas.map(([k, t]) => `<button type="button" class="chip" data-f="data" data-v="${k}" aria-pressed="${st.data.modo === k}">${t}</button>`).join('')
          + (st.data.modo === 'outra'
            ? `<label class="sr" for="nv-dt">Data</label><input type="date" id="nv-dt" value="${esc(st.data.iso || isoData(h.ano, h.mes, h.dia))}"><label class="marcar"><input type="checkbox" id="nv-semdia"${st.data.semDia ? ' checked' : ''}>Sem dia definido</label>` : '');
        const dt = $('#nv-dt', el);
        if (dt) dt.addEventListener('change', () => { st.data.iso = dt.value; atualizarBotao(); });
        const sd = $('#nv-semdia', el);
        if (sd) sd.addEventListener('change', () => { st.data.semDia = sd.checked; });
        desenharSugestoes();
        atualizarValor();
      };
      const desenharSugestoes = () => {
        const sug = st.cat ? sugestoes(st.cat) : [];
        $('#nv-sug', el).innerHTML = sug.map((s) => `<button type="button" data-f="sug" data-v="${esc(s)}">${esc(s)}</button>`).join('');
      };
      const atualizarValor = () => {
        if (teclado) {
          const out = $('#nv-valor', el);
          const v = Number(st.cents || '0') / 100;
          out.textContent = moeda(st.estorno ? -v : v);
          out.classList.toggle('renda', st.tipo === 'renda');
        } else {
          const r = interpretarLinha(st.texto, st.tipo === 'renda');
          const p = $('#nv-entendi', el);
          if (!st.texto.trim()) { p.textContent = 'Dica: Enter salva, Esc fecha.'; p.className = 'entendi'; }
          else if (!r.valores.length) {
            p.textContent = pareceVezes(st.texto) ? 'Para repetir um valor, use *, por exemplo 36*4. Parcelar em meses ainda não existe.'
              : r.invalido ? 'Não entendi o valor. Use, por exemplo, 32,90 ou 1.500.' : 'Comece pelo valor.';
            p.className = 'entendi erro';
          }
          else {
            const total = r.valores.reduce((a, b) => a + b, 0);
            const c = catPorId(st.cat);
            p.textContent = `Entendi: ${r.valores.length > 1 ? r.valores.length + ' lançamentos, total ' : ''}${moeda(total)}${c ? ' em ' + c.nome : ''}${st.desc ? ' · “' + st.desc + '”' : ''}`;
            p.className = 'entendi';
          }
        }
        atualizarBotao();
      };
      const atualizarBotao = () => {
        const vs = valores(); const total = vs.reduce((a, b) => a + b, 0);
        const b = $('#nv-salvar', el);
        if (st.alto !== null && st.alto !== total) st.alto = null;
        const d0 = dataEscolhida();
        if (st.fechado && !(d0 && st.fechado === chaveFechado(d0.ano, d0.mes))) st.fechado = null;
        b.textContent = !vs.length ? 'Digite o valor' : st.fechado ? 'Confirmar em mês fechado' : st.alto !== null ? `Confirmar ${moeda(total)}`
          : vs.length > 1 ? `Salvar ${vs.length} lançamentos · ${moeda(total)}` : 'Salvar ' + moeda(total);
        b.disabled = !vs.length || !st.cat || !dataEscolhida();
      };
      const salvar = (continuar) => {
        const vs = valores(); const d = dataEscolhida();
        if (!vs.length || !st.cat || !d) { atualizarBotao(); return; }
        const soma = vs.reduce((a, b) => a + b, 0);
        const paraFechado = pedirConfirmacaoFechado([{ ano: d.ano, mes: d.mes }], st);
        if (paraFechado) {
          atualizarBotao();
          const pF = $('#nv-entendi', el);
          if (pF) { pF.textContent = paraFechado; pF.className = 'entendi erro'; } else aviso(paraFechado, { tipo: 'erro' });
          return;
        }
        if (foraDoNormal(st.cat, soma) && st.alto !== soma) {
          st.alto = soma; atualizarBotao();
          const c0 = catPorId(st.cat);
          const alerta = `${moeda(soma)} é bem mais do que o habitual em ${c0 ? c0.nome : 'nesta categoria'}. Confira e toque em Confirmar para salvar.`;
          const pEntendi = $('#nv-entendi', el);
          if (pEntendi) { pEntendi.textContent = alerta; pEntendi.className = 'entendi erro'; } else aviso(alerta, { tipo: 'erro' });
          return;
        }
        st.alto = null;
        const eraFechado = mesFechado(d.ano, d.mes);
        st.fechado = null;
        const desc = $('#nv-desc', el).value.trim();
        const ids = vs.map((v) => {
          const id = novoId();
          registrar({ t: 'lanc', l: { id, ano: d.ano, mes: d.mes, dia: d.dia, categoriaId: st.cat, descricao: desc, valor: v } });
          return id;
        });
        if (eraFechado) atualizarFechamento(d.ano, d.mes);
        const c = catPorId(st.cat); const total = vs.reduce((a, b) => a + b, 0);
        aviso(`Lançado em ${c ? c.nome : ''}: ${moeda(total)}${ids.length > 1 ? ` (${ids.length} lançamentos)` : ''}`, {
          acao: 'Desfazer', fn: () => { ids.forEach((id) => registrar({ t: 'lanc-', id })); if (eraFechado) atualizarFechamento(d.ano, d.mes); aviso('Lançamento desfeito.'); },
        });
        if (continuar) {
          st.cents = ''; st.texto = ''; st.desc = ''; st.descManual = false; st.estorno = false; st.alto = null;
          $('#nv-desc', el).value = '';
          const tx = $('#nv-texto', el); if (tx) { tx.value = ''; tx.focus(); }
          atualizarValor();
        } else {
          fecharFolha();
        }
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const f = b.dataset.f;
        if (f === 'fechar') fecharFolha();
        else if (f === 'tipo') { st.estorno = b.dataset.v === 'estorno'; st.tipo = b.dataset.v === 'renda' ? 'renda' : 'gasto'; garantirCat(); desenhar(); }
        else if (f === 'cat') {
          st.cat = b.dataset.v;
          const c = catPorId(st.cat);
          st.tipo = c && c.grupo === 'renda' ? 'renda' : 'gasto';
          if (st.tipo === 'renda') st.estorno = false;
          desenhar();
        }
        else if (f === 'todas') { st.todas = !st.todas; desenhar(); }
        else if (f === 'data') { st.data.modo = b.dataset.v; if (b.dataset.v === 'outra' && !st.data.iso) { st.data.iso = isoData(h.ano, h.mes, h.dia); st.data.semDia = false; } desenhar(); }
        else if (f === 'sug') { $('#nv-desc', el).value = b.dataset.v; st.desc = b.dataset.v; st.descManual = true; atualizarValor(); }
        else if (f === 'tecla') {
          if (b.dataset.v === 'apagar') st.cents = st.cents.slice(0, -1);
          else st.cents = (st.cents + b.dataset.v).replace(/^0+/, '').slice(0, 9);
          atualizarValor();
        } else if (f === 'salvar') salvar(false);
        else if (f === 'salvar-outro') salvar(true);
      });
      const tx = $('#nv-texto', el);
      if (tx) {
        tx.addEventListener('input', () => {
          st.texto = tx.value;
          const r = interpretarLinha(st.texto, st.tipo === 'renda');
          if (r.categoriaId && r.categoriaId !== st.cat) {
            st.cat = r.categoriaId;
            const c = catPorId(st.cat);
            st.tipo = c && c.grupo === 'renda' ? 'renda' : 'gasto';
            desenhar();
          }
          if (!st.descManual) { st.desc = r.descricao; $('#nv-desc', el).value = r.descricao; }
          atualizarValor();
        });
      }
      const ds = $('#nv-desc', el);
      ds.addEventListener('input', () => { st.desc = ds.value; st.descManual = true; atualizarValor(); });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); salvar(e.shiftKey); return; }
        if (teclado && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
          if (/^\d$/.test(e.key)) { st.cents = (st.cents + e.key).replace(/^0+/, '').slice(0, 9); atualizarValor(); e.preventDefault(); }
          else if (e.key === 'Backspace') { st.cents = st.cents.slice(0, -1); atualizarValor(); e.preventDefault(); }
        }
      });
      desenhar();
    },
  });
}

/* ---------- Editar lançamento ---------- */
function abrirEditar(id) {
  const achado = acharLanc(id);
  if (!achado) { aviso('Esse lançamento não existe mais.'); return; }
  const { l, ano } = achado;
  const original = { ...l, ano };
  abrirFolha({
    tipo: 'editar',
    montar(el) {
      const c = catPorId(l.categoriaId);
      const opcoes = ORDEM_GRUPOS.map((g) => {
        const lista = catsDoGrupo(g);
        return lista.length ? `<optgroup label="${GRUPOS[g]}">${lista.map((x) => `<option value="${esc(x.id)}"${x.id === l.categoriaId ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</optgroup>` : '';
      }).join('');
      el.innerHTML = topoFolha('Editar lançamento', c ? c.nome : '')
        + '<div class="folha-corpo">'
        + `<label class="campo">Valor<input class="entrada valor" id="ed-valor" inputmode="decimal" autocomplete="off" value="${num(l.valor)}" data-autofoco></label>`
        + `<label class="campo">Categoria<select class="entrada" id="ed-cat">${opcoes}</select></label>`
        + `<div class="campo"><label for="ed-data">Data</label><div class="datas"><input type="date" id="ed-data" value="${isoData(ano, l.mes, l.dia || 1)}"><label class="marcar"><input type="checkbox" id="ed-semdia"${l.dia ? '' : ' checked'}>Sem dia definido</label></div></div>`
        + `<label class="campo">Descrição<input class="entrada" id="ed-desc" value="${esc(l.descricao)}" maxlength="300" autocomplete="off"></label>`
        + '<p class="entendi" id="ed-erro" aria-live="polite"></p></div>'
        + '<footer class="folha-rodape linha"><button type="button" class="botao perigo" data-f="apagar">' + ic('lixeira', 18) + 'Apagar</button><button type="button" class="botao primario" data-f="salvar" style="flex:1;margin-left:8px">Salvar</button></footer>';
      let confirmadoAlto = null;
      const estadoFechado = { fechado: null };
      const salvar = () => {
        const v = paraNumero($('#ed-valor', el).value);
        const erro = $('#ed-erro', el);
        if (v === null || v === 0) { erro.textContent = 'Valor inválido. Para tirar o lançamento, use Apagar.'; erro.className = 'entendi erro'; return; }
        const catNova = $('#ed-cat', el).value;
        if (v !== original.valor && foraDoNormal(catNova, v) && confirmadoAlto !== v) {
          confirmadoAlto = v;
          erro.textContent = `${moeda(v)} é bem mais do que o habitual nesta categoria. Confira e toque em Salvar de novo.`; erro.className = 'entendi erro'; return;
        }
        const p = $('#ed-data', el).value.split('-').map(Number);
        if (!p[0] || !p[1]) { erro.textContent = 'Escolha uma data.'; erro.className = 'entendi erro'; return; }
        const novo = { id: l.id, ano: p[0], mes: p[1], dia: $('#ed-semdia', el).checked ? null : p[2], categoriaId: $('#ed-cat', el).value, descricao: $('#ed-desc', el).value.trim(), valor: v };
        const mudou = ['ano', 'mes', 'dia', 'categoriaId', 'descricao', 'valor'].some((k) => novo[k] !== original[k]);
        if (mudou) {
          const paraFechado = pedirConfirmacaoFechado([{ ano: original.ano, mes: original.mes }, { ano: novo.ano, mes: novo.mes }], estadoFechado);
          if (paraFechado) { erro.textContent = paraFechado; erro.className = 'entendi erro'; return; }
          registrar({ t: 'lanc', l: novo });
          const reajustar = () => { atualizarFechamento(original.ano, original.mes); if (novo.ano !== original.ano || novo.mes !== original.mes) atualizarFechamento(novo.ano, novo.mes); };
          reajustar();
          aviso('Lançamento alterado.', { acao: 'Desfazer', fn: () => { registrar({ t: 'lanc', l: original }); reajustar(); } });
        }
        fecharFolha();
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        if (b.dataset.f === 'fechar') fecharFolha();
        else if (b.dataset.f === 'salvar') salvar();
        else if (b.dataset.f === 'apagar') {
          const paraFechado = pedirConfirmacaoFechado([{ ano: original.ano, mes: original.mes }], estadoFechado);
          if (paraFechado) { const er = $('#ed-erro', el); er.textContent = paraFechado; er.className = 'entendi erro'; return; }
          registrar({ t: 'lanc-', id: l.id });
          atualizarFechamento(original.ano, original.mes);
          fecharFolha();
          aviso('Lançamento apagado.', { acao: 'Desfazer', fn: () => { registrar({ t: 'lanc', l: original }); atualizarFechamento(original.ano, original.mes); } });
        }
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'date') { e.preventDefault(); salvar(); }
      });
    },
  });
}

/* ---------- Categoria num mês (o antigo "clicar na célula") ---------- */
function abrirCategoria(cid, ano, mes) {
  const c = catPorId(cid);
  if (!c) return;
  abrirFolha({
    tipo: 'categoria',
    montar(el) {
      el.innerHTML = topoFolha(c.nome, `${GRUPOS[c.grupo]} · ${Mes(mes)} de ${ano}`)
        + '<div class="folha-corpo"><div id="fc-resumo"></div><div class="lista fc-lista" id="fc-lista"></div>'
        + '<div><div class="rotulo" style="margin-bottom:6px">Lançar aqui</div><div class="fc-novo">'
        + '<label class="sr" for="fc-valor">Valor</label><input class="entrada valor" id="fc-valor" inputmode="decimal" placeholder="Valor" autocomplete="off" data-autofoco>'
        + '<label class="sr" for="fc-desc">Descrição</label><input class="entrada" id="fc-desc" placeholder="Descrição" autocomplete="off" maxlength="300">'
        + '<label class="sr" for="fc-dia">Dia</label><input class="entrada" id="fc-dia" inputmode="numeric" placeholder="dia" autocomplete="off" maxlength="2">'
        + `<button type="button" class="botao" data-f="adicionar">${ic('mais', 18)}Adicionar</button></div>`
        + '<p class="entendi" id="fc-msg" aria-live="polite">Aceita vários valores: “217,93 176,15” ou “36*4”.</p></div>'
        + `<div class="fc-plano"><label class="campo">Plano de ${MESES[mes - 1]}<input class="entrada valor" id="fc-plano" inputmode="decimal" autocomplete="off"></label>`
        + `<button type="button" class="botao" data-f="repetir">Repetir até dezembro</button></div><p class="sub" id="fc-plano-dica"></p></div>`
        + '<footer class="folha-rodape linha"><span class="rotulo">Total do mês</span><span class="total-rodape" id="fc-total"></span></footer>';
      const atualizar = () => {
        if (!catPorId(cid)) { fecharFolha(); return; }
        const v = celula(cid, ano, mes);
        const est = estadoCategoria(c, v, resumo(ano, mes).ritmo);
        const pct = v.plano > 0 ? (v.real / v.plano) * 100 : v.real > 0 ? 100 : 0;
        const falta = v.qtd ? v.falta : v.plano;
        const podeConfirmar = v.fase !== 'futuro' && v.plano > 0 && falta > 0 && !v.encerrada && (v.tipo === 'previsto' || c.grupo !== 'variavel');
        const rotEncerrar = c.grupo === 'renda' ? `Não vem mais (tira ${moeda(v.falta)})`
          : c.grupo === 'fixo' ? `Quitar (libera ${moeda(v.falta)})` : `Encerrar no mês (libera ${moeda(v.falta)})`;
        const podeEncerrar = v.fase !== 'futuro' && v.plano > 0 && !ehGuardar(c) && (v.encerrada || (v.falta > 0 && (c.grupo !== 'fixo' || v.real > 0)));
        const botoes = (podeConfirmar ? `<button type="button" class="botao" data-f="confirmar">${ic('check', 18)}Confirmar ${moeda(falta)} como lançado</button>` : '')
          + (podeEncerrar ? `<button type="button" class="botao fantasma" data-f="${v.encerrada ? 'reabrir' : 'encerrar'}">${v.encerrada ? 'Reabrir no mês' : rotEncerrar}</button>` : '');
        const conf = botoes ? `<div class="acoes">${botoes}</div>` : '';
        $('#fc-resumo', el).innerHTML = `<div class="legenda-barra" style="margin-top:0"><span><strong style="font-size:16px;color:var(--tinta)">${moeda(v.real)}</strong> lançados</span><span>${v.plano ? 'plano ' + moeda(v.plano) : 'sem plano'}</span></div>`
          + barra({ pct, ritmo: v.fase === 'atual' && c.grupo === 'variavel' && v.plano ? resumo(ano, mes).ritmo : null, estado: est === 'acima' ? 'acima' : est === 'atencao' ? 'atencao' : 'ok', alta: true })
          + `<p class="lc-nota ${est === 'acima' ? 'txt-acima' : ''}" style="margin-top:6px">${esc(notaCategoria(c, v, est))}</p>${conf}`;
        const itens = celReal(cid, ano, mes).itens.slice().sort((a, b) => (a.dia ?? 99) - (b.dia ?? 99));
        const mapa = mapaCats();
        $('#fc-lista', el).innerHTML = itens.length ? itens.map((l) => linhaLanc(l, ano, mapa)).join('') : '<p class="sub" style="padding:14px">Nada lançado ainda.</p>';
        $('#fc-total', el).textContent = moeda(v.real);
        const inp = $('#fc-plano', el);
        if (document.activeElement !== inp) inp.value = planoExp(cid, ano, mes) ? num(planoExp(cid, ano, mes)) : '';
        const med = media3(cid, ano, mes);
        inp.placeholder = '0,00';
        $('#fc-plano-dica', el).innerHTML = (med ? `Sugestão: a média dos 3 meses anteriores é ${moeda(med)}. <button type="button" class="link" data-f="sugestao">Usar sugestão</button> ` : '') + 'Campo vazio significa sem valor previsto nas contas. A sugestão não entra nas contas até você usá-la.'
          + (v.plano > 0 ? ' <button type="button" class="link" data-f="apagar-plano">Apagar plano</button>' : '');
      };
      let confirmadoAlto = null;
      let confirmaRepetir = null;
      const estadoFechado = { fechado: null };
      const adicionar = () => {
        const msg = $('#fc-msg', el);
        const txtValor = $('#fc-valor', el).value;
        const vs = paraNumeros(txtValor);
        if (!vs || !vs.length) {
          msg.textContent = pareceVezes(txtValor) ? 'Para repetir um valor, use *, por exemplo 36*4.' : 'Digite um valor válido, como 32,90 ou 1.500.';
          msg.className = 'entendi erro'; $('#fc-valor', el).focus(); return;
        }
        const soma = vs.reduce((a, b) => a + b, 0);
        if (foraDoNormal(cid, soma) && confirmadoAlto !== soma) {
          confirmadoAlto = soma;
          msg.textContent = `${moeda(soma)} é bem mais do que o habitual em ${c.nome}. Confira e toque em Adicionar de novo para lançar.`;
          msg.className = 'entendi erro'; return;
        }
        const paraFechado = pedirConfirmacaoFechado([{ ano, mes }], estadoFechado);
        if (paraFechado) { msg.textContent = paraFechado; msg.className = 'entendi erro'; return; }
        confirmadoAlto = null;
        const diaTxt = $('#fc-dia', el).value.trim();
        const dia = diaTxt ? Number(diaTxt) : (fase(ano, mes) === 'atual' ? hoje().dia : null);
        if (diaTxt && (!Number.isInteger(dia) || dia < 1 || dia > diasNoMes(ano, mes))) { msg.textContent = 'Dia inválido para este mês.'; msg.className = 'entendi erro'; return; }
        const desc = $('#fc-desc', el).value.trim();
        const ids = vs.map((v) => { const id = novoId(); registrar({ t: 'lanc', l: { id, ano, mes, dia, categoriaId: cid, descricao: desc, valor: v } }); return id; });
        estadoFechado.fechado = null;
        atualizarFechamento(ano, mes);
        $('#fc-valor', el).value = ''; $('#fc-desc', el).value = '';
        msg.textContent = `${ids.length > 1 ? ids.length + ' lançamentos adicionados' : 'Adicionado'}: ${moeda(vs.reduce((a, b) => a + b, 0))}.`; msg.className = 'entendi';
        aviso(`Lançado em ${c.nome}: ${moeda(vs.reduce((a, b) => a + b, 0))}`, { acao: 'Desfazer', fn: () => { ids.forEach((id) => registrar({ t: 'lanc-', id })); atualizarFechamento(ano, mes); } });
        $('#fc-valor', el).focus();
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const f = b.dataset.f;
        if (f === 'fechar') fecharFolha();
        else if (f === 'adicionar') adicionar();
        else if (f === 'confirmar') confirmarPrevisto(cid, ano, mes);
        else if (f === 'encerrar' || f === 'reabrir') { encerrarCategoria(cid, ano, mes, f === 'encerrar'); atualizar(); }
        else if (f === 'sugestao') {
          const med = media3(cid, ano, mes);
          if (!med) return;
          const antes = planoExp(cid, ano, mes);
          registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: med });
          aviso(`Plano de ${c.nome}: ${moeda(med)}.`, { acao: 'Desfazer', fn: () => registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: antes || null }) });
          atualizar();
        }
        else if (f === 'apagar-plano') {
          const antes = planoExp(cid, ano, mes);
          if (!antes) return;
          registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: null });
          aviso('Plano removido. Isso não cancela a despesa; ela só deixa de ser reservada no disponível.', { acao: 'Desfazer', fn: () => registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: antes }) });
          atualizar();
        }
        else if (f === 'repetir') {
          const v = paraNumero($('#fc-plano', el).value);
          if (!v || v < 0) { aviso('Digite o valor do plano antes de repetir.'); return; }
          const antes = [];
          for (let m = mes; m <= 12; m++) antes.push({ m, v: planoExp(cid, ano, m) });
          const trocados = antes.filter((x) => x.v && Math.abs(x.v - v) > 0.004);
          if (trocados.length && confirmaRepetir !== v) {
            confirmaRepetir = v;
            b.textContent = `Substituir ${trocados.length} plano${trocados.length > 1 ? 's' : ''}? Toque de novo`;
            $('#fc-plano-dica', el).textContent = `Já há plano diferente em ${trocados.map((x) => MESES_C[x.m - 1]).join(', ')}. Toque de novo para substituir.`;
            return;
          }
          confirmaRepetir = null; b.textContent = 'Repetir até dezembro';
          antes.forEach((x) => registrar({ t: 'orc', ano, categoriaId: cid, mes: x.m, valor: v }));
          aviso(`Plano de ${moeda(v)} aplicado de ${MESES[mes - 1]} a dezembro${trocados.length ? ` (${trocados.length} substituído${trocados.length > 1 ? 's' : ''})` : ''}.`, {
            acao: 'Desfazer', fn: () => antes.forEach((x) => registrar({ t: 'orc', ano, categoriaId: cid, mes: x.m, valor: x.v || null })),
          });
        }
      });
      $('#fc-plano', el).addEventListener('change', (e) => {
        const txt = e.target.value.trim();
        const v = txt ? paraNumero(txt) : null;
        if (txt && (v === null || v < 0)) { aviso('Valor de plano inválido.', { tipo: 'erro' }); return; }
        const antes = planoExp(cid, ano, mes);
        registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: v || null });
        if (!v && antes > 0) {
          aviso('Plano removido. Isso não cancela a despesa; ela só deixa de ser reservada no disponível.', {
            acao: 'Desfazer',
            fn: () => registrar({ t: 'orc', ano, categoriaId: cid, mes, valor: antes }),
          });
        }
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && ['fc-valor', 'fc-desc', 'fc-dia'].includes(e.target.id)) { e.preventDefault(); adicionar(); }
      });
      this.atualizar = atualizar;
      atualizar();
    },
  });
}
function confirmarPrevisto(cid, ano, mes) {
  const v = celula(cid, ano, mes);
  const c = catPorId(cid);
  if (!c || !v.plano) return;
  const valor = v.qtd ? v.falta : v.plano;
  if (!(valor > 0)) return;
  const id = novoId();
  registrar({ t: 'lanc', l: { id, ano, mes, dia: fase(ano, mes) === 'atual' ? hoje().dia : null, categoriaId: cid, descricao: '', valor } });
  aviso(ehGuardar(c) ? `${moeda(valor)} guardado.` : `${c.nome}: ${moeda(valor)} lançado.`, { acao: 'Desfazer', fn: () => registrar({ t: 'lanc-', id }) });
}
/** Fechamento do mês: resolve cada plano sem lançamento e grava a sobra realizada. */
function abrirFechamento(ano, mes) {
  const nm = MESES[mes - 1];
  const adiadas = new Set();
  abrirFolha({
    tipo: 'fechamento',
    montar(el) {
      el.innerHTML = topoFolha(`Fechar ${nm} de ${ano}`, 'Fechamento do mês')
        + '<div class="folha-corpo"><p class="sub">Cada pendência é um plano que não foi lançado nem encerrado. Diga o que aconteceu com ele.</p>'
        + '<div class="fech-lista" id="fech-lista"></div></div>'
        + '<footer class="folha-rodape linha"><span class="fech-sobra" id="fech-sobra"></span>'
        + `<button type="button" class="botao primario" data-f="fechar-mes" id="fech-ok">Fechar ${esc(nm)}</button></footer>`;
      const atualizar = () => {
        const r = resumo(ano, mes);
        const itens = r.pendencias.itens;
        const visiveis = itens.filter((it) => !adiadas.has(it.c.id));
        const qAdiadas = itens.length - visiveis.length;
        const aviso0 = qAdiadas ? `<p class="sub">${qAdiadas === 1 ? 'Uma pendência ficou para depois' : qAdiadas + ' pendências ficaram para depois'}. <button type="button" class="link" data-f="mostrar">Mostrar de novo</button></p>` : '';
        $('#fech-lista', el).innerHTML = (visiveis.length ? visiveis.map((it) => {
          const dados = `data-cat="${esc(it.c.id)}"`;
          return `<div class="fech-item">${mono(it.c, true)}<div class="fech-txt"><strong>${esc(it.c.nome)}</strong><span>${it.renda ? 'a receber' : 'previsto'} ${esc(moeda(it.valor))}</span></div>`
            + `<div class="fech-botoes"><button type="button" class="botao pequeno" data-f="feito" ${dados}>${it.renda ? 'Foi recebido' : 'Foi pago'}</button>`
            + `<button type="button" class="botao pequeno fantasma" data-f="nao" ${dados}>Não aconteceu</button>`
            + `<button type="button" class="botao pequeno fantasma" data-f="depois" ${dados}>Depois</button></div></div>`;
        }).join('') : itens.length ? '' : '<p class="sub">Nenhuma pendência. Dá para fechar o mês.</p>') + aviso0;
        $('#fech-sobra', el).textContent = `Sobra realizada: ${moeda(r.sobraRealizada)}`;
        $('#fech-ok', el).disabled = itens.length > 0;
      };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const f = b.dataset.f; const cid = b.dataset.cat;
        if (f === 'fechar') fecharFolha();
        else if (f === 'feito') {
          const it = resumo(ano, mes).pendencias.itens.find((x) => x.c.id === cid);
          if (!it) return;
          const id = novoId();
          registrar({ t: 'lanc', l: { id, ano, mes, dia: null, categoriaId: cid, descricao: '', valor: it.valor } });
          aviso(`${it.c.nome}: ${moeda(it.valor)} lançado em ${nm}.`, { acao: 'Desfazer', fn: () => { registrar({ t: 'lanc-', id }); if (el.isConnected) atualizar(); } });
          atualizar();
        } else if (f === 'nao') { encerrarCategoria(cid, ano, mes, true); atualizar(); }
        else if (f === 'depois') { adiadas.add(cid); atualizar(); }
        else if (f === 'mostrar') { adiadas.clear(); atualizar(); }
        else if (f === 'fechar-mes') {
          if (resumo(ano, mes).pendencias.qtd) return;
          const k = 'fechado:' + chaveFechado(ano, mes);
          const antes = fechamentoDe(ano, mes);
          const sobra = resumo(ano, mes).sobraRealizada;
          registrar({ t: 'cfg', k, v: sobra.toFixed(2) });
          fecharFolha();
          aviso(`${Mes(mes)} fechado: sobra realizada ${moeda(sobra)}.`, { acao: 'Desfazer', fn: () => registrar({ t: 'cfg', k, v: antes === null ? '' : antes.toFixed(2) }) });
        }
      });
      atualizar();
    },
  });
}
/** Encerra (ou reabre) uma categoria no mês: o que falta do plano deixa de ser reservado. O plano fica gravado. */
function encerrarCategoria(cid, ano, mes, fechar = true) {
  const c = catPorId(cid);
  if (!c) return;
  const v = celula(cid, ano, mes);
  const k = chaveEncerrada(ano, mes, cid);
  registrar({ t: 'cfg', k, v: fechar ? '1' : '' });
  const nomeMes = MESES[mes - 1];
  const msg = !fechar ? `${c.nome}: o plano de ${nomeMes} volta a reservar o que falta.`
    : c.grupo === 'renda' ? `${c.nome}: ${moeda(v.falta)} a receber saíram das contas de ${nomeMes}.`
      : `${c.nome}: ${moeda(v.falta)} deixaram de ser reservados em ${nomeMes}.`;
  aviso(msg, { acao: 'Desfazer', fn: () => registrar({ t: 'cfg', k, v: fechar ? '' : '1' }) });
}

function abrirDetalheReserva() {

      const aReceber = daCat((c, v) => c.grupo === 'renda' && v.falta > 0).sort(ordem);
      const contas = daCat((c, v) => c.grupo === 'fixo' && !ehGuardar(c) && v.falta > 0).sort(ordem);
      const guardar = daCat((c, v) => ehGuardar(c) && v.falta > 0);

        .sort((a, b) => (b.v.real - b.v.plano) - (a.v.real - a.v.plano));
      const encerradas = daCat((c, v) => v.encerrada);

      const linha = (c, detalhe, valor, classe = '') => `<div class="reserva-linha">${mono(c)}<div class="reserva-txt"><strong>${esc(c.nome)}</strong><span>${esc(detalhe)}</span></div><strong class="reserva-valor${classe ? ' ' + classe : ''}">${valor}</strong></div>`;

        r.nosPlanos > 0 ? `<div><span>− Ainda nos planos</span><strong>${moeda(r.nosPlanos)}</strong></div>` : '',
        `<div class="total"><span>= Disponível</span><strong>${moeda(r.disponivel)}</strong></div>`,
      ].join('');
      const bloco = (titulo, total, texto, itens, fmt) => !itens.length ? ''
        : `<section><h3 class="grupo-titulo"><span>${titulo}</span><span>${moeda(total)}</span></h3><p class="sub">${texto}</p><div class="lista">${itens.map(fmt).join('')}</div></section>`;
      el.innerHTML = topoFolha('Como o disponível é calculado', `${Mes(mes)} de ${ano}`)
        + '<div class="folha-corpo">'
        + '<p class="sub">O disponível é a renda do mês menos o que já saiu e menos o que ainda está reservado: as contas a pagar, o que falta guardar e o que ainda resta nos planos. Gastar dentro de um plano não muda o disponível; gastar fora dele, ou além dele, reduz na mesma medida. Não é o saldo do banco.</p>'
        + `<div class="conta-heroi" style="margin-top:0">${linhas}</div>`
        + bloco('A receber', r.aReceber, 'Rendas previstas que ainda não entraram por completo. Se alguma não vier, toque nela e use "Não vem mais".', aReceber,
          ({ c, v }) => linha(c, `previsto ${moeda(v.plano)} · recebido ${moeda(v.real)}`, moeda(v.falta)))
        + bloco('Contas a pagar', r.contasAPagar, 'O que falta das contas fixas do mês. Se uma conta veio mais barata, toque nela e use "Quitar".', contas,
          ({ c, v }) => linha(c, v.real ? `plano ${moeda(v.plano)} · pago ${moeda(v.real)}` : `plano ${moeda(v.plano)}`, moeda(v.falta)))
        + bloco('Falta guardar', r.faltaGuardar, 'O que falta para a meta de economia do mês.', guardar,
          ({ c, v }) => linha(c, `meta ${moeda(v.plano)} · guardado ${moeda(v.real)}`, moeda(v.falta)))
        + bloco('Ainda nos planos', r.nosPlanos, 'O que resta dos planos das categorias variáveis. Se você não vai gastar mais numa delas neste mês, toque nela e use "Encerrar no mês".', planos,
          ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · gasto ${moeda(v.real)}`, moeda(v.falta)))
        + bloco('Acima do plano', totalAcima, 'Categorias em que você gastou mais do que o plano. O excesso já está em "já saiu".', acima,
          ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · gasto ${moeda(v.real)}`, moeda(v.real - v.plano), 'acima'))
        + bloco('Encerradas no mês', 0, 'O que faltava delas deixou de ser reservado. O plano continua gravado.', encerradas,
          ({ c, v }) => linha(c, `plano ${moeda(v.plano)} · lançado ${moeda(v.real)}`, 'encerrada'))
        + '<div class="acoes"><button type="button" class="botao" data-f="ajustar">Ajustar planos</button></div>'
        + '</div>';
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        if (b.dataset.f === 'fechar') fecharFolha();
        else if (b.dataset.f === 'ajustar') {
          fecharFolha();
          S.modoMes = 'planejar';
          if (S.tela !== 'mes') irPara('mes'); else render();
        }

    },
  });
}

/* ---------- Importar backup ---------- */
/** O que a importação vai aceitar e ignorar, pelas mesmas regras do servidor, para mostrar antes de importar. */
function previaImportacao(d, modo) {
  const RE = /^[A-Za-z0-9][A-Za-z0-9_-]{0,59}$/;
  const motivos = [];
  const anotar = (t) => { if (motivos.length < 5) motivos.push(t); };
  const ids = new Set(modo === 'mesclar' && S.dados ? S.dados.categorias.map((c) => c.id) : []);
  let catOk = 0; let catNao = 0;
  for (const c of d.categorias) {
    const nome = String((c && c.nome) ?? '').trim();
    if (c && RE.test(String(c.id)) && nome && ORDEM_GRUPOS.includes(String(c.grupo))) { catOk++; ids.add(String(c.id)); }
    else { catNao++; anotar(`categoria ${String((c && (c.nome || c.id)) ?? '?')}: sem nome, identificador ou grupo válido`); }
  }
  let lOk = 0; let lNao = 0;
  for (const [a, b] of Object.entries(d.anos || {})) {
    for (const l of (b && b.lancamentos) || []) {
      const ano = Number(a); const mes = Number(l && l.mes);
      const dia = !l || l.dia === null || l.dia === undefined || l.dia === '' ? null : Number(l.dia);
      const v = Number(l && l.valor);
      const motivo = !(Number.isInteger(ano) && ano >= 1900 && ano <= 2200) ? 'ano inválido'
        : !(Number.isInteger(mes) && mes >= 1 && mes <= 12) ? 'mês inválido'
          : dia !== null && !(Number.isInteger(dia) && dia >= 1 && dia <= diasNoMes(ano, mes)) ? `dia inválido para o mês: ${dia}`
            : !ids.has(String(l && l.categoriaId)) ? `categoria inexistente: ${l && l.categoriaId}`
              : !Number.isFinite(v) || v === 0 || Math.abs(v) >= 1e9 ? 'valor inválido' : '';
      if (motivo) { lNao++; anotar(`lançamento ${(l && l.id) || ''} (${a}): ${motivo}`); } else lOk++;
    }
  }
  return { catOk, catNao, lOk, lNao, motivos };
}
function abrirImportar() {
  abrirFolha({

    montar(el) {

            + '<p class="sub" id="im-aceitos" aria-live="polite" style="margin-top:10px"></p>'

            + '<label class="opcao"><input type="radio" name="im-modo" value="substituir"><span><strong>Substituir tudo</strong>Apaga o que está na planilha e coloca o conteúdo do arquivo. O Google guarda versões antigas em Arquivo › Histórico de versões.</span></label></div>'
            + '<div id="im-substituir" hidden style="margin-top:12px">'
            + `<div class="acoes"><button type="button" class="botao" data-f="backup">${ic('baixar', 18)}Baixar backup agora</button></div>`
            + '<label class="campo" style="margin-top:10px">Para substituir tudo, digite SUBSTITUIR<input class="entrada" id="im-confirma" autocomplete="off" spellcheck="false"></label></div>';
          $$('input[name="im-modo"]', el).forEach((r) => r.addEventListener('change', atualizarPrevia));
          $('#im-confirma', el).addEventListener('input', atualizarPrevia);
          atualizarPrevia();
        } catch (err) {

        if (b.dataset.f === 'backup') { if (S.dados) exportarJSON(); return; }

/* =====================================================================
   Atualização a partir do GitHub (etapa 1: aviso + passos guiados)
   A verificação roda só no navegador (fetch). Nada é enviado: são leituras
   de arquivos públicos. Qualquer falha vira o estado "erro", sem exceção.

const REPO = 'bsdesenv/bsdesenv-financas';
const URL_CHANGELOG = URL_PROJETO + '/blob/main/CHANGELOG.md';
/* Instalador da bsdesenv (pasta instalador/ do repositório): atualiza este projeto com um
   clique. O link leva só os IDs do projeto e da implantação; nenhum dado da planilha. */
const URL_INSTALADOR = 'https:\/\/script.google.com/macros/s/AKfycbwjAGEw8zZ_ju1NImYSjU539npZRQPM48cl-tgJLugXVe0gxE0lkx_gKmEi3DIL6wFzZA/exec';
const ID_GOOGLE = /^[A-Za-z0-9_-]{20,120}$/;
function urlInstalador() {
  const d = S.dados || {};
  if (!ID_GOOGLE.test(d.scriptId || '')) return '';
  const impl = (/\/macros\/(?:u\/\d+\/)?s\/([A-Za-z0-9_-]{20,120})\/exec/.exec(d.urlApp || '') || [])[1];
  return `${URL_INSTALADOR}?script=${encodeURIComponent(d.scriptId)}${impl ? '&implantacao=' + encodeURIComponent(impl) : ''}`;
}
const urlRaw = (ref, caminho) => `https:\/\/raw.githubusercontent.com/${REPO}/${ref}/${caminho}`;
const urlJsDelivr = (ref, caminho) => `https:\/\/cdn.jsdelivr.net/gh/${REPO}@${ref}/${caminho}`;
const TEMPO_BUSCA = 8000;
const VALIDADE_OK = 24 * 3600 * 1000;
const VALIDADE_ERRO = 10 * 60 * 1000;
const VERSAO_OK = /^\d+\.\d+\.\d+$/;
const REF_OK = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
const CAMINHO_OK = /^src\/[A-Za-z0-9][A-Za-z0-9._-]{0,60}$/;

function compararVersoes(a, b) {
  const pa = String(a).split('.').map(Number); const pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) {
    const x = pa[i] || 0; const y = pb[i] || 0;

}
const atualizacaoAuto = () => LS.ler('atualizacao-auto') !== false;
const atualizacaoNova = () => (S.atualizacao && S.atualizacao.estado === 'nova' ? S.atualizacao : null);
const refValida = (r) => typeof r === 'string' && REF_OK.test(r) && !r.includes('..');

async function buscarUrl(url) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), TEMPO_BUSCA);
  try {
    const r = await fetch(url, { cache: 'no-store', signal: c.signal });
    if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return await r.arrayBuffer();

/** Tenta o raw.githubusercontent.com e, se falhar, o jsDelivr. Devolve os bytes. */
async function buscarArquivo(ref, caminho) {
  if (!refValida(ref)) throw new Error('referência inválida');
  let primeiro = null;
  for (const url of [urlRaw, urlJsDelivr]) {
    try { return await buscarUrl(url(ref, caminho)); } catch (e) { primeiro = primeiro || e; }
  }
  throw primeiro;
}
async function sha256Hex(bytes) {

/** Valida o versao.json e devolve só o que o app usa (ou lança erro). */
function lerManifesto(bytes) {
  const m = JSON.parse(new TextDecoder().decode(bytes));
  if (!m || m.app !== 'bsdesenv-financas' || !VERSAO_OK.test(String(m.versao)) || !refValida(m.ref)) throw new Error('versao.json inválido');
  const texto = (v, n) => String(v ?? '').slice(0, n);
  const arquivos = (Array.isArray(m.arquivos) ? m.arquivos : []).map((a) => ({
    nome: texto(a && a.nome, 60), editor: texto(a && a.editor, 60), caminho: texto(a && a.caminho, 80), sha256: texto(a && a.sha256, 64),
  }));
  if (arquivos.some((a) => !a.editor || !CAMINHO_OK.test(a.caminho) || a.caminho.includes('..') || !/^[0-9a-f]{64}$/.test(a.sha256))) throw new Error('lista de arquivos inválida');

    versao: m.versao, ref: m.ref, data: /^\d{4}-\d{2}-\d{2}$/.test(String(m.data)) ? m.data : '',
    novidades: (Array.isArray(m.novidades) ? m.novidades : []).filter((n) => typeof n === 'string' && n.trim()).slice(0, 5).map((n) => n.slice(0, 140)),

}
function resultadoGuardado() {

const estadoDaVersao = (versao) => (compararVersoes(versao, S.dados.versaoApp || '0.0.0') > 0 ? 'nova' : 'atual');

async function verificarAtualizacao({ forcar = false } = {}) {
  if ((!forcar && !atualizacaoAuto()) || !S.dados) return;
  if (S.verificandoAtu) return S.verificandoAtu;
  if (!forcar) {
    const a = S.atualizacao;
    if (a && Date.now() - a.verificadoEm < (a.estado === 'erro' ? VALIDADE_ERRO : VALIDADE_OK)) return;
    const g = a ? null : resultadoGuardado();
    if (g) { S.atualizacao = { ...g, estado: estadoDaVersao(g.versao) }; pintarAtualizacao(Boolean(atualizacaoNova())); return; }
  }
  const eraNova = Boolean(atualizacaoNova());

  S.verificandoAtu = (async () => {

function copiarTexto(texto) {

/* ---------- Avisos rápidos (com Desfazer) ---------- */
/* Pilha de Desfazer da sessão: um aviso novo não apaga o Desfazer do anterior; Ctrl+Z desfaz o mais recente. */
const desfazeres = [];
function aviso(msg, { acao, fn, tipo = 'info', tempo } = {}) {
  const box = $('#avisos');
  const el = document.createElement('div');
  el.className = 'aviso ' + tipo;
  el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
  el.innerHTML = `<span class="aviso-txt">${esc(msg)}</span>${acao ? `<button type="button" class="aviso-acao">${esc(acao)}</button>` : ''}`
    + `<button type="button" class="aviso-fechar" aria-label="Fechar aviso">${ic('fechar', 16)}</button>`;
  const duracao = tempo || (acao ? 10000 : 6500);
  let fechado = false; let timer = 0;
  const fechar = () => { if (fechado) return; fechado = true; clearTimeout(timer); el.classList.add('saindo'); setTimeout(() => el.remove(), 200); };
  const armar = () => { clearTimeout(timer); timer = setTimeout(fechar, duracao); };
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('mouseleave', armar);
  el.addEventListener('focusin', () => clearTimeout(timer));
  el.addEventListener('focusout', (e) => { if (!el.contains(e.relatedTarget)) armar(); });
  el.querySelector('.aviso-fechar').addEventListener('click', fechar);
  const item = acao === 'Desfazer' && fn ? { msg, fn, feito: false } : null;
  if (item) { desfazeres.push(item); if (desfazeres.length > 10) desfazeres.shift(); }
  if (acao) {
    el.querySelector('.aviso-acao').addEventListener('click', () => {
      if (item) { if (item.feito) return; item.feito = true; }
      fechar(); if (fn) fn();
    });
  }
  // Um aviso visível por vez; os Desfazer anteriores continuam na pilha (Ctrl+Z).
  box.replaceChildren(el);
  armar();
}
/** Desfaz a ação mais recente que ainda não foi desfeita (Ctrl+Z no computador). */
function desfazerUltimo() {
  for (let i = desfazeres.length - 1; i >= 0; i--) {
    const it = desfazeres[i];
    desfazeres.splice(i, 1);
    if (it.feito) continue;
    it.feito = true;
    it.fn();
    aviso('Desfeito: ' + it.msg);
    return true;
  }
  aviso('Nada para desfazer.');
  return false;
}

function baixar(nome, conteudo, tipo) {

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function exportarJSON() {

  baixar(`financas-backup-${hojeIso()}.json`, JSON.stringify(d, null, 1), 'application/json');
}
function exportarCSV() {
  const mapa = mapaCats();
  const linhas = [['Ano', 'Mês', 'Dia', 'Grupo', 'Categoria', 'Descrição', 'Valor']];
  for (const ano of Object.keys(S.dados.anos).sort()) {
    for (const l of S.dados.anos[ano].lancamentos) {
      const c = mapa[l.categoriaId];
      linhas.push([ano, Mes(l.mes), l.dia ?? '', c ? GRUPOS[c.grupo] : '', c ? c.nome : l.categoriaId, l.descricao || '', String(l.valor).replace('.', ',')]);
    }
  }
  const csv = '﻿' + linhas.map((l) => l.map((x) => {
    let s = String(x);
    if (/^[=+\-@]/.test(s) && !/^-?\d/.test(s)) s = "'" + s;
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
  baixar(`financas-lancamentos-${hojeIso()}.csv`, csv, 'text/csv;charset=utf-8');
}

const hist = (() => {
  const g = typeof google !== 'undefined' && google.script && google.script.history;
  return {
    push(estado) { try { if (g) g.push(estado, null, estado.tela + (estado.n ? '-' + estado.n : '')); else history.pushState(estado, ''); } catch (e) { /* sem histórico */ } },
    replace(estado) { try { if (g) g.replace(estado, null, estado.tela); else history.replaceState(estado, ''); } catch (e) { /* sem histórico */ } },
    ouvir(fn) { try { if (g) g.setChangeHandler((ev) => fn(ev && ev.state)); else window.addEventListener('popstate', (ev) => fn(ev.state)); } catch (e) { /* sem histórico */ } },
  };
})();
hist.ouvir((estado) => {
  const n = estado && typeof estado.n === 'number' ? estado.n : 0;
  while (pilha.length > n) fecharFolha(true);
  if (estado && estado.tela && TELAS[estado.tela] && estado.tela !== S.tela) { S.tela = estado.tela; S.rolarPlanilha = true; render(); }
});
function irPara(tela, opc = {}) {
  if (!TELAS[tela]) return;
  if (S.tela === tela) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  S.tela = tela; S.rolarPlanilha = true;
  if (opc.historico !== false) hist.push({ tela, n: 0 });
  render();
  window.scrollTo(0, 0);
  $('#tela').focus({ preventScroll: true });
  if (tela === 'ajustes') verificarAtualizacao();
}
function mudarMes(d) {
  const k = deChave(chaveMes(S.ano, S.mes) + d);
  S.ano = k.ano; S.mes = k.mes;
  render();
}
async function moverCategoria(cid, dir) {
  const c = catPorId(cid); if (!c) return;
  const lista = catsDoGrupo(c.grupo);
  const i = lista.findIndex((x) => x.id === cid); const j = i + dir;
  if (j < 0 || j >= lista.length) return;
  const a = lista[i]; const b = lista[j];
  registrar({ t: 'cat', c: { ...a, ordem: b.ordem } });
  registrar({ t: 'cat', c: { ...b, ordem: a.ordem } });
}
function definirGuardar(valor) {
  const ano = S.ano; const mes = S.mes;
  const existente = catGuardar();
  const antes = existente ? planoExp(existente.id, ano, mes) : 0;
  const gid = existente ? existente.id : (catPorId('guardar') ? idUnico('Guardar') : 'guardar');
  const criada = !existente;
  if (criada) {
    const fixos = catsDoGrupo('fixo');
    const ordem = (fixos.length ? Math.min(...fixos.map((c) => c.ordem)) : Math.min(...cats().map((c) => c.ordem), 1)) - 1;
    registrar({ t: 'cat', c: { id: gid, nome: 'Guardar', grupo: 'fixo', ordem } });
  }
  if (valor > 0) registrar({ t: 'orc', ano, categoriaId: gid, mes, valor });
  const desfazer = () => {
    if (criada) registrar({ t: 'cat-', id: gid });
    else registrar({ t: 'orc', ano, categoriaId: gid, mes, valor: antes || null });
  };
  if (criada) aviso(`Categoria “Guardar” criada${valor > 0 ? ` com meta de ${moeda(valor)}` : ''}.`, { acao: 'Desfazer', fn: desfazer });
  else if (valor > 0) aviso(`Meta de economia: ${moeda(valor)}.`, { acao: 'Desfazer', fn: desfazer });
}
function planejarSemPlano() {
  const ano = S.ano; const mes = S.mes; const gid = (catGuardar() || {}).id || null;
  const criados = []; let total = 0;
  for (const c of cats()) {
    if (c.grupo === 'renda' || c.id === gid) continue;
    if (planoExp(c.id, ano, mes) !== 0) continue;
    const real = celReal(c.id, ano, mes).soma;
    if (!(real > 0)) continue;
    const med = media3(c.id, ano, mes);
    const valor = med > 0 ? med : real;
    registrar({ t: 'orc', ano, categoriaId: c.id, mes, valor });
    criados.push(c.id); total += valor;
  }
  if (!criados.length) { aviso('Nenhuma categoria de consumo sem plano para planejar.'); return; }
  aviso(`Plano criado para ${criados.length} categoria${criados.length > 1 ? 's' : ''}: ${moeda(total)}. O que faltar desses planos fica reservado no disponível.`, {
    acao: 'Desfazer',
    fn: () => criados.forEach((id) => registrar({ t: 'orc', ano, categoriaId: id, mes, valor: null })),
  });
}

document.addEventListener('change', (e) => { const el = e.target.closest('[data-mudar]'); if (el && MUDAR[el.dataset.mudar]) MUDAR[el.dataset.mudar](el, e); });
document.addEventListener('submit', (e) => {
  if (!e.target || e.target.id !== 'quick-form') return;
  e.preventDefault();
  const inp = $('#quick');
  const txt = inp ? inp.value.trim() : '';
  if (!txt) return;
  if (lancarRapido(txt)) {
    S.quick = '';
    if (inp) { inp.value = ''; inp.focus(); }
  }
});
// Campo de valor seleciona tudo ao receber foco: digitar substitui em vez de emendar.
document.addEventListener('focusin', (e) => { const el = e.target; if (el.matches && el.matches('input.valor')) setTimeout(() => { try { el.select(); } catch (err) { /* sem seleção */ } }, 0); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-digitar]'); if (el && DIGITAR[el.dataset.digitar]) DIGITAR[el.dataset.digitar](el, e); });
function prenderFoco(e) {
  const f = pilha[pilha.length - 1]; if (!f) return;
  const foc = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', f.el).filter((x) => !x.disabled && x.offsetParent !== null);
  if (!foc.length) return;
  const i = foc.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); foc[foc.length - 1].focus(); }
  else if (!e.shiftKey && (i === foc.length - 1 || i === -1)) { e.preventDefault(); foc[0].focus(); }
}
function navegarPlanilha(e, td) {
  const r = Number(td.dataset.r); const c = Number(td.dataset.c);
  const mov = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (mov) {

document.addEventListener('keydown', (e) => {

  if (e.key === 'Tab' && pilha.length) { prenderFoco(e); return; }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); abrirNovo(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'z' && !digitando) { e.preventDefault(); desfazerUltimo(); return; }
  if (digitando || e.ctrlKey || e.metaKey || e.altKey) return;

    e.preventDefault();

    if (q && q.offsetParent !== null) q.focus(); else abrirNovo();
  }
  else if (e.key === '/' && S.tela === 'extrato') { e.preventDefault(); const b = $('#busca'); if (b) b.focus(); }
  else if (S.tela === 'planilha' && alvo.closest && alvo.closest('td.cel')) navegarPlanilha(e, alvo.closest('td.cel'));
});

/* =====================================================================
   12. Partida
   ===================================================================== */
function aplicarTema(t) {
  if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t;
  else delete document.documentElement.dataset.tema;
}
function montarApp() {
  $('#carga').hidden = true; $('#boasvindas').hidden = true; $('#app').hidden = false;
  S.montado = true;
  render();
  setTimeout(() => verificarAtualizacao(), 4000);
}
function mostrarErroCarga(e) {
  const box = $('#carga');
  box.hidden = false;
  box.innerHTML = `<span class="logo logo-grande" aria-hidden="true"><i></i><i></i><i></i></span><h1 style="font-size:20px">Não consegui abrir a planilha</h1>`
    + `<p class="sub" style="max-width:420px">${esc(e.message)}</p><button type="button" class="botao primario" data-acao="recarregar">Tentar de novo</button>`;
}
let tRecarga = 0;
let tentativasCarga = 0;
async function carregarDoServidor({ inicial = false, filaSalva = null, filaAntiga = null } = {}) {
  try {
    const d = JSON.parse(await chamar('carregar'));
    let antigasRecuperadas = 0;
    if (filaAntiga && filaAntiga.planilha === d.planilha.id && Array.isArray(filaAntiga.ops)) {
      const vistos = new Set(S.fila.map((op) => JSON.stringify(op)));
      const antigas = filaAntiga.ops.filter((op) => !vistos.has(JSON.stringify(op)));
      if (antigas.length) S.fila = S.fila.concat(antigas);
      antigasRecuperadas = antigas.length;
      LS.apagarAntigo('fila');
    }
    const pend = S.fila.length ? S.fila : (filaSalva && filaSalva.planilha === d.planilha.id && Array.isArray(filaSalva.ops) ? filaSalva.ops : []);
    for (const op of pend) { try { aplicarOp(d, op); } catch (err) { /* operação velha que não se aplica */ } }
    const recuperadas = inicial && !S.fila.length ? pend.length : (inicial ? antigasRecuperadas : 0);
    S.fila = pend.slice();
    S.dados = d; S.versao++;
    S.offline = false; S.falhas = 0; S.atualizando = false; S.ultimaSync = Date.now(); tentativasCarga = 0;
    aplicarTema(d.tema); LS.gravar('tema', d.tema);
    salvarCache(); persistirFila();
    if (!d.categorias.length) { mostrarBoasVindas(); return; }
    if (!S.montado) montarApp(); else render();
    fixarGuardar();
    if (recuperadas) aviso(`${recuperadas === 1 ? 'Uma alteração feita' : recuperadas + ' alterações feitas'} sem conexão ${recuperadas === 1 ? 'foi recuperada' : 'foram recuperadas'} e já está${recuperadas === 1 ? '' : 'ão'} sendo gravada${recuperadas === 1 ? '' : 's'}.`);
    if (S.fila.length) enviar();
  } catch (e) {
    S.atualizando = false; S.offline = true;
    if (S.montado) {
      renderSinc();
      if (!tentativasCarga) aviso('Sem conexão com a planilha. Mostrando a última cópia deste aparelho.', { tipo: 'erro' });
      tentativasCarga++;
      clearTimeout(tRecarga);
      tRecarga = setTimeout(() => carregarDoServidor({ inicial, filaSalva, filaAntiga }), [3, 6, 15, 30, 60][Math.min(tentativasCarga - 1, 4)] * 1000);
    } else {
      mostrarErroCarga(e);
    }
  }
}
function lerAtalhosDaUrl() {
  const aplicar = (p) => {
    if (!p || !S.montado) return;
    if (p.tela && TELAS[p.tela]) irPara(p.tela, { historico: false });
    if (p.novo !== undefined) abrirNovo({ cat: p.novo && catPorId(p.novo) ? p.novo : null, hoje: true });
  };
  try {
    const g = typeof google !== 'undefined' && google.script && google.script.url;
    if (g) g.getLocation((loc) => aplicar(loc && loc.parameter));
    else aplicar(Object.fromEntries(new URLSearchParams(location.search)));
  } catch (e) { /* sem atalhos */ }
}
async function iniciar() {
  aplicarTema(LS.ler('tema') || 'auto');
  const cache = LS.ler('cache');
  const filaSalva = LS.ler('fila');
  const filaAntiga = LS.lerAntigo('fila');
  if (cache && Array.isArray(cache.categorias) && cache.categorias.length && cache.anos) {
    S.dados = cache;
    if (filaSalva && filaSalva.planilha === (cache.planilha || {}).id && Array.isArray(filaSalva.ops)) {
      S.fila = filaSalva.ops.slice();
      for (const op of S.fila) { try { aplicarOp(S.dados, op); } catch (e) { /* ignora */ } }
    }
    S.atualizando = true;
    montarApp();
  }
  hist.replace({ tela: S.tela, n: 0 });
  await carregarDoServidor({ inicial: true, filaSalva, filaAntiga });
  lerAtalhosDaUrl();
}
function acompanharVirada() {
  const h = hoje(); const agora = chaveMes(h.ano, h.mes);
  if (S.mesDeHoje !== undefined && S.mesDeHoje !== agora && chaveMes(S.ano, S.mes) === S.mesDeHoje) {
    S.ano = h.ano; S.mes = h.mes;
    if (S.montado) render();
  }
  S.mesDeHoje = agora;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { acompanharVirada(); verificarNovidades(); } });
window.addEventListener('focus', () => verificarNovidades());
window.addEventListener('online', () => { S.offline = false; enviar(); verificarNovidades(true); });

setInterval(() => { if (document.visibilityState === 'visible') verificarNovidades(); }, 180000);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => agendarRender());

iniciar();
