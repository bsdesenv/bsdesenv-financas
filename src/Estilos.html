<style>
/* =====================================================================
   Tokens — contraste orientado a WCAG AA nos dois temas
   ===================================================================== */
:root {
  --fundo: #F3F5F1; --cartao: #FFFEFC; --cartao-2: #F8FAF7;
  --tinta: #18251F; --tinta-2: #46574E; --tinta-3: #607168;
  --linha: #DCE5DE; --linha-2: #EAF0EB; --trilho: #E6ECE7;
  --chip: #EEF4EF; --chip-borda: #D2DED5;
  --acento: #176B52; --acento-tinta: #FFFFFF; --acento-fraco: #E6F2EB; --acento-forte: #14513F;
  --gasto: #336C83;
  --calor-acima: #C55D3C; --calor-abaixo: #648CA6;
  --ok: #16764C; --acima: #B5472E; --atencao: #96620F;
  --aviso-fundo: #FFF5E6; --aviso-borda: #F1D8AD; --aviso-tinta: #80520B;
  --ok-fundo: #E9F5ED; --ok-borda: #B9DEC6; --ok-tinta: #155A3B;
  --perigo: #B42318;
  --nav: rgba(255, 254, 252, .94); --veu: rgba(18, 29, 23, .46);
  --toast: #18251F; --toast-tinta: #FFFFFF; --toast-acao: #A8E4C5;
  --sombra: 0 1px 2px rgba(24, 37, 31, .04), 0 8px 24px rgba(24, 37, 31, .055);
  --sombra-forte: 0 18px 50px rgba(13, 26, 19, .22);
  --raio: 18px; --raio-m: 13px; --raio-p: 9px;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fundo: #0E1511; --cartao: #151E19; --cartao-2: #1A2720;
    --tinta: #EAF1EB; --tinta-2: #B7C6BB; --tinta-3: #91A397;
    --linha: #2A3930; --linha-2: #202D25; --trilho: #2B3A31;
    --chip: #1D2A23; --chip-borda: #35463A;
    --acento: #65C99A; --acento-tinta: #0C1710; --acento-fraco: #19382A; --acento-forte: #9AE0B9;
    --gasto: #7AB6CC;
    --calor-acima: #F09978; --calor-abaixo: #8FBED4;
    --ok: #66D3A0; --acima: #FFA184; --atencao: #F1C36D;

    --ok-fundo: #142D21; --ok-borda: #235238; --ok-tinta: #91DEB1;
    --perigo: #FF8B80;
    --nav: rgba(21, 30, 25, .94); --veu: rgba(0, 0, 0, .62);
    --toast: #EAF1EB; --toast-tinta: #18251F; --toast-acao: #14513F;
    --sombra: 0 1px 2px rgba(0, 0, 0, .28), 0 8px 24px rgba(0, 0, 0, .2);
    --sombra-forte: 0 18px 50px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-tema="escuro"] {
  --fundo: #0E1511; --cartao: #151E19; --cartao-2: #1A2720;
  --tinta: #EAF1EB; --tinta-2: #B7C6BB; --tinta-3: #91A397;
  --linha: #2A3930; --linha-2: #202D25; --trilho: #2B3A31;
  --chip: #1D2A23; --chip-borda: #35463A;
  --acento: #65C99A; --acento-tinta: #0C1710; --acento-fraco: #19382A; --acento-forte: #9AE0B9;
  --gasto: #7AB6CC;
  --calor-acima: #F09978; --calor-abaixo: #8FBED4;
  --ok: #66D3A0; --acima: #FFA184; --atencao: #F1C36D;
  --aviso-fundo: #302514; --aviso-borda: #59431D; --aviso-tinta: #F1CB80;
  --ok-fundo: #142D21; --ok-borda: #235238; --ok-tinta: #91DEB1;
  --perigo: #FF8B80;
  --nav: rgba(21, 30, 25, .94); --veu: rgba(0, 0, 0, .62);
  --toast: #EAF1EB; --toast-tinta: #18251F; --toast-acao: #14513F;
  --sombra: 0 1px 2px rgba(0, 0, 0, .28), 0 8px 24px rgba(0, 0, 0, .2);
  --sombra-forte: 0 18px 50px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* Cores das categorias (escolhidas pelo id; no escuro, versões claras) */
.cor-0 { --c: #176B52; } .cor-1 { --c: #176B87; } .cor-2 { --c: #B5472E; } .cor-3 { --c: #3757A4; } .cor-4 { --c: #A23A5B; }
.cor-5 { --c: #96620F; } .cor-6 { --c: #6941A5; } .cor-7 { --c: #117C76; } .cor-8 { --c: #8B3F8F; } .cor-9 { --c: #5B7C28; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) .cor-0 { --c: #67D4A2; } :root:not([data-tema="claro"]) .cor-1 { --c: #74C4DD; }
  :root:not([data-tema="claro"]) .cor-2 { --c: #FDB08A; } :root:not([data-tema="claro"]) .cor-3 { --c: #9BB4FF; }
  :root:not([data-tema="claro"]) .cor-4 { --c: #F5A3BC; } :root:not([data-tema="claro"]) .cor-5 { --c: #EAC56C; }
  :root:not([data-tema="claro"]) .cor-6 { --c: #C4A5F2; } :root:not([data-tema="claro"]) .cor-7 { --c: #68D6C9; }
  :root:not([data-tema="claro"]) .cor-8 { --c: #E5A6E5; } :root:not([data-tema="claro"]) .cor-9 { --c: #B8D77B; }
}
:root[data-tema="escuro"] .cor-0 { --c: #67D4A2; } :root[data-tema="escuro"] .cor-1 { --c: #74C4DD; }
:root[data-tema="escuro"] .cor-2 { --c: #FDB08A; } :root[data-tema="escuro"] .cor-3 { --c: #9BB4FF; }
:root[data-tema="escuro"] .cor-4 { --c: #F5A3BC; } :root[data-tema="escuro"] .cor-5 { --c: #EAC56C; }
:root[data-tema="escuro"] .cor-6 { --c: #C4A5F2; } :root[data-tema="escuro"] .cor-7 { --c: #68D6C9; }
:root[data-tema="escuro"] .cor-8 { --c: #E5A6E5; } :root[data-tema="escuro"] .cor-9 { --c: #B8D77B; }

/* =====================================================================
   Base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--fundo); color: var(--tinta);
  font: 400 15px/1.5 var(--fonte);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100vh; min-height: 100dvh;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: var(--acento); }
input, select, textarea { min-width: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; border-radius: 8px; }
.ic { flex: 0 0 auto; display: block; }
.num, .numero-heroi, .kpi-valor, .ll-valor, .lc-valores, .planilha { font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pular { position: absolute; left: 8px; top: -60px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: var(--acento); color: var(--acento-tinta); }
.pular:focus { top: 8px; }
.rotulo { font-size: 13px; font-weight: 500; color: var(--tinta-2); }
.sub { font-size: 13px; color: var(--tinta-3); }
.txt-acima { color: var(--acima) !important; }
.txt-atencao { color: var(--atencao) !important; }
.txt-ok { color: var(--ok) !important; }
.link { color: var(--acento); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.link:hover { text-decoration: underline; }

/* =====================================================================
   Estrutura
   ===================================================================== */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.lateral { display: none; }
.coluna { min-width: 0; display: flex; flex-direction: column; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
.topo {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) 16px 8px 8px;
  background: var(--fundo);
}
@supports (backdrop-filter: blur(8px)) {
  .topo { background: color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); }
}
.topo-esq, .topo-dir { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topo-dir { flex: 0 0 auto; }
.tela { padding: 8px 20px 28px; outline: none; min-width: 0; }
.titulo-tela { font-size: 22px; font-weight: 650; padding-left: 12px; }
.versao { display: inline-flex; align-items: center; font-size: 11px; line-height: 1; font-weight: 600; color: var(--tinta-3); border: 1px solid var(--linha); border-radius: 99px; padding: 4px 7px; vertical-align: middle; }
.titulo-tela .versao { margin-left: 6px; }

.navmes { display: flex; align-items: center; gap: 2px; min-width: 0; }
.navmes-txt { display: flex; flex-direction: column; align-items: center; min-width: 118px; line-height: 1.25; }
.navmes-txt h1 { font-size: 18px; font-weight: 650; white-space: nowrap; }
.navmes-nome { font-size: 12px; font-weight: 500; color: var(--tinta-3); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.inferior {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-around; align-items: center;
  padding: 6px 6px max(10px, env(safe-area-inset-bottom));
  background: var(--cartao); border-top: 1px solid var(--linha);
}
@supports (backdrop-filter: blur(8px)) { .inferior { background: var(--nav); backdrop-filter: blur(12px); } }
.inf-item {
  width: 64px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--tinta-3); font-size: 11px; font-weight: 500; border-radius: 12px;
}
.inf-item[aria-current="page"] { color: var(--acento); font-weight: 600; }
.inf-item:hover { background: var(--cartao-2); }
.inf-mais {
  width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
  background: var(--acento); color: var(--acento-tinta); box-shadow: 0 8px 20px color-mix(in srgb, var(--acento) 28%, transparent);
  transition: transform .16s ease, box-shadow .16s ease;
}
.inf-mais:active { transform: translateY(1px) scale(.98); }

.lateral-marca { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; min-width: 0; }
.lateral-marca strong { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lateral-marca small { display: block; font-size: 12px; color: var(--tinta-3); }
.logo {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px; background: var(--acento);
  display: inline-flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 8px;
}
.logo i { width: 5px; border-radius: 2px; background: color-mix(in srgb, var(--acento-tinta) 60%, var(--acento)); }
.logo i:nth-child(1) { height: 9px; } .logo i:nth-child(2) { height: 16px; background: var(--acento-tinta); } .logo i:nth-child(3) { height: 6px; }
.logo-grande { width: 56px; height: 56px; flex-basis: 56px; border-radius: 16px; gap: 5px; padding-bottom: 13px; }
.logo-grande i { width: 8px; } .logo-grande i:nth-child(1) { height: 15px; } .logo-grande i:nth-child(2) { height: 26px; } .logo-grande i:nth-child(3) { height: 10px; }
.lat-item {
  position: relative;
  width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px;
  color: var(--tinta-2); font-weight: 500; text-align: left;
}
.lat-item:hover { background: var(--chip); }
.lat-item[aria-current="page"] { background: var(--acento-fraco); color: var(--acento-forte); font-weight: 650; }
.lat-item[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--acento); }
.lat-rodape { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--fundo); }

/* =====================================================================
   Componentes
   ===================================================================== */
.cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; min-width: 0; display: flex; flex-direction: column; box-shadow: var(--sombra); }
.cartao > h2, .cartao-topo h2 { font-size: 15px; }
.cartao-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -4px 0 6px; min-height: 36px; }
.icone {
  width: 44px; height: 44px; border-radius: 12px; flex: 0 0 44px;
  display: inline-flex; align-items: center; justify-content: center; color: var(--tinta-2);
}
.icone:hover { background: var(--chip); }
.botao {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--chip-borda);
  background: var(--cartao); color: var(--tinta); font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap;
  transition: border-color .16s ease, background-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.botao:hover { border-color: var(--tinta-3); }
.botao:active { transform: translateY(1px); }
.botao.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-tinta); box-shadow: 0 4px 12px color-mix(in srgb, var(--acento) 18%, transparent); }
.botao.primario:hover { filter: brightness(1.08); }
.botao.perigo { color: var(--perigo); border-color: color-mix(in srgb, var(--perigo) 45%, transparent); }
.botao.fantasma { border-color: transparent; background: transparent; color: var(--acento); }
.botao.fantasma:hover { background: var(--acento-fraco); }
.botao.pequeno { min-height: 36px; padding: 0 12px; font-size: 13px; }
.botao.grande { min-height: 52px; font-size: 16px; border-radius: 14px; width: 100%; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
kbd { font: 500 12px var(--fonte); padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--tinta-2); border: 1px solid var(--linha); }
.botao.primario kbd { background: rgba(255, 255, 255, .18); color: inherit; border-color: transparent; }

.sinc {
  min-height: 44px; padding: 0 12px 0 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--linha); background: var(--cartao); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.sinc.ok { color: var(--ok); }
.sinc.enviando { color: var(--tinta-2); }
.sinc.off { color: var(--aviso-tinta); background: var(--aviso-fundo); border-color: var(--aviso-borda); }
.sinc.enviando .ic { animation: pulsar 1.2s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .35; } }
.sinc-lateral { width: 100%; justify-content: flex-start; border: 0; background: transparent; padding: 0; min-height: 32px; }

.mono {
  flex: 0 0 40px; width: 40px; height: 40px; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  background: var(--chip); color: var(--tinta-2);
}
.mono[class*="cor-"] { background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.mono.p { flex-basis: 36px; width: 36px; height: 36px; border-radius: 12px; font-size: 14px; }

.barra { display: block; position: relative; height: 7px; border-radius: 99px; background: var(--trilho); }
.barra.alta { height: 10px; }
.barra.tracejada { background: transparent; box-shadow: inset 0 0 0 1.5px var(--chip-borda); }
.barra .enchido { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--acento); max-width: 100%; }
.barra .enchido.acima { background: var(--acima); }
.barra .enchido.atencao { background: var(--atencao); }
.barra .ritmo { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--tinta-2); }
.legenda-barra { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--tinta-3); margin: 8px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--chip-borda);
  background: var(--cartao); color: var(--tinta); font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--acento); background: var(--acento-fraco); color: var(--acento-forte); font-weight: 600; }
.chip .ponto { width: 8px; height: 8px; border-radius: 99px; background: var(--c, var(--tinta-3)); }
.chip-select { padding: 0 6px 0 14px; position: relative; }
.chip-select select { border: 0; background: transparent; height: 40px; max-width: 190px; padding-right: 4px; }
@media (pointer: fine) { .chip { min-height: 36px; } .chip-select select { height: 32px; } }

.segmentado { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--chip); }
.segmentado button { flex: 1; min-height: 40px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--tinta-3); padding: 0 12px; white-space: nowrap; }
.segmentado button[aria-pressed="true"] { background: var(--cartao); color: var(--tinta); box-shadow: 0 1px 3px rgba(14, 21, 37, .14); }

.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--tinta-2); font-weight: 500; }
.entrada, .campo input, .campo select {
  min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--chip-borda);
  background: var(--cartao); color: var(--tinta); font-size: 15px; font-weight: 400; width: 100%;
}
.entrada:focus, .campo input:focus, .campo select:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px var(--acento-fraco); }
.entrada.valor { text-align: right; font-variant-numeric: tabular-nums; }
.marcar { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: var(--tinta-2); cursor: pointer; }
.marcar input { width: 20px; height: 20px; accent-color: var(--acento); }

.nota { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.45; }
.nota .ic { margin-top: 1px; }
.nota-aviso { background: var(--aviso-fundo); color: var(--aviso-tinta); }
.nota-ok { background: var(--ok-fundo); color: var(--ok-tinta); }
.nota-info { background: var(--acento-fraco); color: var(--acento-forte); }

.vazio { text-align: center; padding: 28px 12px; color: var(--tinta-3); display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* Linhas de lista */
.lista { background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px; overflow: hidden; }
.linha-lanc, .linha-cat {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 9px 14px 9px 12px; border-top: 1px solid var(--linha-2); min-height: 60px; background: transparent;
}
.linha-lanc:first-child, .linha-cat:first-child { border-top: 0; }
.linha-lanc:hover, .linha-cat:hover { background: var(--cartao-2); }
.ll-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ll-tit { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ll-sub { font-size: 13px; color: var(--tinta-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ll-valor { font-size: 15px; font-weight: 600; white-space: nowrap; }
.ll-valor.renda { color: var(--ok); }
.lc-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lc-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.lc-nome { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lc-valores { white-space: nowrap; color: var(--tinta-2); font-size: 13px; }
.lc-valores strong { color: var(--tinta); font-weight: 600; font-size: 14px; }
.lc-nota { font-size: 12px; color: var(--tinta-3); }
.lc-media { display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--tinta-3); }
.lc-media strong { color: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.lc-media em { font-style: normal; font-weight: 600; }
.cats-resumo { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 10px; font-size: 12px; color: var(--tinta-3); }
.cats-resumo strong { color: var(--tinta); font-weight: 600; }
.cats-acoes { margin-top: 12px; }
.grafico-variaveis { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linha-2); }
.gv-titulo { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--tinta-3); margin-bottom: 6px; }
.gv-barra { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--trilho); gap: 2px; }
.gv-barra i { display: block; height: 100%; }
.gv-legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--tinta-2); }
.gv-legenda span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }

/* =====================================================================
   Início
   ===================================================================== */
.grade-inicio { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.heroi { padding: 22px; background: linear-gradient(135deg, var(--acento-fraco), var(--cartao) 72%); border-color: color-mix(in srgb, var(--acento) 18%, var(--linha)); }
.numero-heroi { font-size: clamp(36px, 10vw, 48px); font-weight: 650; letter-spacing: -.03em; line-height: 1.08; margin: 6px 0 4px; }
.numero-heroi.negativo { color: var(--acima); }
.heroi-topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; flex: 1; }
.heroi-principal { min-width: 0; }
.heroi-bridge { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; font-size: 12px; color: var(--tinta-3); }
.heroi-bridge strong { color: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.heroi-legenda { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.heroi-legenda > div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tinta-2); }
.heroi-legenda i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.heroi-legenda span { flex: 1; min-width: 0; }
.heroi-legenda strong { color: var(--tinta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.heroi-legenda em { font-style: normal; font-size: 11px; color: var(--tinta-3); min-width: 34px; text-align: right; }
.anel { width: 164px; height: 164px; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; flex: none; }
.anel::after { content: ''; position: absolute; inset: 16px; border-radius: 50%; background: var(--cartao); }
.anel-centro { position: relative; z-index: 1; text-align: center; display: flex; flex-direction: column; gap: 1px; }
.anel-centro strong { font-size: 24px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.anel-centro span { font-size: 11px; color: var(--tinta-3); }
.heroi-barra { display: none; height: 12px; border-radius: 99px; overflow: hidden; background: var(--trilho); margin-top: 10px; }
.heroi-barra i { display: block; height: 100%; }
.heroi-nota { margin-top: 10px; font-size: 12px; color: var(--tinta-3); }
.heroi-composicao { margin-top: 14px; border-top: 1px solid var(--linha-2); }
.heroi-composicao > div { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--linha-2); font-size: 13px; color: var(--tinta-2); }
.heroi-composicao > div:last-child { border-bottom: 0; }
.heroi-composicao i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.heroi-composicao span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heroi-composicao strong { color: var(--tinta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.heroi-composicao em { font-style: normal; font-size: 11px; color: var(--tinta-3); min-width: 34px; text-align: right; }
.heroi-composicao .subtotal { color: var(--tinta); font-weight: 600; }
.heroi-composicao .total { border-top: 1px solid var(--linha); margin-top: 2px; padding-top: 8px; color: var(--tinta); font-weight: 650; }
.heroi-composicao .total strong { color: var(--acento); font-size: 16px; }
.heroi .ritmo-bloco { margin-top: 14px; }
.heroi .nota { margin-top: 14px; }
.conta-heroi { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linha-2); }
.conta-heroi > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--tinta-2); }
.conta-heroi strong { color: var(--tinta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.conta-heroi .total { margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--linha); color: var(--tinta); font-weight: 650; }
.conta-heroi .total strong { color: var(--acento); font-size: 16px; }
.conta-heroi .subtotal { margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--linha-2); color: var(--tinta); font-weight: 600; }
.reserva-linha { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--linha-2); }
.reserva-linha:first-child { border-top: 0; }
.reserva-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.reserva-txt strong { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reserva-txt span { font-size: 12px; color: var(--tinta-3); }
.reserva-valor { font-size: 14px; font-weight: 600; white-space: nowrap; }
.reserva-valor.acima { color: var(--acima); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-width: 0; }
.kpi-topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-icone { width: 26px; height: 26px; border-radius: 9px; background: var(--acento-fraco); color: var(--acento-forte); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.kpi-valor { font-size: 20px; font-weight: 700; letter-spacing: -.025em; }
.kpi-valor.ok { color: var(--ok); } .kpi-valor.acima { color: var(--acima); }
.kpi .spark { width: 100%; height: 38px; display: block; margin-top: auto; }
.mini-barras { display: flex; align-items: flex-end; gap: 2px; height: 38px; margin-top: auto; }
.mini-barras i { flex: 1; min-width: 2px; background: var(--tinta-3); opacity: .35; border-radius: 2px 2px 0 0; }
.mini-barras i.hoje { background: var(--acento); opacity: 1; }
.kpi-lista { display: flex; flex-direction: column; gap: 3px; margin-top: auto; font-size: 12px; color: var(--tinta-3); min-width: 0; }
.kpi-lista > div { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.kpi-lista span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-lista strong { color: var(--tinta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi-vazio { margin-top: auto; }
.kpi-meta { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.kpi-meta .meta-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--tinta-3); }
.kpi-meta .meta-topo strong { color: var(--tinta-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi-meta .barra { height: 8px; }
.kpi-meta .spark { margin-top: 0; height: 30px; }
.lado { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.item-vencer { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--linha-2); }
.item-vencer:first-child { border-top: 0; }
.iv-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; color: var(--tinta-3); }
.iv-txt strong { font-size: 15px; color: var(--tinta); font-weight: 600; }
.aviso-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--linha-2); font-size: 14px; }
.aviso-item:first-of-type { border-top: 0; }
.aviso-item .marca-aviso { flex: 0 0 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--acento-fraco); color: var(--acento); }
.aviso-item.acima .marca-aviso { background: color-mix(in srgb, var(--acima) 14%, transparent); color: var(--acima); }
.aviso-item.atencao .marca-aviso { background: color-mix(in srgb, var(--atencao) 14%, transparent); color: var(--atencao); }
.aviso-item p span { color: var(--tinta-2); }
.cats-avisos { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--linha-2); }
.cats-avisos .grupo-titulo { padding: 2px 0 4px; font-size: 12px; }
.cats-avisos .aviso-item { padding: 8px 0; font-size: 13px; }
.aviso-corpo { flex: 1; min-width: 0; }
.aviso-corpo p { margin: 0; }
.aviso-detalhe { margin-top: 2px; }
.aviso-detalhe summary { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; color: var(--acento); font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; }
.aviso-detalhe summary::-webkit-details-marker { display: none; }
.aviso-detalhe summary::before { content: '▸'; font-size: 10px; transition: transform .15s; }
.aviso-detalhe[open] summary::before { transform: rotate(90deg); }
.aviso-contas { margin-top: 2px; padding-top: 2px; border-top: 1px dashed var(--linha-2); max-height: 280px; overflow: auto; overscroll-behavior: contain; }
.aviso-conta { width: 100%; min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-top: 1px solid var(--linha-2); text-align: left; font-size: 12px; background: transparent; }
.aviso-conta:first-child { border-top: 0; }
.aviso-conta:hover { background: var(--cartao-2); }
.aviso-conta-data { flex: 0 0 42px; color: var(--tinta-3); font-variant-numeric: tabular-nums; }
.aviso-conta-desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); }
.aviso-conta-valor { white-space: nowrap; color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (pointer: coarse) {
  .aviso-detalhe summary, .aviso-conta { min-height: 44px; }
}

.g-ano .grafico-ano { flex: 1; display: flex; flex-direction: column; min-height: 0; margin: 6px 0 0; }
.g-ano .ga-barras { flex: 1; min-height: 174px; }
.ga-barras { position: relative; display: flex; gap: 4px; --ga-rot: 20px; }
.ga-barras::after { content: ''; position: absolute; left: 0; right: 0; top: calc((100% - var(--ga-rot)) * var(--hp)); height: 1px; background: var(--chip-borda); }
.ga-mes { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; border-radius: 8px; padding: 0; }
.ga-mes:hover { background: var(--cartao-2); }
.ga-col { flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; }
.ga-pos { height: calc(var(--hp) * 100%); width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.ga-neg { height: calc(var(--hn) * 100%); width: 100%; display: flex; align-items: flex-start; justify-content: center; }
.ga-pos i, .ga-neg i { display: block; width: 68%; max-width: 22px; }
.ga-pos i { background: var(--acento); border-radius: 6px 6px 2px 2px; }
.ga-neg i { background: var(--acima); border-radius: 2px 2px 6px 6px; }
.ga-mes.atual i, .ga-mes.futuro i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--acento); }
.ga-mes.atual .ga-neg i, .ga-mes.futuro .ga-neg i { box-shadow: inset 0 0 0 1.5px var(--acima); }
.ga-rot { font-size: 11px; color: var(--tinta-3); margin-top: 4px; height: 16px; display: flex; align-items: flex-end; }
.ga-mes.sel .ga-rot { color: var(--acento); font-weight: 700; }
.ga-resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--linha-2); }
.ga-resumo span { display: block; font-size: 11px; color: var(--tinta-3); }
.ga-resumo strong { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.legenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--tinta-2); }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* =====================================================================
   Extrato
   ===================================================================== */
.extrato-ferramentas { display: flex; flex-direction: column; gap: 8px; }
.campo-busca { position: relative; display: block; }
.campo-busca .ic { position: absolute; left: 14px; top: 13px; color: var(--tinta-3); pointer-events: none; }
.campo-busca input {
  width: 100%; min-height: 44px; padding: 0 14px 0 42px; border-radius: 12px; border: 1px solid var(--linha);
  background: var(--cartao); font-size: 15px;
}
.campo-busca input:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px var(--acento-fraco); }
.resumo-faixa {
  margin-top: 12px; padding: 12px 16px; border-radius: 16px; background: var(--cartao); border: 1px solid var(--linha);
  display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums;
}
.resumo-faixa strong { display: block; font-size: 17px; font-weight: 650; }
.dia-titulo { display: flex; justify-content: space-between; gap: 8px; padding: 16px 4px 6px; font-size: 13px; font-weight: 600; color: var(--tinta-2); }
.dia-titulo span:last-child { font-weight: 500; font-variant-numeric: tabular-nums; }

/* =====================================================================
   Mês e Planejar
   ===================================================================== */
.mes-cab { display: flex; flex-direction: column; gap: 12px; }
.planejar-ajuda { margin-top: 12px; border: 1px solid var(--linha); border-radius: 13px; background: var(--cartao-2); }
.planejar-ajuda summary { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; color: var(--acento); font-size: 13px; font-weight: 650; cursor: pointer; list-style: none; }
.planejar-ajuda summary::-webkit-details-marker { display: none; }
.planejar-ajuda summary::after { content: '+'; color: var(--acento); font-size: 20px; font-weight: 400; line-height: 1; }
.planejar-ajuda[open] summary::after { content: '−'; }
.planejar-ajuda p { padding: 0 14px 14px; }
.kpis-mes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-variant-numeric: tabular-nums; }
.kpis-mes > div { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 12px 14px; min-width: 0; box-shadow: var(--sombra); }
.kpis-mes span { display: block; font-size: 12px; color: var(--tinta-3); }
.kpis-mes strong { display: block; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis-mes .alerta { background: var(--aviso-fundo); border-color: var(--aviso-borda); }
.kpis-mes .alerta span, .kpis-mes .alerta strong { color: var(--aviso-tinta); }
.linha-plano { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--linha-2); }
.linha-plano:first-child { border-top: 0; }
.lp-nome { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 600; font-size: 14px; }
.lp-nome span { font-size: 12px; font-weight: 400; color: var(--tinta-3); }
.linha-plano .entrada { width: 124px; flex: none; }
.lp-campo { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: 0 0 124px; }
.lp-campo .link { font-size: 11px; min-height: 0; padding: 0; }

/* =====================================================================
   Planilha
   ===================================================================== */
.planilha-ferramentas { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.planilha-ferramentas .segmentado { flex: 0 0 auto; }
.planilha-caixa { overflow: auto; background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); }
.planilha-dica { display: none; align-items: center; gap: 7px; margin: 0 0 8px; color: var(--tinta-3); font-size: 12px; }
.planilha-dica .ic { color: var(--acento); }
table.planilha { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
.planilha th, .planilha td { padding: 0 7px; height: 36px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--linha-2); }
.planilha thead th { position: sticky; top: 0; z-index: 3; height: 44px; background: var(--cartao-2); font-size: 12px; font-weight: 600; color: var(--tinta-2); vertical-align: middle; }
.planilha thead th small { display: block; font-size: 10px; font-weight: 500; }
.planilha .cat { position: sticky; left: 0; z-index: 2; background: var(--cartao); text-align: left; font-weight: 500; max-width: 172px; overflow: hidden; text-overflow: ellipsis; padding-left: 12px; }
.planilha thead .cat { z-index: 4; background: var(--cartao-2); }
.planilha thead th.atual { background: var(--acento); color: var(--acento-tinta); }
.planilha tr.grupo th, .planilha tr.grupo td { height: 30px; padding-top: 10px; vertical-align: bottom; background: var(--cartao); }
.planilha tr.grupo th { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-2); }
.planilha td.cel { cursor: pointer; }
.planilha td.cel:hover, .planilha td.cel:focus-visible { box-shadow: inset 0 0 0 2px var(--acento); outline: none; border-radius: 0; }
.planilha td.atual { background-color: color-mix(in srgb, var(--acento) 7%, var(--cartao)); }
.planilha td.prev { color: var(--tinta-3); font-style: italic; outline: 1px dashed var(--chip-borda); outline-offset: -5px; }
.planilha td.zero { color: var(--tinta-3); }
.planilha td.total, .planilha th.total { background: var(--cartao-2); color: var(--tinta-2); }
.planilha tfoot th, .planilha tfoot td { position: sticky; z-index: 2; height: 36px; background: var(--cartao-2); font-weight: 600; border-bottom: 0; border-top: 1px solid var(--linha); }
.planilha tfoot tr:nth-child(1) > * { bottom: 72px; }
.planilha tfoot tr:nth-child(2) > * { bottom: 36px; }
.planilha tfoot tr:nth-child(3) > * { bottom: 0; }
.planilha tfoot th { left: 0; z-index: 3; text-align: left; padding-left: 12px; }
.planilha tfoot td.proj { font-style: italic; outline: 1px dashed var(--chip-borda); outline-offset: -5px; }
.mini { display: block; height: 3px; border-radius: 2px; background: var(--trilho); margin-top: 3px; position: relative; overflow: hidden; }
.mini i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acento); border-radius: inherit; }
.mini i.acima { background: var(--acima); }

/* =====================================================================
   Ajustes
   ===================================================================== */
.ajustes { display: grid; gap: 12px; max-width: 860px; }
.ajustes .cartao > h2 { margin-bottom: 4px; }
.ajustes .campo { margin-top: 12px; }
.linha-ajuste { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--linha-2); flex-wrap: wrap; }
.linha-ajuste:first-child { border-top: 0; }
.linha-ajuste .entrada { flex: 1 1 160px; }
.linha-ajuste select.entrada { flex: 0 0 132px; padding: 0 8px; }
.linha-ajuste .qtd { font-size: 12px; color: var(--tinta-3); min-width: 52px; text-align: right; }
.nova-cat { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--linha); }
.nova-cat .entrada { flex: 1 1 180px; }
.nova-cat select.entrada { flex: 0 0 140px; }

/* =====================================================================
   Folhas (bottom sheet no celular, painel lateral no computador)
   ===================================================================== */
.veu { position: fixed; inset: 0; z-index: 40; background: var(--veu); opacity: 0; transition: opacity .2s; }
.veu.visivel { opacity: 1; }
.folha {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 94vh; max-height: 94dvh;
  display: flex; flex-direction: column; background: var(--cartao); color: var(--tinta);
  border-radius: 24px 24px 0 0; box-shadow: var(--sombra-forte); outline: none;
  transform: translateY(104%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.folha.aberta { transform: none; }
.folha::before { content: ''; display: block; width: 36px; height: 5px; border-radius: 99px; background: var(--chip-borda); margin: 8px auto 0; flex: 0 0 auto; }
.folha-topo { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 16px; }
.folha-topo .titulos { flex: 1; min-width: 0; }
.folha-topo h2 { font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
